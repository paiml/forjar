# cargo-deny configuration
# Deployed from paiml/infra — do not edit manually.
# Spec: docs/specifications/unified-ci-pipeline.md

[graph]
targets = []
all-features = false
no-default-features = false

[advisories]
ignore = [
    # Unmaintained transitive deps with no available fix.
    # Reviewed 2026-03-26 — all are deep transitive, no direct usage.
    { id = "RUSTSEC-2024-0384", reason = "instant: transitive via web-time, no replacement available" },
    { id = "RUSTSEC-2024-0436", reason = "paste: transitive via simba/nalgebra/parquet, use pastey when upstream migrates" },
    { id = "RUSTSEC-2025-0119", reason = "number_prefix: transitive via indicatif, no replacement available" },
    { id = "RUSTSEC-2025-0141", reason = "bincode: transitive, widely used, no drop-in replacement" },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile: transitive, no safe upgrade available" },
    { id = "RUSTSEC-2026-0002", reason = "lru 0.12.5: transitive via ratatui, fixed in 0.16 but ratatui pins 0.12" },
    { id = "RUSTSEC-2026-0104", reason = "rustls-webpki 0.103.12: reachable panic in CRL parsing, transitive via rustls/rustls-native-certs, no safe upgrade before upstream 0.104 (mirrors aprender .cargo/audit.toml 2026-04-24)" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "BSL-1.0",
    "OpenSSL",
    "0BSD",
    "CC0-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "MIT-0",
]
confidence-threshold = 0.8

# Scoped exception (sync upstream to paiml/infra): libbz2-rs-sys carries the
# SPDX `bzip2-1.0.6` license — BSD-style permissive, pulled transitively via
# bzip2 0.6 (zip). Audit has been red daily since ~2026-04-25 on this.
[[licenses.exceptions]]
crate = "libbz2-rs-sys"
allow = ["bzip2-1.0.6"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
# Scoped skip (PMAT-147): thiserror 1.x is hard-pinned by pforge-config /
# pforge-runtime 0.1.4 (their only reverse deps), while the rest of the tree
# resolves thiserror 2.x. There is no newer pforge release to bump to, so the
# v1/v2 duplicate is unavoidable until pforge ships a thiserror-2 build.
# REMOVE this skip once pforge depends on thiserror 2 — re-run
# `cargo tree -i thiserror@1` to confirm pforge is the sole holdout.
skip = [
    { name = "thiserror", version = "=1.0.69" },
    { name = "thiserror-impl", version = "=1.0.69" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = ["paiml"]
