[package]
name = "forjar-contracts"
version = "0.31.2"
edition = "2021"
rust-version = "1.89"
authors = ["Noah Gift <noah@paiml.com>"]
license = "MIT"
repository = "https://github.com/paiml/aprender"
description = "Papers to Math to Contracts in Code — YAML contract parsing, validation, scaffold generation, and Kani harness codegen for provable Rust kernels"
keywords = ["verification", "formal-methods", "kani", "contracts", "ml-kernels"]
categories = ["development-tools::testing", "mathematics"]
exclude = ["tests/", "benches/"]

[features]
default = []
kani = []
# The 38 tests that read aprender's contract corpus (contracts/aprender/binding.yaml,
# softmax/rmsnorm kernel contracts, "100+ contracts"). forjar vendors this CRATE, not
# aprender's corpus, so those tests measure a directory that does not exist here and
# fail on NotFound — a failure about the vendoring, never about the code under test
# (#452). They are `ignore`d, not deleted and not #[cfg]'d out: they still COMPILE on
# every run, each names its own reason in the test output, and
# `cargo test -p forjar-contracts --lib --features aprender-corpus` runs them for
# anyone who has the corpus checked out. scripts/dogfood/coverage.sh ratchets the
# count so a new failure cannot be parked here silently.
aprender-corpus = []

[lib]
name = "provable_contracts"

[dependencies]
provable-contracts-macros = { path = "../forjar-contracts-macros", version = "0.31.2", package = "forjar-contracts-macros" }
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"

[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"

[dev-dependencies]
tempfile = "3"
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }

[lints.rust]
# Upstream lint debt, kept for byte fidelity with aprender-contracts 0.31.2 (see VENDORED.md).
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
unsafe_code = "allow"

[lints.clippy]
manual_strip = "allow"
manual_is_multiple_of = "allow"
