---
metadata:
  version: "1.0.0"
  # kind: pattern — the obligations here are about a SUITE OF SHELL GATES and
  # the evidence each one produces. There is no decidable core to prove over:
  # the properties are observed by running the gate against the real tree and
  # the real registries, and falsified by applying the one-line mutation each
  # gate carries. Nothing below is a theorem; everything below is a probe.
  kind: pattern
  created: "2026-09-06"
  author: "PAIML Engineering"
  description: |
    PMAT-163: forjar-dogfood v1 — the release blocker.

    The defect this governs is not any single missing check. It is that a green
    shell gate proves nothing on its own. `set -e` absent, a `|| true` on the
    measuring command, an `exit 0` at the bottom, a loop over an empty
    directory — each turns a gate into a printer, and in CI output all four are
    indistinguishable from a gate that ran. The project has already been bitten
    by the general form twice: paiml/forjar#288 shipped a derived transport tree
    that nothing routed to and that stayed green in every parity test, and
    GH-298 had `pv audit` report "Falsification tests: 14 / No audit findings"
    over a contract two of whose falsifiers named functions that did not exist.

    So every gate in `scripts/dogfood/` carries a `# mutation:` line naming the
    ONE-LINE change that turns it RED. That comment is the falsifier's address:
    a reviewer applies it and watches the gate fail. The rows below record those
    addresses in one place, and two guard tests assert mechanically that each
    address exists, that the script is strict, and that no measurement is
    swallowed.

    Coverage of the SUITE, not of the code: this contract is about whether the
    eight gates are present, strict, falsifiable and wired into a make target
    that a human will actually run before publishing. Line coverage of forjar
    itself is gate F's business.
  references:
    - "ticket: PMAT-163"
    - "issue: https://github.com/paiml/forjar/issues/288 — a transport nothing routed to stayed green in every parity test"
    - "issue: https://github.com/paiml/forjar/issues/452 — 38 vendored tests failing about the vendoring, not the code"
    - "docs/specifications/provable-iac.md — quorum-validated design, >=3 world-class systems (gate H's floor)"
    - "docs/specifications/quorum-spec.md — the receipt gate H and release-check both read"
    - ".claude/skills/forjar-dogfood/SKILL.md — the operator-facing procedure these targets implement"

equations:
  gate_verdict:
    formula: |
      verdict(g) = PASS  if exit(g) = 0
                 = FAIL  otherwise
      admissible(g) ⟺ mutation(g) ≠ ∅ ∧ strict(g) ∧ ¬swallows(g)
      trusted(g)    ⟺ admissible(g) ∧ verdict(g) = PASS
    domain: "g ∈ scripts/dogfood/*.sh"
    codomain: "{PASS, FAIL}"
    invariants:
      - "A gate's exit code IS its verdict; the GATE line reports it and never decides it"
      - "verdict(g) = PASS with admissible(g) false is worth nothing — a printer, not a gate"
      - "UNMEASURED is FAIL: a check that could not run is never reported as one that passed"

proof_obligations:
  - type: soundness
    property: "Every gate names the one-line change that turns it red"
    formal: "∀ g ∈ scripts/dogfood/*.sh . ∃ a line matching `# mutation:` with a non-trivial detail"
    applies_to: all
    enforced_by: "tests/falsification_dogfood_scripts_declare_mutations.rs::every_gate_script_names_its_mutation"
    notes: |
      The detail is required to be >= 20 characters. A bare `# mutation:` would
      satisfy an existence check while naming no address, which is the vacuous
      form of exactly this obligation.

  - type: safety
    property: "A failing stage stops the gate"
    formal: "∀ g . `set -euo pipefail` ∈ lines(g)"
    applies_to: all
    enforced_by: "tests/falsification_dogfood_scripts_declare_mutations.rs::every_gate_script_is_strict"
    notes: |
      Without it a failing stage is a passing script. pipefail matters as much
      as -e here: every gate reads its evidence out of a pipeline.

  - type: soundness
    property: "No measurement is swallowed"
    formal: "∀ g . `|| true` ∉ lines(g)"
    applies_to: all
    enforced_by: "tests/falsification_dogfood_scripts_declare_mutations.rs::no_gate_script_swallows_a_measurement"
    notes: |
      Including in comments — a `|| true` in a comment is still an instruction
      to copy. This obligation caught two real ones in contracts.sh, and the
      hazard behind them is worth recording: `grep` exits 1 on "no match" and
      pipefail turns that into a script death mid-assignment, so the gate prints
      NOTHING and exits non-zero, which is indistinguishable from a gate that
      never ran. The fix is to capture rc and keep "none" (1) apart from "grep
      could not run" (>=2, UNMEASURED), never to suppress the exit code.

  - type: completeness
    property: "The gates the receipt claims all exist"
    formal: "{comply, surface, docs, coverage, contracts, crux-reconcile, release-check} ⊆ scripts/dogfood/"
    applies_to: all
    enforced_by: "tests/falsification_dogfood_scripts_declare_mutations.rs::the_expected_gates_are_all_present"
    notes: |
      The anti-vacuity clause. An empty scripts/dogfood/ satisfies every ∀ above
      it, so the set is pinned by name and by a count floor.

  - type: determinism
    property: "The operator runs the repo's procedure, not a same-named user-scope one"
    formal: "exactly one skill declares `name: forjar-dogfood`, and none declares `dogfood`"
    applies_to: ".claude/skills/"
    enforced_by: "tests/falsification_dogfood_skill_is_named.rs::exactly_one_skill_claims_the_name"
    notes: |
      Claude Code resolves a skill by frontmatter name and a user-scope skill
      wins over a repo-scope one. Shadowing is invisible by construction: both
      load, one is chosen, nothing prints which.

      The `exactly one` half is what `exactly_one_skill_claims_the_name`
      decides; `its_first_frontmatter_line_declares_the_unshadowable_name`
      (FALSIFY-DF-005) decides that the one claimant is the repo's own skill and
      `nothing_in_the_tree_is_still_called_dogfood` (FALSIFY-DF-007) that the
      shadowable name is gone. One rule per test, and each row below names the
      test that decides IT — a row pointing at a neighbouring assertion is a
      citation that resolves and still proves something else.

enforcement:
  gate_b_comply:
    description: "pmat comply against the committed .pmat.yaml, with each disabled check replaced by a stronger instrument"
    check: "scripts/dogfood/comply.sh"
    mutation: "set BASHRS_ERROR_CEILING=0 — the known scripts/ledger-replay.sh SEC011 finding reads as a regression and the gate exits 1"
    severity: "ERROR"
  gate_c_surface:
    description: "The CLI/MCP/HTTP surface measured from the running artifact, declared vs live, diffed against the committed snapshot"
    check: "scripts/dogfood/surface.sh"
    mutation: "raise MIN_CLI to 9999 — the vacuity floor rejects the real 211-name surface and the gate exits 1"
    severity: "ERROR"
  gate_d_docs:
    description: "Every fenced forjar invocation in README.md run against a fixture in a sandboxed HOME, and the README's count/version claims reconciled"
    check: "scripts/dogfood/docs.sh"
    mutation: "change `forjar plan -f forjar.yaml` in README.md to `forjar plan --f forjar.yaml` — clap exits 2 on the rebound argv and the gate reports a documented invocation that does not hold"
    severity: "ERROR"
  gate_f_coverage:
    description: "95% line floor enforced inside llvm-cov, plus cargo mutants over this branch's own diff; survivors and timeouts are both RED"
    check: "scripts/dogfood/coverage.sh"
    mutation: "change FLOOR to 90 — Arm 0 reports the floor as DRIFTED from the Makefile's two `--fail-under-lines 95` and the gate exits 1"
    severity: "ERROR"
  gate_g_contracts:
    description: "The corpus validates and lints, every contract names a falsifier, every citation resolves, and the shipped surface is reconciled against it"
    check: "scripts/dogfood/contracts.sh"
    mutation: "delete the falsification_tests block from contracts/apply-receipt-v1.yaml — Arm 3 reports it and the gate exits 1"
    severity: "ERROR"
  gate_h_crux:
    description: "Every behaviour bullet under CHANGELOG [Unreleased] has a row in docs/audits/crux-<version>.md naming >=3 world-class systems; PENDING while Cargo.toml's version has not moved past the most recently cut release, so a reconciliation is never demanded for a version nobody is cutting"
    check: "scripts/dogfood/crux-reconcile.sh"
    mutation: "set MIN_SYSTEMS=4 — every row written to provable-iac.md's floor of 3 reads as thin and the gate exits 1"
    severity: "ERROR"
  gate_r_release:
    description: "Tag on origin AND on main, GitHub release and its prerelease flag, crates.io version, docs.rs status.json, the COMMITTED per-PR quorum receipt (.quorum/<branch>.json, read at the PR's merge commit or HEAD) for every PR GitHub reports merged into this release — present, unwaived, >=3 lanes, >=3 judges — and the crux doc, PENDING while Cargo.toml's version has not moved past the last cut release"
    check: "scripts/dogfood/release-check.sh"
    mutation: "delete the `\"waived\" in d` check inside Arm 5's `receipt_status` — a receipt carrying a top-level `waived` key then reads `receipt=ok` instead of `receipt=waived` and the gate passes a release over an unrefuted PR (other addresses: put `--merges` back — `git log --merges` collapses the squash-merged PR set to empty and the gate exits 1 on commits with no PR; delete a PR's `.quorum/<slug>.json` and its row reads `receipt=missing`)"
    severity: "ERROR"
  the_gates_are_admissible:
    description: "Each gate declares its mutation, is strict, swallows nothing, and exists"
    check: "tests/falsification_dogfood_scripts_declare_mutations.rs"
    severity: "ERROR"
  the_skill_is_unshadowable:
    description: "Exactly one skill is named forjar-dogfood and nothing in the tree is still named dogfood"
    check: "tests/falsification_dogfood_skill_is_named.rs"
    severity: "ERROR"
  the_release_window_is_real:
    description: "Gate R's PR set comes from GitHub (this repo squash-merges) and its PENDING comes from origin's tag list, driven against the real script in a fixture repository"
    check: "tests/falsification_dogfood_release_check_pr_window.rs"
    severity: "ERROR"

falsification_tests:
  - id: FALSIFY-DF-001
    rule: "A gate that cannot be shown to go red is inadmissible"
    prediction: "Deleting the `# mutation:` line from any scripts/dogfood/*.sh makes the guard test fail naming that file"
    test: "tests/falsification_dogfood_scripts_declare_mutations.rs::every_gate_script_names_its_mutation"
    if_fails: "A gate could be a printer and nothing would say so"

  - id: FALSIFY-DF-002
    rule: "A failing stage must stop the gate"
    prediction: "Removing `set -euo pipefail` from any gate makes the guard test fail naming that file"
    test: "tests/falsification_dogfood_scripts_declare_mutations.rs::every_gate_script_is_strict"
    if_fails: "A failing stage becomes a passing script"

  - id: FALSIFY-DF-003
    rule: "No measurement may be suppressed"
    prediction: "Adding `|| true` to any line of any gate makes the guard test fail naming file and line"
    test: "tests/falsification_dogfood_scripts_declare_mutations.rs::no_gate_script_swallows_a_measurement"
    if_fails: "The measurement it guards can no longer fail, and the gate reports green over it"

  - id: FALSIFY-DF-004
    rule: "The suite may not shrink below the gates the receipt names"
    prediction: "Deleting scripts/dogfood/coverage.sh makes the guard test fail naming gate F"
    test: "tests/falsification_dogfood_scripts_declare_mutations.rs::the_expected_gates_are_all_present"
    if_fails: "Every quantifier in this contract ranges over a smaller set than the receipt claims"

  - id: FALSIFY-DF-005
    rule: "The repo's dogfood skill cannot be shadowed by a user-scope one"
    prediction: "Renaming the skill back to `dogfood` makes the guard test fail on the frontmatter's first line"
    test: "tests/falsification_dogfood_skill_is_named.rs::its_first_frontmatter_line_declares_the_unshadowable_name"
    if_fails: "The release gate a contributor believes they are running is silently a different document"

  - id: FALSIFY-DF-006
    rule: "Exactly one skill claims the name"
    prediction: "Adding a second SKILL.md whose frontmatter declares `name: forjar-dogfood` makes the guard test fail, listing both claimants"
    test: "tests/falsification_dogfood_skill_is_named.rs::exactly_one_skill_claims_the_name"
    if_fails: "Two documents answer to one name, one of them is chosen, and nothing prints which — the ambiguity the rename was meant to end, reintroduced inside the repo"

  - id: FALSIFY-DF-007
    rule: "Nothing in the tree is still called `dogfood`"
    prediction: "Restoring .claude/skills/dogfood/ alongside the renamed one makes the guard test fail naming that directory"
    test: "tests/falsification_dogfood_skill_is_named.rs::nothing_in_the_tree_is_still_called_dogfood"
    if_fails: "A rename that leaves the old copy behind has not removed the collision"

  - id: FALSIFY-DF-008
    rule: "The set of PRs in a release is asked of GitHub, not of the merge commits"
    prediction: "Enumerating Arm 5 with `git log --merges` again makes the guard test fail: on a squash-merged fixture the set is empty and the gate reports PASS over zero PRs"
    test: "tests/falsification_dogfood_release_check_pr_window.rs::an_empty_pr_set_over_commits_that_landed_is_red"
    if_fails: "A squash-merged release passes the receipt arm by vacuity — the loop runs zero times and CI cannot tell that from a check that ran"

  - id: FALSIFY-DF-009
    rule: "A version origin already carries is never PENDING"
    prediction: "Deciding Arm 1 from the local tag list again makes the guard test fail: a tag on origin that this checkout lacks is reported as not-yet-cut"
    test: "tests/falsification_dogfood_release_check_pr_window.rs::a_tag_that_exists_on_the_remote_is_never_pending"
    if_fails: "A tagged, pushed, unreleased version reads as PENDING, which is the one state nobody goes back to look at"

  - id: FALSIFY-DF-010
    rule: "A PR's quorum receipt is the COMMITTED `.quorum/<branch>.json`, read at the PR's merge commit or at HEAD — not a placeholder `docs/audits/quorum-<pr>.md` nothing ever wrote"
    prediction: "Reverting Arm 5 to check `docs/audits/quorum-<pr>.md` again makes the guard test fail: a PR whose real `.quorum/<slug>.json` is committed and passes `scripts/quorum-gate.sh`'s own floor is reported `receipt=missing`"
    test: "tests/falsification_dogfood_release_check_pr_window.rs::a_pr_without_its_receipt_is_named_and_red"
    if_fails: "Every release reports every PR as missing a receipt it actually has, or — the worse direction — a placeholder name that is never written passes by nobody ever checking it"

  - id: FALSIFY-DF-011
    rule: "A receipt carrying a top-level `waived` key is never a pass"
    prediction: "Deleting the `\"waived\" in d` check from Arm 5's `receipt_status` makes the guard test fail: a PR whose receipt waived its own quorum reads `receipt=ok`"
    test: "tests/falsification_dogfood_release_check_pr_window.rs::a_waived_receipt_is_red"
    if_fails: "The release-time completeness check this arm exists to be accepts an unrefuted claim as long as its author wrote the word `waived` honestly"

  - id: FALSIFY-DF-012
    rule: "A receipt below `scripts/quorum-gate.sh`'s own floor (>=3 lanes, >=3 judges) is thin, not ok"
    prediction: "Lowering Arm 5's lane/judge floor below 3 makes the guard test fail: a 2-lane receipt that never cleared the push-time floor reads `receipt=ok`"
    test: "tests/falsification_dogfood_release_check_pr_window.rs::a_thin_receipt_is_red"
    if_fails: "The release-time check enforces a lower bar than the push-time one it is supposed to audit, so a receipt that should never have reached `main` passes retroactively"

  - id: FALSIFY-DF-013
    rule: "A `kind: triage` receipt over a diff inside the triage rail passes the push-time gate without a falsification test, and the gate prints what it did not verify (forjar#491)"
    prediction: "Removing the triage arm of the falsification block in `scripts/quorum-gate.sh` makes the guard test fail: a triage-shaped fixture with `falsification.not_applicable` is refused at `falsification is missing 'test'`"
    test: "tests/falsification_quorum_gate_has_a_triage_shape.rs::a_triage_receipt_passes_the_whole_gate_and_says_what_it_did_not_verify"
    if_fails: "The gate has no shape a triage branch can satisfy, so every triage PR is pushed `waived` — the exact failure mode the CIT_RE comment names for release commits"

  - id: FALSIFY-DF-014
    rule: "A `kind: triage` receipt over a diff that touches code is refused BY NAME"
    prediction: "Emptying the rail check's `off_rail` list in `scripts/quorum-gate.sh` makes the guard test fail: a triage receipt over a diff touching `src/lib.rs` passes, or is refused without naming the file"
    test: "tests/falsification_quorum_gate_has_a_triage_shape.rs::a_triage_receipt_over_a_code_diff_is_refused_by_name"
    if_fails: "Declaring `kind: triage` becomes the cheapest way to skip the falsification for a code change"

  - id: FALSIFY-DF-015
    rule: "Documentation the branch touches anchors a claim for `kind: triage` only"
    prediction: "Making `citation_shape` return `CIT_RE` for every kind makes the guard test fail (a triage digest anchors 0 of 4); making it return `CIT_RE_TRIAGE` for every kind makes the free-rider control fail (a code receipt anchors on documentation)"
    test: "tests/falsification_quorum_gate_has_a_triage_shape.rs::a_triage_shaped_diff_anchors_its_claims_on_the_documentation_it_touches"
    if_fails: "Either a triage branch can cite nothing that counts, or a code branch can anchor every claim on the receipt it wrote itself"

  - id: FALSIFY-DF-016
    rule: "Every reachable tag at or above the ledger floor has a row in docs/roadmaps/releases.yaml whose cut, prs and tickets are exactly what git and GitHub say (gate T, PMAT-225)"
    prediction: "Declaring a PR the window does not contain makes the guard test fail: the gate names the tag, the declared list and the measured list and exits 1"
    test: "tests/falsification_release_goals_are_measured.rs::a_declared_window_that_disagrees_with_github_is_named_and_red"
    if_fails: "The ledger is prose again: a row can name PRs and tickets a release never shipped and nothing reads it back"

  - id: FALSIFY-DF-017
    rule: "Every ticket merged since the newest tag carries the label release:<next.tag> — a PR is tagged when it merges, not when the cut is made"
    prediction: "Removing the label from a ticket in the open window makes the guard test fail: the gate names the ticket and the label"
    test: "tests/falsification_release_goals_are_measured.rs::a_merged_ticket_without_the_next_release_label_is_named_and_red"
    if_fails: "Linkage is reconstructed at the cut from memory, which is the lossy squash-subject scan this gate replaced"

  - id: FALSIFY-DF-018
    rule: "Past next.due with PRs merged since the newest tag and Cargo.toml still at the tagged version, the cut is OVERDUE and the gate is red by name; a bumped Cargo.toml is a cut in flight and passes"
    prediction: "Moving DOGFOOD_NOW three hours past next.due makes the guard test fail on the un-bumped tree and pass on the bumped one"
    test: "tests/falsification_release_goals_are_measured.rs::an_overdue_cut_is_red_until_the_version_is_bumped"
    if_fails: "The two-day cadence has no instrument: a release can be a week late and every gate stays green"

  - id: FALSIFY-DF-019
    rule: "A ticket carrying release:<tag> that no PR of <tag>'s window names is a fabricated link and is red"
    prediction: "Labelling a row with a release it was not in makes the guard test fail: the gate names the ticket and the tag"
    test: "tests/falsification_release_goals_are_measured.rs::a_ticket_claiming_a_release_it_was_not_in_is_red"
    if_fails: "A label becomes a claim nothing checks, and the ledger and the roadmap drift apart silently"

  - id: FALSIFY-DF-020
    rule: "Gate A resolves a PR's first ticket id against the roadmap: an id that is no row and that no row declares as alias:<id> is named and red, never skipped for the next id"
    prediction: "Skipping stray ids in dogfood_pr_tickets makes the guard test fail: a branch named after a ticket that never existed passes on the title's ticket"
    test: "tests/falsification_dogfood_harness_and_quorum.rs::gate_a_a_first_id_that_is_not_a_roadmap_row_is_named_and_red"
    if_fails: "A branch whose roadmap row was forgotten falls through to an older ticket the body mentions, whose receipt already exists, and gate A passes over the missing work"

qa_gate:
  id: F-DF-001
  name: "forjar-dogfood v1 — the standing gates"
  description: "Eight standing gates and the release-goal gate T, each with a registered one-line mutation, wired into make targets a human runs before publishing"
  checks:
    - "gate_b_comply"
    - "gate_c_surface"
    - "gate_d_docs"
    - "gate_f_coverage"
    - "gate_g_contracts"
    - "gate_h_crux"
    - "gate_r_release"
    - "the_gates_are_admissible"
    - "the_skill_is_unshadowable"
    - "the_release_window_is_real"
  pass_criteria: "make dogfood exits 0 and both falsification test binaries pass"
  falsification: "Apply any one `mutation:` above and that gate exits 1; add `|| true` anywhere in scripts/dogfood/ and FALSIFY-DF-003 goes red"

verification_level: L2
