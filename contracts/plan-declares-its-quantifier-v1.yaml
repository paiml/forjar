---
metadata:
  version: "1.0.0"
  kind: pattern
  created: "2026-08-26"
  author: "PAIML Engineering"
  description: |
    `forjar plan` must state the quantifier its report ranges over.

    plan compares the config to the LOCK. drift compares the lock to the HOST.
    Both are correct for the question they answer, and they disagree about the
    same machine — measured on paiml's intel the day this contract was written:

      plan  (lock-relative):  0 to add, 52 to change, 0 to destroy, 83 unchanged
      drift (host-relative):  Drift detected: 28 resource(s)

    Neither number contains the other. In a sandbox the gap is starker: mutate
    a managed file on the target and drift reports two findings while plan
    prints `no changes / 1 unchanged`.

    The defect is not that plan is lock-relative — that is its job, and making
    it contact machines would make it slow and network-dependent. The defect is
    that plan presents a lock diff AS THE STATE OF THE WORLD. `0 to change`
    reads as "nothing is wrong" when it means "nothing in the lock disagrees
    with the config", and the mutated-file case proves those are different
    claims.

    This is the same shape as forjar#305, #337 and #339: a surface reporting a
    result it did not measure, invisible because the output looks complete. The
    corpus already contains the matching precedent — apply-converges-observed-
    drift-v1 was written after #305 showed that every stated equation held
    while the machine was never looked at. That contract closed the quantifier
    for `apply`. This one closes it for `plan`, and closes it by DISCLOSURE
    rather than by widening the domain.
  references:
    - "issue: https://github.com/paiml/forjar/issues/342"
    - "apply-converges-observed-drift-v1.yaml — same quantifier hole, closed for apply"
    - "issue: https://github.com/paiml/forjar/issues/305"
    - "prior art: Terraform plan -detailed-exitcode; ArgoCD Synced/OutOfSync conditions"
    - "issue: https://github.com/paiml/forjar/issues/497"

equations:
  plan_ranges_over_config_and_lock_only:
    formula: |
      plan(config, order, locks, tag) is a function of (config, locks) ALONE.
      ∀ machine states s₁ s₂ : plan(config, order, locks, tag) is invariant in s
    domain: "config ∈ ForjarConfig, locks ∈ HashMap<String, StateLock>"
    codomain: "ExecutionPlan"
    invariants:
      - "plan opens no transport and contacts no machine"
      - "plan's counts are therefore silent about anything changed behind forjar's back"
      - "This is DESIRABLE and is not the defect; the defect is failing to say so"
    notes: |
      Stated explicitly so that a future change which makes plan reach the
      network has to contradict a written equation rather than quietly widen
      the domain. If plan ever becomes host-aware, this contract must be
      revised, not silently outgrown.

  disclosure_is_a_function_of_unconsulted_observations:
    formula: |
      unconsulted(locks) = |{ rl ∈ locks.values().resources.values()
                            : rl.observed_state() ≠ None }|
      discloses_unconsulted(plan_output) ⟺ unconsulted(locks) > 0

      forjar#372 added a SECOND blind spot, on the unattended surface only, so
      the prose field is now the union and the biconditional above is scoped to
      its own conjunct:

      skipped(config, surface) = the config-declared subprocesses `plan` refused
                                 to run (∅ on the CLI, which runs them)
      plan_output.disclosure ≠ None ⟺ unconsulted(locks) > 0
                                    ∨ skipped(config, surface) ≠ ∅

      forjar#497 added a THIRD blind spot, on every surface, and it is the one
      the plan is blind to by CONSTRUCTION rather than by policy:

      probe_covers(config, m) = this host answers for machine m, so the planner
                                may read that machine's tree (ONE definition,
                                `core::task::probe_covers`; the probe, the
                                executor pre-plan probe and the census all ask
                                it)
      unprobed(plan) = { (r, m) : action(r, m) = NoOp
                                ∧ r declares task_inputs ∨ ambient_inputs
                                                         ∨ output_artifacts
                                ∧ (¬probe_covers(config, m) ∨ probe absent) }
      plan_output.disclosure ≠ None ⟺ unconsulted(locks) > 0
                                    ∨ skipped(config, surface) ≠ ∅
                                    ∨ unprobed(plan) ≠ ∅
    domain: "locks ∈ HashMap<String, StateLock>"
    codomain: "bool"
    invariants:
      - "The disclosure fires on a CLEAN plan — that is the case where it matters most"
      - "The disclosure does NOT fire when no observation exists to be blind to"
      - "The count is of what plan is BLIND TO, never of what has drifted"
      - "EVERY SHIPPED PLAN SURFACE DISCLOSES: the TTY rendering, `plan --json`, and the MCP/HTTP/verb `plan`, which share one PlanOutput (src/verb/registry.rs)"
      - "The suppression at zero is about OPERATOR ATTENTION, so the machine-readable surfaces still carry `lock_relative: true` and `unconsulted_observations: 0`; only the prose `disclosure` is withheld"
      - "A machine consumer must be able to distinguish `unconsulted_observations: 0` from an older binary that emits no such key, so the count is a TOTAL function and the prose is the partial one"
      - "forjar#372: `unattended_skipped` is the second blind spot and follows the same shape — a TOTAL list (present, possibly empty) beside a PARTIAL prose sentence, both folded into the one `disclosure` field so a consumer reading only the prose learns of both"
      - "forjar#372: `skipped` is empty by construction on the CLI, which still executes `ambient_inputs`, `sops`/`op` and `output_equivalence` normalisers. So the CLI and unattended `disclosure` strings agree on every config that declares none of those, and diverge — correctly — on one that does"
      - "forjar#497: `unprobed` is the third blind spot and follows the same shape — a TOTAL list (present, possibly empty) beside a PARTIAL prose sentence, folded into the one `disclosure` field, so `read disclosure` stays a complete instruction for an agent"
      - "forjar#497: the count is of what the plan did not MEASURE, never of what drifted. Whether those inputs moved is exactly what was not measured, and a census presented as `N stale` would be this contract's own sin one level up"
      - "forjar#497: the ACTION is unchanged by the disclosure. Planning `Update` for every resource this host cannot probe would rebuild every remote task on every apply and break f(f(x)) = f(x) at the plan level — the census discloses, it does not widen the domain (the same choice `plan_ranges_over_config_and_lock_only` makes above)"
      - "forjar#497: `probe_covers` has ONE definition. A second copy of the predicate is how the probe and the census would come to disagree about which machines were measured, and the disclosure would then be true of a set nothing else uses"
      - "forjar#497: a resource that plans Create/Update is NEVER named — it is going to run, so a missing probe hides nothing behind it, and listing it would be the unconditional banner the second invariant forbids"
      - "forjar#497: EVERY SHIPPED PLAN SURFACE carries the census — the TTY `print_plan`, `plan --json`, the MCP/HTTP/verb `PlanOutput`, `apply --dry-run` (text and `--json`), the sealed plan file, and the `apply --plan-file --dry-run` preview of that file"
    notes: |
      The second invariant is what keeps this from becoming a banner. A warning
      printed unconditionally is a warning nobody reads, and this fleet has
      already paid for gates that cry wolf.

      forjar#372 is the same disclosure shape applied to a different cause. The
      unattended surface publishes `readOnlyHint: true`, so it must not run what
      a config declares; not running it makes the plan lock-relative for those
      resources, which is precisely the condition this contract exists to force
      into the output rather than leave implicit. Widening the prose field, and
      not inventing a second one, is what keeps "read `disclosure`" a complete
      instruction for an agent.

      The third matters more than it looks. `unconsulted` says nothing about
      whether those resources have drifted — establishing that requires
      reaching the machine, which is drift's job. A count presented as "N
      drifted" would be exactly the sin this contract exists to prevent, one
      level up.

  disclosure_names_the_command_that_can_answer:
    formula: |
      discloses(plan_output) ⟹ "forjar drift" ∈ plan_output
    domain: "plan_output ∈ String"
    codomain: "bool"
    invariants:
      - "A disclosed blind spot must name the instrument that can see into it"
    notes: |
      Telling an operator that an answer is incomplete, without telling them
      how to complete it, converts a silent gap into a loud one and stops
      there. The remedy is part of the disclosure.

falsification:
  - id: silence-on-a-clean-plan
    description: |
      Remove the disclosure and run `plan` on a converged sandbox whose managed
      file has been mutated on the target. plan prints `0 to change, 1
      unchanged` and nothing else; drift prints two findings. The two shipped
      surfaces disagree and only one of them says so.
    expected: "the_disclosure_survives_a_fully_converged_plan fails"
  - id: unconditional-banner
    description: |
      Make the disclosure fire regardless of `unconsulted`. It then appears on
      a first-ever plan with no lock, where there is no observation to be blind
      to — noise that trains operators to skip the line.
    expected: "no_lock_means_no_disclosure fails"
  - id: json-surface-is-silent
    description: |
      THE 1.20.1 STATE. The disclosure was implemented as a side-effecting
      printer — `print_scope_disclosure` formatted the sentence and immediately
      `println!`d it, returning `()` — so the only way to consume it was to be
      inside `print_plan`. `plan --json` emitted a seven-key object and
      `PlanOutput` five fields; both said `to_update: 0` beside nothing, while
      the TTY rendering disclosed.

      The equations above are not qualified to "the TTY rendering", so on two of
      three shipped surfaces the left side of the biconditional was false while
      `unconsulted(locks) > 0`. The consumers that cannot NOTICE a missing
      disclosure — a nightly CI parser, an MCP agent — were the ones still being
      handed the undisclosed lock diff, which is the exact population #342's
      motivating incident is drawn from.

      Reproduce by reverting the three keys in `plan_json::print_plan_json` or
      the three fields on `PlanOutput`.
    expected: "json_plan_discloses_that_it_did_not_look_at_the_host and the_verb_surface_discloses_the_same_blind_spot fail"
  - id: never-probed-reads-as-probed-and-clean
    description: |
      THE forjar#497 STATE. Remove the census — `planner::unprobed` and the
      `unprobed` key on the six plan surfaces — and converge a `task` that
      declares `task_inputs` and `output_artifacts` on a machine this host
      answers for, then move that machine to an address it does not (an SSH
      target; since forjar#495 a pepita namespace does the same). Change the
      declared input on disk.

      `determine_present_action` lets an observed probe override a matching
      config hash and falls through to the hash comparison when there is no
      probe, and the probe is only taken where `probe_covers` holds. So a
      MISSING probe and a probe that found nothing stale produce the same
      `NoOp`, and `forjar plan` prints

        Plan: 0 to add, 0 to change, 0 to destroy, 1 unchanged.

      and nothing else, while the machine's tree was never read. That is
      "unmeasured reads as clean" — the same defect this contract was written
      for, one level down: not a lock diff presented as the world, but an
      absent measurement presented as a passed one.
    expected: "a_remote_task_whose_inputs_changed_plans_noop_and_says_so, the_disclosure_does_not_depend_on_whether_the_inputs_moved and the_verb_surface_carries_the_census fail"

# The `falsification:` block above says how to BREAK the property. This block
# says where the property is CURRENTLY PINNED — the shipped tests that go red
# when it breaks. #298 is why both exist: a scenario a reader can reproduce by
# hand is not a test CI runs, and the corpus had been counting the former as
# the latter.
falsification_tests:
  - id: FALSIFY-PQ-001
    rule: "The disclosure survives a fully converged plan"
    prediction: "unconsulted(locks) > 0 on a converged sandbox ⇒ plan still discloses"
    test: "tests/falsification_plan_discloses_its_blind_spot.rs::the_disclosure_survives_a_fully_converged_plan"
    if_fails: "`0 to change` is printed as the state of the world; a mutated host reads as clean"

  - id: FALSIFY-PQ-002
    rule: "The disclosure is conditional on there being an observation to be blind to"
    prediction: "no lock ⇒ unconsulted(locks) = 0 ⇒ no disclosure"
    test: "tests/falsification_plan_discloses_its_blind_spot.rs::no_lock_means_no_disclosure"
    if_fails: "An unconditional banner on a first-ever plan trains operators to skip the line"

  - id: FALSIFY-PQ-003
    rule: "The biconditional is not qualified to the TTY rendering"
    prediction: "`plan --json` carries the disclosure keys, not only the human output"
    test: "tests/falsification_plan_json_discloses_its_blind_spot.rs::json_plan_discloses_that_it_did_not_look_at_the_host"
    if_fails: "THE 1.20.1 STATE — the consumers that cannot notice a missing disclosure are the ones handed the undisclosed lock diff"

  - id: FALSIFY-PQ-004
    rule: "The verb surface discloses what the CLI discloses"
    prediction: "`verb call plan` carries the same blind-spot fields as `plan --json`"
    test: "tests/falsification_plan_json_discloses_its_blind_spot.rs::the_verb_surface_discloses_the_same_blind_spot"
    if_fails: "An MCP agent reads a lock diff as host truth on the one surface with no human to notice"

  - id: FALSIFY-PQ-005
    rule: "A converged resource this host could not probe is NAMED, with its machine and the instrument that can answer"
    prediction: "a task converged locally, then moved to a TEST-NET address, plans NoOp AND prints `did not measure`, `build@box` and `forjar drift`"
    test: "tests/falsification_planner_names_what_it_did_not_probe.rs::a_remote_task_whose_inputs_changed_plans_noop_and_says_so"
    if_fails: "A missing probe prints as `unchanged`: unmeasured reads as clean on every SSH target and every namespace"

  - id: FALSIFY-PQ-006
    rule: "The census is about MEASUREMENT, not about change"
    prediction: "an unprobed converged resource is disclosed even when its declared inputs did not move"
    test: "tests/falsification_planner_names_what_it_did_not_probe.rs::the_disclosure_does_not_depend_on_whether_the_inputs_moved"
    if_fails: "The disclosure is conditioned on the very fact the planner could not establish, so it fires only when it was not needed"

  - id: FALSIFY-PQ-007
    rule: "The suppression at zero, beside a TOTAL machine-readable list"
    prediction: "a probed task is not named on the TTY, and `plan --json` still carries `unprobed: []`"
    test: "tests/falsification_planner_names_what_it_did_not_probe.rs::a_probed_task_is_not_named_and_the_json_list_is_present_but_empty"
    if_fails: "Either an unconditional banner operators learn to skip, or an absent key a parser cannot tell from an older binary"

  - id: FALSIFY-PQ-008
    rule: "The census reaches the machine-readable surfaces and is folded into the one prose field"
    prediction: "`plan --json` carries `unprobed[0].{resource_id,machine,reason}` and a `disclosure` naming `build@box` and `forjar drift`; the sealed plan file carries the same list"
    test: "tests/falsification_planner_names_what_it_did_not_probe.rs::json_carries_the_census_as_a_total_list_and_folds_it_into_the_disclosure"
    if_fails: "The 1.20.1 shape again — the consumers that cannot notice a missing disclosure are the ones handed the unmeasured plan"

  - id: FALSIFY-PQ-009
    rule: "A resource that is going to run anyway is never named, and the census travels with a sealed plan"
    prediction: "a task whose config changed plans Update and is absent from `unprobed`; `plan --out` writes the census into the document"
    test: "tests/falsification_planner_names_what_it_did_not_probe.rs::a_task_that_will_run_anyway_is_not_named"
    if_fails: "The disclosure becomes the banner the second invariant forbids, or a reviewed plan file hides what it did not measure"

  - id: FALSIFY-PQ-010
    rule: "The verb/MCP/HTTP PlanOutput carries the census too"
    prediction: "`verb call plan` over an unprobed converged task returns `unprobed` with one entry and a `disclosure` naming `build@box`"
    test: "tests/falsification_plan_json_discloses_its_blind_spot.rs::the_verb_surface_carries_the_census"
    if_fails: "An agent reads `to_update: 0` over a resource nothing measured, on the one surface with no human to notice"
