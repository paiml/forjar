---
metadata:
  version: "1.0.0"
  kind: pattern
  created: "2026-11-12"
  author: "PAIML Engineering"
  description: |
    The `github_runner` resource (forjar#1000, part of forjar#697): a
    self-hosted GitHub Actions runner seat declared in a manifest, registered
    through a GitHub App, and checked for drift.

    Today a seat is registered by hand: `config.sh` with a token someone
    fetched. A manifest cannot say "this machine carries these runner seats",
    `apply --check` cannot see a seat that fell off or whose labels drifted,
    and the registration token is handled outside the secrets path.

    Eight obligations. C1 to C5 are about registration, C7 about deregistration
    and C8 about repo scope; all are proven against a local fake of the GitHub
    API (no network, no real App) driving the real binary. C6 is about the
    manifest and is proven against the real binary.

    PHASE STATUS. Phase 1 shipped the resource type and the C6 validation.
    Phase 2 shipped `check` and `apply` and the falsifiers for C1 to C5.
    Phase 3 ships `state: absent` (C7: one remove-token request, `config.sh
    remove` on the seat with the token on stdin, the listing deleted by id if
    it outlives the seat) and an end-to-end repo-scoped seat (C8: register,
    adopt, drift, deregister, all under /repos/{owner}/{repo}, none under
    /orgs). NOT proven by any falsifier: a real registration against GitHub,
    the App installation lookup against the live API, the runner's reading of
    `ACTIONS_RUNNER_INPUT_TOKEN` (also for `config.sh remove`) on a live
    runner, and the service unit on a non-systemd host.

    LIVE CALL REQUIREMENTS (nothing below has been exercised with a real
    credential). A live run needs: (1) a GitHub App with the permission
    "Self-hosted runners: Read and write" at the organization level for
    `scope: org`, or "Administration: Read and write" at the repository level
    for `scope: repo`, installed on the owner (or repo); (2) the App id and,
    optionally, the installation id in the manifest (omitted, the control host
    looks it up with `GET {base}/installation`, which needs the App JWT only);
    (3) the App private key (PEM) supplied through the manifest `secrets:`
    provider as `app.private_key: "{{secrets.<name>}}"`, readable on the
    control host only; (4) outbound HTTPS from the control host to
    api.github.com (override with FORJAR_GITHUB_API_URL) and from the seat to
    github.com for the runner tarball; (5) on the seat, `curl`, `tar`,
    `sha256sum`, the declared `user` (or passwordless sudo to it) and
    passwordless sudo for `svc.sh`; (6) a `sha256` of the exact tarball
    `actions-runner-linux-{x64|arm64}-{version}.tar.gz` from
    github.com/actions/runner releases; (7) org scope with `group:` needs the
    group to exist already (group management is out of scope). The calls made
    are, in order: GET {base}/installation (only without installation_id),
    POST /app/installations/{id}/access_tokens, GET {base}/actions/runners,
    GET {base}/actions/runner-groups and its members (org scope with group),
    then POST {base}/actions/runners/registration-token (register) or POST
    {base}/actions/runners/remove-token and, only if the listing outlives the
    seat, DELETE {base}/actions/runners/{id} (deregister).

    Meaning of "0 commands on the seat" and "token requests = 0": the
    resource itself runs nothing on the seat (forjar's own disk preflight is
    not the resource), and asks GitHub for no REGISTRATION token. The control
    host still mints a JWT and an installation token to list the runners.
    On a fresh state dir an adopted seat is recorded `converged` (nothing ran);
    a repeat apply against the same state dir is `unchanged` without calling
    the API at all, and `forjar check` is the live observation.

    Persistent seats only. Ephemeral and just-in-time seats, runner group
    management, runner auto-update policy and scale sets are out of scope.

  references:
    - "issue: https://github.com/paiml/forjar/issues/1000"
    - "issue: https://github.com/paiml/forjar/issues/697 — the parent"
    - "GitHub REST: POST /orgs/{org}/actions/runners/registration-token and POST /repos/{owner}/{repo}/actions/runners/registration-token (a token is valid 1 h)"
    - "GitHub REST: GET /orgs/{org}/actions/runners and GET /repos/{owner}/{repo}/actions/runners (the list check reads)"
    - "GitHub Apps: authenticating as an App with a signed JWT, then as an installation"
    - "tests/falsification_github_runner.rs (C6) and tests/falsification_github_runner_registration.rs (C1 to C5) — driven through the binary"

  quorum_validation:
    - system: "Terraform (`terraform plan`, drift against a remote API)"
      adopted: |
        Declared state is compared with what the remote API lists, and a
        difference is reported by name with both sides, not applied silently.
        Adopted: check lists the runners and names a label or group difference
        with both sets.
      encoded_as: "equation `drift_is_refused`"
    - system: "Kubernetes (`kubeadm join` bootstrap tokens)"
      adopted: |
        A join token is short-lived, minted by the control plane and handed to
        the node once; the node never holds the credential that mints it.
        Adopted: the control host holds the App key and signs the JWT; only the
        1 h registration token crosses to the seat, on stdin.
      encoded_as: "equation `key_stays_on_control_host`"
    - system: "Ansible (`get_url` with `checksum:`)"
      adopted: |
        A download is verified against a declared digest before anything runs
        from it, and a mismatch is a failure, not a warning.
        Adopted: the tarball is checked against `sha256` before `config.sh`.
      encoded_as: "equation `tarball_is_pinned`"

equations:
  key_stays_on_control_host:
    formula: |
      secret ∈ {private_key, jwt, registration_token, remove_token}
        ⟹ secret ∉ (seat scripts ∪ state files ∪ event log ∪ stdout ∪ stderr)
    domain: "one check or apply of a github_runner resource"
    codomain: "bool"
    invariants:
      - "The App private key is read on the control host through the manifest `secrets:` provider and never leaves it"
      - "The control host signs the JWT and asks GitHub for the registration token; only that token goes to the seat, over the transport's stdin"
      - "A token is never an argument (it would show in `ps` and the shell history), never written to a state file, never logged"

  adopt_is_noop:
    formula: |
      listed(name) ∧ labels_listed = labels_declared (as sets) ∧ group_listed = group_declared
        ⟹ seat_commands = 0 ∧ result = unchanged
    domain: "a seat the API already lists"
    codomain: "(command count, result)"
    invariants:
      - "Label order does not matter: the comparison is of sets"
      - "An already-registered seat is adopted, never re-registered"

  drift_is_refused:
    formula: |
      listed(name) ∧ (labels_listed ≠ labels_declared ∨ group_listed ≠ group_declared)
        ⟹ exit ≠ 0 ∧ output ∋ both sets ∧ seat_commands = 0 ∧ token_requests = 0
    domain: "a seat the API lists with a different label set or group"
    codomain: "(exit status, output, command count, request count)"
    invariants:
      - "Never `--replace`: a re-registered seat drops its queued job, so drift is a refusal with the difference, not a silent re-registration"
      - "The difference names the missing and the extra labels, and both sets"

  absent_registers_once:
    formula: |
      ¬listed(name) ⟹ token_requests = 1 ∧ after apply: listed(name)
      listed(name) (after a first apply) ⟹ second apply: token_requests = 0 ∧ result = unchanged
    domain: "a seat the API does not list"
    codomain: "(request count, result)"
    invariants:
      - "Exactly one registration-token request per registration"
      - "A second apply of the same manifest is unchanged"

  tarball_is_pinned:
    formula: |
      sha256(tarball) ≠ declared sha256 ⟹ refused ∧ config_sh_runs = 0
    domain: "the downloaded runner tarball"
    codomain: "(verdict, execution count)"
    invariants:
      - "The digest is checked before `config.sh` runs, so a wrong tarball never executes"
      - "A missing `sha256` is refused at `validate` (C6), so there is no unpinned path"

  scope_is_validated:
    formula: |
      invalid(r) ⟺ (scope = repo ∧ repo = ∅) ∨ (scope = org ∧ repo ≠ ∅) ∨ labels = ∅ ∨ sha256 = ∅
      invalid(r) ⟹ validate exits non-zero ∧ output ∋ the offending field's name
    domain: "a github_runner resource in a manifest"
    codomain: "validate verdict"
    invariants:
      - "Each of the four is refused on its own, naming its field"
      - "A manifest correct in all four is accepted (the refusal is not a blanket refusal)"
      - "`state: absent` is no longer refused: it deregisters (C7)"

  absent_deregisters:
    formula: |
      state = absent ∧ ¬listed(name) ⟹ seat_commands = 0 ∧ remove_token_requests = 0 ∧ exit = 0
      state = absent ∧ listed(name) ⟹ remove_token_requests = 1 ∧ remove_token ∈ one seat script's stdin only
        ∧ (listed(name) after the script ⟹ delete_requests = 1) ∧ check passes afterwards
      state = absent ∧ seat script fails ⟹ exit ≠ 0 ∧ delete_requests = 0
    domain: "a github_runner resource declared `state: absent`"
    codomain: "(exit status, request counts, command count)"
    invariants:
      - "Deregistering an unlisted seat is idempotent and costs no command and no token"
      - "The remove token obeys the same stdin-only rule as the registration token (C1)"
      - "A failed remove on the seat never deletes the listing behind its back"

  repo_scope_end_to_end:
    formula: |
      scope = repo ⟹ every API path ∈ /app/** ∪ /repos/{owner}/{repo}/** ∧ config.sh --url = github.com/{owner}/{repo}
        ∧ no --runnergroup
    domain: "a repo-scoped github_runner through register, adopt, drift and deregister"
    codomain: "(request paths, config.sh argv)"
    invariants:
      - "Repo scope never touches /orgs and never passes a runner group"

proof_obligations:
  - type: invariant
    property: "C1 key_stays_on_control_host: no script, state file, event log line or output holds the private key, the JWT or a token"
    formal: "marker key ∉ stdout ∪ stderr ∪ state dir ∪ event log; JWT ∉ same; fake's token ∉ same"
    applies_to: all
    enforced_by: "tests/falsification_github_runner_registration.rs::f1_key_jwt_and_tokens_stay_off_every_surface"
    notes: "F1. Fails if the token is passed as an argument or written to state. The registration token is asserted to reach config.sh (positive control) and to appear in exactly one seat script, once, on its own stdin line."

  - type: invariant
    property: "C2 adopt_is_noop: a seat listed with the same name, label set and group produces 0 commands and `unchanged`"
    formal: "listed(name) ∧ labels equal as sets ∧ group equal ⟹ seat_commands = 0 ∧ unchanged"
    applies_to: all
    enforced_by: "tests/falsification_github_runner_registration.rs::f2_equal_labels_in_another_order_adopt_with_zero_seat_commands"
    notes: "F2. The fake lists the seat with equal labels in another order. `unchanged` is the repeat-apply result (F4); a first apply on a fresh state dir records converged with nothing run, and `forjar check` passes."

  - type: invariant
    property: "C3 drift_is_refused: a seat listed with a different label set or group fails with both sets named and runs 0 commands"
    formal: "listed(name) ∧ labels differ ⟹ exit ≠ 0 ∧ missing label named ∧ token_requests = 0"
    applies_to: all
    enforced_by: "tests/falsification_github_runner_registration.rs::f3_label_drift_is_refused_naming_the_difference, f3_group_drift_is_refused_naming_both_groups"
    notes: "F3. The fake lists the seat with one label fewer; a second test lists it in another group."

  - type: invariant
    property: "C4 absent_registers_once: an absent seat is registered with exactly one registration-token request, and a second apply is `unchanged`"
    formal: "¬listed ⟹ token_requests = 1; then listed ⟹ second apply token_requests = 0"
    applies_to: all
    enforced_by: "tests/falsification_github_runner_registration.rs::f4_absent_registers_once_then_stays_unchanged"
    notes: "F4. The fake lists nothing, then lists the seat once the token has been served."

  - type: safety
    property: "C5 tarball_is_pinned: a tarball whose sha256 differs from the manifest is refused before `config.sh` runs"
    formal: "sha256(tarball) ≠ declared ⟹ refused ∧ config_sh_runs = 0"
    applies_to: all
    enforced_by: "tests/falsification_github_runner_registration.rs::f5_tampered_tarball_is_refused_before_config_sh_runs"
    notes: "F5. A tarball with one byte changed."

  - type: invariant
    property: "C6 scope_is_validated: scope repo without repo, scope org with repo, an empty label list and a missing sha256 each fail `validate`, naming the field"
    formal: "invalid(r) ⟹ validate exit ≠ 0 ∧ output ∋ field; ¬invalid(r) ⟹ validate exit 0"
    applies_to: all
    enforced_by: "tests/falsification_github_runner.rs::f6_scope_repo_without_repo_is_refused, f6_scope_org_with_repo_is_refused, f6_empty_label_list_is_refused, f6_missing_sha256_is_refused"
    notes: "The two controls (f6_control_a_valid_seat_is_accepted, f6_control_a_repo_scoped_seat_with_a_repo_is_accepted) are what stop a blanket refusal discharging the four."

  - type: invariant
    property: "C7 absent_deregisters: state absent on a listed seat makes one remove-token request and runs config.sh remove with the token on stdin; on an unlisted seat it does nothing"
    formal: "absent ∧ listed ⟹ remove_token_requests = 1 ∧ config.sh remove ran; absent ∧ ¬listed ⟹ seat_commands = 0 ∧ requests = 0"
    applies_to: all
    enforced_by: "tests/falsification_github_runner_absent.rs::f7_absent_deregisters_a_listed_seat_with_one_remove_token, f7_absent_when_not_listed_is_a_noop, f7_absent_deletes_a_listing_that_outlives_the_seat, f7_absent_reports_a_failed_remove_and_keeps_the_listing"
    notes: "F7. RED before the change (apply refused state: absent as not implemented), GREEN after. The fake models the seat's config.sh remove by unlisting on the remove-token request."

  - type: invariant
    property: "C8 repo_scope_end_to_end: a repo-scoped seat registers, is adopted, refuses drift and deregisters through /repos/{owner}/{repo} only"
    formal: "scope = repo ⟹ no request path under /orgs ∧ --url is the repo URL ∧ no --runnergroup"
    applies_to: all
    enforced_by: "tests/falsification_github_runner_absent.rs::f8_repo_scope_registers_adopts_and_deregisters_end_to_end, f8_repo_scope_label_drift_is_refused"
    notes: "F8. Against the local fake; the live repo-scope endpoints are not exercised."

falsification_tests:
  - id: FALSIFY-GHR-001
    rule: "key_stays_on_control_host"
    prediction: "Passing the registration token as an argument to config.sh, or writing it to the state file, puts it in the transcript the test searches"
    test: "tests/falsification_github_runner_registration.rs::f1_key_jwt_and_tokens_stay_off_every_surface"
    if_fails: "A credential reaches the seat's process list, the state directory or the event log"

  - id: FALSIFY-GHR-002
    rule: "adopt_is_noop"
    prediction: "Comparing labels as an ordered list instead of a set sends commands to a seat whose labels are merely in another order"
    test: "tests/falsification_github_runner_registration.rs::f2_equal_labels_in_another_order_adopt_with_zero_seat_commands"
    if_fails: "A healthy seat is re-registered and drops its queued job"

  - id: FALSIFY-GHR-003
    rule: "drift_is_refused"
    prediction: "Re-registering on a label difference (a silent --replace) records a registration-token request the test counts"
    test: "tests/falsification_github_runner_registration.rs::f3_label_drift_is_refused_naming_the_difference"
    if_fails: "Drift is papered over and the queued job on the seat is lost"

  - id: FALSIFY-GHR-004
    rule: "absent_registers_once"
    prediction: "Requesting a token on every apply makes the second apply record a request"
    test: "tests/falsification_github_runner_registration.rs::f4_absent_registers_once_then_stays_unchanged"
    if_fails: "Every apply burns a registration token and may register a duplicate seat"

  - id: FALSIFY-GHR-005
    rule: "tarball_is_pinned"
    prediction: "Running config.sh before the digest check executes a tarball with one byte changed"
    test: "tests/falsification_github_runner_registration.rs::f5_tampered_tarball_is_refused_before_config_sh_runs"
    if_fails: "An unverified archive is executed on the seat"

  - id: FALSIFY-GHR-006
    rule: "scope_is_validated"
    prediction: "Dropping the repo-scope rule from the validator turns f6_scope_repo_without_repo_is_refused red; refusing every github_runner turns both controls red"
    test: "tests/falsification_github_runner.rs::f6_scope_repo_without_repo_is_refused"
    if_fails: "A seat that cannot be registered passes validate and fails later, at 03:00, on a machine"

  - id: FALSIFY-GHR-007
    rule: "absent_deregisters"
    prediction: "Refusing state: absent, or requesting a remove token for an unlisted seat, turns the f7 tests red"
    test: "tests/falsification_github_runner_absent.rs::f7_absent_deregisters_a_listed_seat_with_one_remove_token"
    if_fails: "A seat taken out of the manifest stays registered with GitHub and keeps receiving jobs"

  - id: FALSIFY-GHR-008
    rule: "repo_scope_end_to_end"
    prediction: "Building the repo-scope base path from /orgs, or passing a runner group at repo scope, turns the f8 tests red"
    test: "tests/falsification_github_runner_absent.rs::f8_repo_scope_registers_adopts_and_deregisters_end_to_end"
    if_fails: "A repo-scoped seat registers against the wrong scope"

# No kani_harnesses. `metadata.kind: pattern`: the properties are about process
# exit status and what a fake HTTP server recorded; the falsifiers run the
# binary rather than model it.

qa_gate:
  id: F-GHR-001
  name: "GitHub Runner Seat"
  description: "a runner seat is declared, registered once through a GitHub App whose key stays on the control host, adopted when present and equal, and refused on drift"
  checks:
    - "key_stays_on_control_host"
    - "adopt_is_noop"
    - "drift_is_refused"
    - "absent_registers_once"
    - "tarball_is_pinned"
    - "scope_is_validated"
    - "absent_deregisters"
    - "repo_scope_end_to_end"
  pass_criteria: "All 8 falsification tests pass"
  falsification: "Remove the scope rules from src/core/parser/github_runner_validate.rs"

verification_level: L3
