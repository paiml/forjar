---
metadata:
  version: "1.0.0"
  kind: pattern
  created: "2026-05-06"
  author: "PAIML Engineering"
  description: |
    Apply-summary distinguishability — the apply summary surfaced to
    the user must be able to distinguish a forced re-converge of a
    fully-converged stack (`--force` re-ran resources the lock said
    were already at desired state) from a legitimate re-converge after
    drift. Filed as paiml/forjar#129. Closes the gap that made claim
    C3 (idempotency) unobservable through `--force`.
  references:
    - "issue: https://github.com/paiml/forjar/issues/129"
    - "downstream incident: https://github.com/paiml/iac-from-zero/pull/1"
    - "C3: forjar's idempotency falsifiable claim — README.md § Falsifiable Claims"
    - "apply-converges-observed-drift-v1.yaml — supersedes this contract's Q2 delegation"

equations:
  forced_noop_count:
    formula: |
      forced_noop_count(cfg) =
        if cfg.force then
          shadow_plan(cfg.config, real_locks(cfg.state_dir)).unchanged
        else
          0
    domain: "cfg ∈ ApplyConfig"
    codomain: "u32"
    invariants:
      - "forced_noop_count = 0 when cfg.force is false"
      - "forced_noop_count ≤ total_converged"
      - "forced_noop_count + actual_changes = total_converged"

  drift_repaired_count:
    formula: |
      drift_repaired(cfg, results) =
        distinct_by(resource_id,
          { f ∈ pre_apply_findings(cfg)
            : post_lock[f.machine][f.resource_id].status = Converged })
    domain: "cfg ∈ ApplyConfig, results ∈ Vec<ApplyResult>"
    codomain: "Vec<DriftRepair>"
    invariants:
      - "drift_repaired ≤ total_converged"
      - "cfg.force ⇒ drift_repaired = ∅ — the gate is bypassed at apply_drift.rs, so a repair under --force is unobservable BY CONSTRUCTION, not unmeasured"
      - "¬cfg.policy.tripwire ⇒ drift_repaired = ∅"
      - "the count ranges over RESOURCES, not findings: detect_drift_full emits one finding per observable, so one tampered file yields both `content changed` and `file state changed`"
      - "a resource excluded by -r / --only-machine / a tag filter, or one that failed, is left drifted/failed in the post-apply lock and is therefore NOT counted"

  apply_summary_distinguishability:
    formula: |
      summary(results) = {
        total_converged: Σ resources_converged,
        forced_noop_count: f,
        actual_changes: total_converged − f,
      }
    domain: "results ∈ Vec<ApplyResult>, f ∈ u32"
    codomain: "Summary"
    invariants:
      - "When f > 0, the printed summary surfaces it explicitly"
      - "actual_changes = 0 ∧ f > 0 ⇒ stack was fully converged before --force ran (claim C3 holds)"
      - "actual_changes > 0 ⇒ at least one resource genuinely needed work (drift OR new)"
      - "the summary separates a convergence CAUSED BY A CONFIG CHANGE from one caused by OBSERVED DRIFT; both used to print as `converged` (forjar#336)"
      - "drift_repaired = ∅ ⇒ the summary line is byte-identical to what it was before the dimension was added — the clause is empty at zero"

proof_obligations:
  - type: invariant
    property: "forced_noop_count fits inside converged"
    formal: "∀ cfg, results: forced_noop_count(cfg) ≤ Σ results.resources_converged"
    applies_to: all
    enforced_by: "src/cli/apply_summary.rs::print_apply_summary debug_assert!"

  - type: invariant
    property: "Force-off path returns zero"
    formal: "cfg.force = false ⇒ forced_noop_count(cfg) = 0"
    applies_to: all
    enforced_by: "src/cli/apply.rs — call site guarded by `if cfg.force`"

  - type: invariant
    property: "Summary surfaces the distinction when meaningful"
    formal: |
      forced_noop_count > 0 ⇒
        (text mode emits a `note:` line ∧ JSON mode emits forced_noop_count + actual_changes fields)
    applies_to: all
    enforced_by: "src/cli/apply_summary.rs::print_apply_summary"

  - type: classification
    property: "All four step shapes from issue #129 hold (Q1 semantics)"
    formal: |
      apply(fresh)            → converged=N, forced=0
      apply(converged)        → converged=0, unchanged=N, forced=0
      apply(converged, force) → converged=N, forced=N, actual_changes=0   ← C3 holds through --force
      apply(drift_one, force) → converged=N, forced=N, actual_changes=0
    applies_to: all
    enforced_by: "tests/test_fj129_force_distinguishability.rs"
    notes: |
      Q1 semantics: forced_noop is computed against the LOCK, not the
      live filesystem. Shape 4 (rm outside forjar then --force) shows
      actual_changes=0 because the lock still says both resources are
      converged.

      CORRECTED 2026-08-24 (forjar#305). This block used to end: "The
      complementary question — how many resources had live-state drift? — is
      what `forjar drift` answers. Q2 (live-state diff) is a separate runtime
      concern." That delegation was doing real damage. `forjar drift` EXCLUDED
      ResourceType::File from the live comparison, so the named delegate was
      blind for 97% of this fleet's file resources (320 of 329 locked file
      resources had no content_hash) — and because the delegation was written
      down here as intentional, apply's own silence read as by-design rather
      than as a defect.

      A contract may narrow its own scope. What it must not do is name a
      delegate without an obligation that the delegate actually answers. The
      live-state question now has one:
      apply-converges-observed-drift-v1.yaml.

      Q1 remains the cheap, deterministic, lock-only part, and shape 4 above is
      still correct AS STATED — it describes `--force`, which bypasses the drift
      gate entirely. Without --force, a resource that moved on the target is now
      marked Drifted and re-applied.

  - type: invariant
    property: "A repair is claimed only for a resource this run converged"
    formal: |
      ∀ d ∈ drift_repaired:
        ∃ r ∈ results: r.machine = d.machine
          ∧ ∃ rr ∈ r.resource_reports: rr.resource_id = d.resource_id ∧ rr.status = "converged"
      ∧ |drift_repaired| ≤ Σ results.resources_converged
    applies_to: all
    enforced_by: "tests/falsification_apply_summary_names_drift_repair.rs"
    notes: |
      forjar#336. The findings were produced, printed to stderr, and then
      discarded at a function boundary one frame above the printer:
      `check_pre_apply_drift` returned `Result<(), String>`. So the summary
      could report WHAT happened and never WHY — a deploy and an intrusion
      produced byte-identical output, and `--json` consumers got no drift
      signal at all because the `drift:` lines go to stderr.

      The intersection with the post-apply lock is what makes the number
      trustworthy; a raw findings count passes every other test in that file
      and fails `an_unrepaired_drift_is_not_counted_as_repaired`.

      OUT OF SCOPE, DELIBERATELY: `src/cli/observe.rs::run_watch_apply` prints
      its own `Apply complete:` line from a path that never invokes the drift
      gate, so `--watch --auto-apply` keeps its current wording. Giving watch
      mode a drift gate is a separate change. Naming it here so the divergence
      is not read as an oversight.

enforcement:
  forced_noop_not_counted_as_converged:
    description: |
      forced_noop must never exceed converged; a debug_assert! aborts a debug
      build on planner/executor disagreement. Release builds skip the assert,
      so the integration test carries the same shape on CI.
    check: "src/core/executor/mod.rs::forced_noop_count"
    severity: "ERROR"

verification_level: L3
