---
metadata:
  version: 1.0.0
  created: '2026-07-30'
  author: PAIML Engineering
  description: |
    Guarantees for forjar's webhook receiver — the surface that turns an inbound
    HTTP request into an InfraEvent driving the rules engine.

    The receiver had never been reachable: `run_webhook_server` had ZERO non-test
    callers and no `Commands` variant dispatched it, so it could not be started,
    dogfooded, or reached by any sender. Every defect below survived ~35 passing
    tests because those tests called the functions directly, and unreachable code
    cannot be verified by using it.

    Four defect shapes, all confirmed by measurement rather than reading:

    * `compute_hmac_hex` was documented and named HMAC-SHA256 — its doc comment
      described the ipad/opad construction — and computed a keyed BLAKE3 hash.
      Against RFC 4231 TC2 it returned `30f3b0f1…` where HMAC-SHA256 is
      `5bdcc146…`, so no standard sender could ever authenticate. It survived
      because every signature test computed its expected value BY CALLING THE
      FUNCTION UNDER TEST: `f(x) == f(x)` holds for any function.
    * There was no HTTP framing. One `read()`, and `Content-Length` was parsed
      into the header map and never read back. A correctly-framed delivery whose
      body landed in a second TCP segment returned 400 with the event silently
      dropped; with a secret set it degraded to SignatureInvalid, because the MAC
      covered the prefix.
    * Two independent fail-OPEN defaults: `secret` defaulted to None, and an
      EMPTY `allowed_paths` meant allow-every-path. The configuration an operator
      would write to lock the endpoint down was the least restrictive available.
    * Connections were handled inline on the accept loop, so one client that
      connected and sent nothing delayed a legitimate signed delivery by 5383ms
      — entirely upstream of signature checking, so the secret was no defence.
  kind: pattern
  references:
  - PMAT-201 — forjar webhook receiver
  - RFC 4231 — HMAC-SHA256 test vectors
  - RFC 9110 §9.5 — 405 MUST carry Allow
  - Stripe webhook signatures — t=/v1= scheme and tolerance window
  - GitHub X-Hub-Signature-256 — interop over the bare body
  - execution-safety-v1.yaml — the action-execution boundary this must not cross
invariants:
- id: INV-MAC-IS-HMAC-SHA256
  statement: >-
    Request authentication is HMAC-SHA256, matching RFC 4231 vectors exactly. The name,
    the documentation and the computation agree. A digest produced by any conforming implementation
    (openssl, GitHub, Stripe) verifies, and one produced by a different primitive does
    not.
- id: INV-EXPECTED-VALUES-COME-FROM-OUTSIDE
  statement: >-
    No signature test derives its expected value from the function under test. Every expected
    digest is an RFC 4231 vector or a literal generated by `openssl dgst -sha256 -hmac`.
    This is the invariant whose absence let a substituted primitive ship: a self-referential
    assertion cannot detect one.
- id: INV-MAC-COVERS-THE-WIRE-BYTES
  statement: >-
    The MAC is computed over the exact octets received, before any UTF-8 interpretation.
    `WebhookRequest.body` is `Vec<u8>` and the signature functions take `&[u8]`, so a
    lossy decode cannot sit between the wire and the verification. A body containing invalid
    UTF-8, signed over its true bytes, authenticates; the U+FFFD-substituted form does
    not.
- id: INV-SIGNATURE-BINDS-TIMESTAMP-METHOD-PATH
  statement: >-
    The signed payload is `t=<unix>\n<METHOD>\n<path>\n<body>`. A digest minted for one
    allowed path does not verify at another, and one minted for POST does not verify for
    another method. A body-only MAC replays forever and re-routes freely between entries
    in `allowed_paths`, while `_path` reads like an authorization input.
- id: INV-FRESHNESS-IS-BIDIRECTIONAL
  statement: >-
    A request is rejected when |now - t| exceeds the tolerance window (default 300s).
    Future-dated timestamps are rejected too: otherwise a sender — or an attacker choosing
    t — could extend a captured request's validity.
- id: INV-DELIVERY-IS-AT-MOST-ONCE
  statement: >-
    A repeated signature produces at most one InfraEvent. Because t is inside the signed
    payload the v1 digest is unique per send, so it serves as the delivery id with no
    extra header for a sender to get wrong. A duplicate is answered 200, never 4xx — a
    retrying sender did nothing wrong, and a 4xx would make it retry harder. CooldownTracker
    is not a substitute: it rate-limits a rulebook, it does not make a delivery exactly-once.
- id: INV-FRAMING-IS-CONTENT-LENGTH-DRIVEN
  statement: >-
    The receiver reads until CRLFCRLF, then reads exactly Content-Length octets, across
    as many segments as that takes. A body split at any boundary — up to one byte per
    segment — is reassembled identically. Duplicate or non-numeric Content-Length is rejected
    400; Transfer-Encoding is rejected 501 rather than mis-framed.
- id: INV-SIZE-CAP-IS-ENFORCED-BEFORE-BUFFERING
  statement: >-
    A Content-Length exceeding max_body_bytes is answered 413 BEFORE the body is read,
    so the cap bounds memory rather than describing it. Any configured maximum is honoured,
    including above 64 KiB — the previous read buffer was clamped to min(max, 65536)+4096,
    which made a larger cap silently inert and BodyTooLarge unreachable from the server.
- id: INV-FAIL-CLOSED-AT-STARTUP
  statement: >-
    The server refuses to bind when the configuration would expose an unauthenticated
    or plaintext endpoint: no secret without an explicit `allow_unauthenticated`, an empty
    `allowed_paths`, or a non-loopback bind without `tls_terminated_upstream`. Validation
    runs before the listener, so a rejected configuration leaves no socket open. Refusal
    rather than a warning, because the failure mode is arbitrary event injection into
    a script-capable rules engine.
- id: INV-RESPONSES-ARE-VALID-JSON-AND-NON-REFLECTIVE
  statement: >-
    Every response body is JSON built by serde_json, carrying a fixed reason code from
    this crate. No request-derived text is interpolated. The previous builder emitted
    `{"status":"PathNotAllowed { path: "/evil" }"}` — invalid JSON, under Content-Type:
    application/json, echoing attacker input. The Debug form is logged server-side only.
- id: INV-STATUS-CODES-ARE-HONEST
  statement: >-
    Outcomes map to distinct statuses: 405 (+ Allow: POST) for a non-POST, 413 for an
    oversize body, 404 for an unknown path, 401 for missing/invalid/stale signatures,
    501 for chunked, 431 for an oversize head, 408 on timeout, 503 when the queue is full
    or the event pipeline is closed. Every failure used to collapse to 403 while the 401/405/413
    arms of the status table were dead code.
- id: INV-PRE-AUTH-WORK-IS-BOUNDED
  statement: >-
    An unauthenticated client cannot deny service. Connections are handled by a bounded
    worker pool with a bounded queue and a whole-connection deadline; when the queue is
    full the receiver answers 503 and closes rather than queueing without limit. Idle
    sockets do not delay a legitimate delivery.
- id: INV-ACKNOWLEDGEMENT-IMPLIES-ACCEPTANCE
  statement: >-
    A 200 is returned only when the event was handed to the pipeline. A closed receiver
    yields 503, not 200. The previous code discarded the SendError and returned 200 anyway,
    telling a sender its delivery was accepted when nothing would ever process it.
- id: INV-ONE-CLOCK
  statement: >-
    Produced events timestamp via `tripwire::eventlog::now_iso8601`, the same function
    the trigger path uses. The receiver's private `now_iso8601` returned `format!("{}Z",
    secs)` — epoch seconds with a Z suffix, not ISO 8601 — so two mutually unparseable
    formats landed in one audit-log field.
- id: INV-ACTIONS-ARE-NOT-EXECUTED-HERE
  statement: >-
    `forjar rules serve` evaluates events and REPORTS matching actions; it does not run
    them. This is a hard sequencing gate, not a limitation: `rulebook_template::expand_action`
    substitutes attacker-controlled payload keys into `RulebookAction.script` via String::replace
    with no shell quoting. Wiring an executor to a network listener would convert an inbound
    request into command execution. The injection is currently unreachable (`expand_action`
    has no callers) and must stay so until the quoting is fixed.
falsification_tests:
- id: FT-RFC4231
  rule: INV-MAC-IS-HMAC-SHA256
  prediction: >-
    Every published RFC 4231 digest is reproduced exactly by compute_hmac_hex.
  test: src/core/tests_webhook_sig.rs::rfc4231_tc1/tc2/tc3/tc6
  if_fails: >-
    The primitive is not HMAC-SHA256. Compare the returned digest against `openssl dgst
    -sha256 -hmac`; a 64-char mismatch means a substituted hash function, not a formatting
    bug.
  method: >-
    Assert the published RFC 4231 digests. The old keyed-BLAKE3 returns 30f3b0f1… for
    TC2 and fails immediately.
- id: FT-INDEPENDENT-ORACLE
  rule: INV-EXPECTED-VALUES-COME-FROM-OUTSIDE
  prediction: >-
    A digest produced by openssl verifies against forjar, and a live openssl-signed delivery
    to the running binary returns 200.
  test: >-
    src/core/tests_webhook_sig.rs::verify_accepts_an_openssl_generated_signature
  if_fails: >-
    forjar and the rest of the world disagree about the algorithm or the canonical payload.
    Diff the exact bytes being signed before suspecting the MAC.
  method: >-
    Verify a digest literal generated by `openssl dgst -sha256 -hmac`, plus an end-to-end
    delivery signed by openssl against the running binary.
- id: FT-NON-UTF8-BODY
  rule: INV-MAC-COVERS-THE-WIRE-BYTES
  prediction: >-
    A body containing a raw 0xFF, signed over its exact octets, verifies; the U+FFFD-substituted
    form does not.
  test: >-
    src/core/tests_webhook_sig.rs::verify_covers_non_utf8_bytes; src/core/tests_webhook_server.rs::non_utf8_body_signed_over_wire_bytes_is_accepted
  if_fails: >-
    A lossy UTF-8 decode has re-entered the path between the socket and verification.
    Check that WebhookRequest.body is still Vec<u8> end to end.
  method: >-
    Sign a body containing a raw 0xFF over its exact bytes; assert it verifies and that
    the U+FFFD-substituted form does NOT.
- id: FT-PATH-TRANSFER
  rule: INV-SIGNATURE-BINDS-TIMESTAMP-METHOD-PATH
  prediction: >-
    A signature minted for one allowed path is rejected with 401 when replayed at another.
  test: >-
    src/core/tests_webhook_server.rs::signature_for_one_path_is_rejected_at_another
  if_fails: >-
    The path left the signed payload, so the MAC is body-only again and any allowed path
    accepts any other's signature.
  method: >-
    With two allowed paths, replay a digest minted for the first at the second and assert
    401.
- id: FT-STALE-AND-FUTURE
  rule: INV-FRESHNESS-IS-BIDIRECTIONAL
  prediction: >-
    |now - t| beyond the tolerance is rejected on BOTH sides of the window.
  test: >-
    src/core/tests_webhook_sig.rs::timestamp_in_the_future_is_rejected; src/core/tests_webhook_server.rs::stale_timestamp_is_rejected
  if_fails: >-
    Either the freshness check was dropped or it became one-sided; a future-dated t would
    then extend a captured request's validity indefinitely.
  method: Assert both edges of the window, and a live 1-hour-old delivery → 401.
- id: FT-DUPLICATE
  rule: INV-DELIVERY-IS-AT-MOST-ONCE
  prediction: >-
    Byte-identical signed requests sent twice both return 200 and produce exactly ONE
    event.
  test: >-
    src/core/tests_webhook_server.rs::duplicate_delivery_yields_exactly_one_event
  if_fails: >-
    The replay guard is not consulted, or the delivery id is no longer unique per send.
    Confirm t is still inside the signed payload.
  method: >-
    Send byte-identical signed requests twice; assert both 200 and that the channel yields
    exactly one event.
- id: FT-SPLIT-DELIVERY
  rule: INV-FRAMING-IS-CONTENT-LENGTH-DRIVEN
  prediction: >-
    A delivery whose body arrives in a later segment — down to one byte per read — is
    reassembled and accepted.
  test: >-
    src/core/tests_webhook_http.rs::body_split_across_segments_is_reassembled, body_split_one_byte_at_a_time;
    src/core/tests_webhook_server.rs::signed_delivery_split_across_segments_is_accepted
  if_fails: >-
    Framing regressed to a single read(). Content-Length is being ignored again and events
    are silently dropped off-loopback.
  method: >-
    Deliver head and body in separate writes separated by a pause, and byte-at-a-time
    through a chunked reader. The old single-read path returns 400 and drops the event.
- id: FT-SIZE-CAP
  rule: INV-SIZE-CAP-IS-ENFORCED-BEFORE-BUFFERING
  prediction: >-
    An oversize Content-Length is answered 413 with NO body sent, and a configured cap
    above 64 KiB is honoured.
  test: >-
    src/core/tests_webhook_http.rs::oversize_content_length_is_rejected_before_reading_the_body,
    max_body_above_64k_is_honoured
  if_fails: >-
    The size decision moved after buffering, so the cap describes rather than bounds memory;
    or a read-buffer clamp reappeared.
  method: >-
    Declare an oversize Content-Length and send NO body: a 413 proves the decision preceded
    buffering. Separately, accept a 200KB body under a 1MiB cap.
- id: FT-FAIL-CLOSED
  rule: INV-FAIL-CLOSED-AT-STARTUP
  prediction: >-
    Each unsafe configuration is refused before binding, and the port remains bindable
    afterwards.
  test: >-
    src/core/tests_webhook_server.rs::refuses_to_start_without_a_secret, refuses_to_start_with_an_empty_allow_list,
    refuses_a_non_loopback_bind_without_upstream_tls, bad_config_does_not_bind
  if_fails: >-
    A fail-open default returned. An empty allowed_paths or a missing secret is again
    accepted, exposing arbitrary event injection.
  method: >-
    Assert each rejection, and that the port remains bindable afterwards — proving nothing
    was left listening.
- id: FT-JSON-RESPONSES
  rule: INV-RESPONSES-ARE-VALID-JSON-AND-NON-REFLECTIVE
  prediction: >-
    Every status's body parses as JSON, hostile codes are escaped, and a 404 does not
    echo the requested path.
  test: >-
    src/core/tests_webhook_http.rs::every_response_body_is_valid_json, response_escapes_hostile_codes;
    src/core/tests_webhook_server.rs::unknown_path_is_404
  if_fails: >-
    Response construction went back to string interpolation; the body is malformed JSON
    and reflects attacker input.
  method: >-
    Parse the body of every status with serde_json; feed a code containing quotes and
    braces; assert a 404 does not echo the requested path.
- id: FT-STATUS-MAPPING
  rule: INV-STATUS-CODES-ARE-HONEST
  prediction: 'Each outcome renders its own status line, and 405 carries Allow: POST.'
  test: >-
    src/core/tests_webhook_http.rs::previously_unreachable_statuses_have_reasons, method_not_allowed_carries_allow_header;
    src/core/tests_webhook_server.rs::get_is_405_with_allow_header, unknown_path_is_404
  if_fails: >-
    Outcomes are collapsing to one status again, making a rejection reason indistinguishable
    to a sender.
  method: 'Assert each status line and that 405 carries Allow: POST.'
- id: FT-IDLE-SOCKETS
  rule: INV-PRE-AUTH-WORK-IS-BOUNDED
  prediction: >-
    With idle sockets held open, a legitimate signed delivery still completes in well
    under a second.
  test: >-
    src/core/tests_webhook_server.rs::idle_connections_do_not_delay_a_real_delivery
  if_fails: >-
    Connection handling moved back onto the accept loop, so any unauthenticated client
    can stall every delivery.
  method: >-
    Hold idle sockets open, then time a legitimate signed delivery and assert it completes
    well under a second. The old inline handler measured 5383ms.
- id: FT-SECRET-REDACTED
  rule: INV-FAIL-CLOSED-AT-STARTUP
  prediction: Formatting WebhookConfig never emits the secret's value.
  test: src/core/tests_webhook_server.rs::debug_redacts_the_secret
  if_fails: >-
    A derive(Debug) was restored and the shared secret will reach logs and panic messages.
  method: Format the config and assert the secret value does not appear.
known_gaps:
- id: GAP-GITHUB-BINDING
  statement: >-
    A GitHub-signed request (X-Hub-Signature-256) is verified over the BARE body, so it
    carries neither timestamp nor path binding. GitHub cannot be told to sign a custom
    canonical form. Acceptable because GitHub delivers to one configured URL and the replay
    guard still makes each delivery single-use, but such a request has weaker guarantees
    than a t=/v1= one.
- id: GAP-NO-PERSISTED-REPLAY-SET
  statement: >-
    The replay guard is in-memory, so a restart forgets deliveries seen inside the current
    tolerance window. Bounded by the freshness check to a ≤300s sliver, which is why persistence
    was judged not worth a schema.
- id: GAP-NESTED-PAYLOAD-NOT-FLATTENED
  statement: >-
    `parse_json_payload` flattens only the top level; a nested object is stringified.
    So a rulebook cannot match on `repository.full_name`. A rulebook-matching feature
    rather than a receiver defect; deferred.
- id: GAP-NO-EVENT-NAME-FROM-HEADERS
  statement: >-
    Request headers do not reach event identity, so a GitHub `ping` cannot be distinguished
    from a real delivery and every accepted request becomes a WebhookReceived event. Deferred.
- id: GAP-ACTION-EXECUTION-BLOCKED-ON-QUOTING
  statement: >-
    No action executor exists here by design (INV-ACTIONS-ARE-NOT-EXECUTED-HERE). Wiring
    one requires fixing the unquoted template substitution in rulebook_template::expand_action
    first. Tracked separately.
