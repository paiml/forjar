enforcement:
  restore_asks_the_lock_before_it_writes:
    description: >-
      `generation::rollback_to_generation` calls
      `generation::restore::refuse_multi_stack_restore` before it reads the
      generation or touches the state dir; `undo --resume` calls the same
      function before it reads the progress ledger; and `cmd_undo` calls it
      once its plan is confirmed and before its FIRST write —
      `stage_target_config`, then `undo_prune::destroy_absent_from_target`,
      then the restore.
    check: "cargo test --test falsification_state_stamp_per_name"
    severity: "ERROR"
    layer: process
    failure_mode: test_failure
    ci_gate: required
    notes: |
      The guard lives beside `restore_generation_to_state`, the function that
      empties the dir, so a future caller inherits it. Placing it ONLY in
      `cmd_undo` was the tempting half-fix and would have left `rollback
      --generation` and `apply --rollback-on-failure` open; placing it only at
      the primitive left `cmd_undo`'s destroy in front of it (MSD-08). Both
      calls are load-bearing and neither replaces the other.

      `rollback --generation` and `apply --rollback-on-failure` were re-checked
      for the same ordering hazard: both reach `rollback_to_generation`
      directly (`dispatch_misc::dispatch_misc_fleet`,
      `helpers_state::maybe_rollback_generation`) with nothing destructive
      between the verb and the guard, so they need no earlier call.

  the_refusal_is_asserted_on_the_disk_not_on_the_text:
    description: >-
      Each refused command is followed by a fingerprint of every path under the
      state dir — file digests, symlink targets, directory structure — compared
      against the fingerprint taken before.
    check: "tests/common/stack_stamp_harness.rs::fingerprint"
    severity: "ERROR"
    layer: process
    failure_mode: test_failure
    ci_gate: required
    notes: |
      A non-zero exit proves nothing about what already happened. `undo`
      destroys resources the target generation does not hold BEFORE it
      restores, so "exits non-zero" and "changed nothing" are genuinely
      different claims — MSD-08 is the row that separates them, and it needs a
      fixture whose target generation actually drops a resource, because the
      fingerprint alone cannot see a destroy that had nothing to destroy.

  no_second_meaning_for_yes:
    description: >-
      The refusal takes no override argument. `--yes` gates confirmation and
      nothing else; no `--force` is added.
    check: "review gate + grep: no --force on refuse_multi_stack_restore"
    severity: "ERROR"
    layer: review
    failure_mode: review_rejection
    ci_gate: required
    notes: |
      flag-has-effect-v1 § INV-FLAG-EFFECT-CONFINED records what a second
      meaning for `--yes` cost last time: BLAKE3 integrity verification was off
      for exactly the runs nobody watches. The test asserts the refusal text
      does not contain "--force", so the override cannot be added quietly.

  anti_vacuity_control_is_mandatory:
    description: >-
      Every revision of this contract keeps at least one row that FAILS if the
      guard is over-broad.
    check: "FALSIFY-MSD-05, FALSIFY-MSD-07"
    severity: "ERROR"
    layer: review
    failure_mode: review_rejection
    ci_gate: required
    notes: |
      A contract whose every row is satisfied by refusing everything is not a
      contract, and this one is one line away from that at all times.

known_gaps:
  - id: GAP-RESTORE-IS-STILL-NOT-SCOPED
    statement: >-
      This contract does not make undo work in a shared state dir; it makes it
      refuse. An operator who genuinely needs to undo one of six manifests must
      give that manifest its own `--state-dir` and re-apply. Stack-scoped
      generations and restore are PMAT-162, and when they land this refusal
      should be NARROWED (to the generations a stack does not own), not
      removed.

  - id: GAP-READ-ONLY-UNDO-PATHS-STILL-EXIT-ZERO
    statement: >-
      CLOSED, in part: `cmd_undo` now asks the guard before its own first
      write, so nothing is destroyed on the way to the refusal (MSD-08). What
      remains open is deliberate and read-only. The call sits after the plan is
      printed, after the `--dry-run` return and after the "already at
      generation N" return, so in a shared dir `undo --dry-run` still previews
      and a no-op `undo` still exits 0 — neither writes a byte, and both
      behaved this way before the guard existed. Moving it above those returns
      also refuses a renamed stack's remedy in the window before its next
      apply. The count itself is no longer the problem: a rename is retired on
      the next apply (INV-A-RENAME-IS-ONE-LINEAGE, PMAT-171), so `|stacks(D)|`
      counts stacks rather than stamps for every stack that has applied since.

  - id: GAP-STACKS-IS-A-RECORD-NOT-A-TRUTH
    statement: >-
      `|stacks(D)| > 1` counts what has been STAMPED, so a dir that two stacks
      share but only one has applied to since the upgrade counts as one. The
      first apply by the second stack records it and the guard engages from
      then on. There is no cheaper signal: generations do not record a stack
      name until the config snapshot inside them is parsed. A RENAME is no
      longer counted twice — the next apply retires the old name's stamp
      (INV-A-RENAME-IS-ONE-LINEAGE) and `undo`'s replay no longer writes the
      historical name back (INV-A-REPLAY-STAMPS-THE-INVOKING-STACK, pinned by
      FALSIFY-MSD-10). What remains is the 1.0 migration: a stamp with no
      recorded `-f` cannot be shown to be a rename and is left standing until
      the one apply that pins it.

  - id: GAP-A-DELETED-LOCK-DEFEATS-IT
    statement: >-
      Deleting `forjar.lock.yaml` removes the evidence and the guard with it,
