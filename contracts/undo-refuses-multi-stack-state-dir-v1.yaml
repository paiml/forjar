---
metadata:
  version: "1.4.0"
  kind: pattern
  created: "2026-09-06"
  author: "PAIML Engineering"
  description: |
    Undo-refuses-multi-stack-state-dir — a restore that cannot be scoped to the
    stack asking for it must be refused, not performed on all of them.

    THE SHAPE OF THE DEFECT

    forjar has two independent keys over one state dir and they do not agree.
    The lock file is keyed by CONFIG NAME (`stacks: {name -> StackStamp}` since
    forjar#469, machine sections since 1.0), so N stacks may legitimately share
    one `--state-dir`: paiml/infra keeps ONE `state/` for six machine manifests,
    `machines/<m>/forjar.yaml`, each with its own `name:` and its own machine.
    Generations are keyed by NOTHING but the state dir: they are numbered 0, 1,
    2 … per dir, and a generation snapshot is a copy of the WHOLE dir.

    So `generation::restore::restore_generation_to_state` deletes everything in
    the state dir (bar `generations/`, `snapshots/`, `.snapshots/`) and copies
    one numbered generation back over it. In the six-manifest layout, "undo
    mini" restores whatever manifest happened to apply at that number and takes
    every other stack's machine lock back with it — including stacks whose
    operator is not present, whose config was not read, and whose resources were
    never diffed.

    WHY IT SURVIVED REVIEW. Every visible signal looks right. `-f` names the
    right config, `--state-dir` names a dir this stack really does own a stamp
    in, the printed diff is computed from the asking config's machines only, and
    the marker files that stack owns end up exactly where the operator expected.
    The reverted stacks show up in nothing the command prints. The test that
    stood in this slot asserted the opposite of the truth — "undoing one stack
    leaves the other two untouched" — and passed only because it drove two extra
    applies of the undone stack first, making the target generation that stack's
    OWN. It was measuring apply ordering, not scoping.

    WHAT THIS CONTRACT REQUIRES. Not that restore be scoped — that is PMAT-162,
    a spec-first ticket. It requires that an operation forjar cannot perform
    correctly be REFUSED, at the primitive, before the first byte is written,
    with no override. A whole-dir restore in a dir holding N > 1 stacks is such
    an operation. The refusal names every stack it would have reverted and names
    the ticket that will make the operation possible, because a refusal without
    a way forward trains operators to route around it.

    NO KANI HARNESS, DELIBERATELY. The property quantifies over filesystem
    state: what a process left on disk after it exited non-zero. That is not in
    Kani's model, and a harness over a stubbed filesystem would prove something
    about the stub. The obligations are discharged by binary-level tests that
    fingerprint every file under the state dir before and after.
  verification_command: |
    cargo test --test falsification_state_stamp_per_name
    cargo test --test falsification_undo_state_dir_interlock
    cargo test --test falsification_undo_actually_undoes
    cargo test --lib -- generation undo state_identity
    # RED leg (must still reproduce against the defect):
    #   git revert the guard in src/cli/generation/restore.rs and
    #   a_state_dir_holding_several_stacks_refuses_every_restore fails with
    #   "undo --yes restored a state dir holding three stacks"
  references:
    - "issue: https://github.com/paiml/forjar/issues/469 — per-name stamps
       (PMAT-161); this contract is the half #469 did not close: it settled WHO
       a state dir belongs to, not what a restore may do to the others."
    - "PMAT-162 — stack-scoped generations and restore. The refusal here names
       it, and is expected to be narrowed (not removed) when it lands."
    - "destroy-undo-roundtrip-v1.yaml — rollback(snapshot(S)) = S. That
       roundtrip is stated over a whole state dir, which is exactly the
       assumption this contract makes explicit: it holds for one stack's dir
       and is false for a shared one."
    - "state-dir-visibility-v1.yaml — the sibling: state the operator cannot
       see. Here the state is visible and the DAMAGE is not."

equations:
  restore_is_whole_dir:
    formula: |
      Let D be a state dir, stacks(D) = keys of D/forjar.lock.yaml `stacks`,
      and gen(D, n) the snapshot numbered n.

      restore(D, n) : D ← gen(D, n)          -- every path in D, not a subset

      ⟹ ∀ s ∈ stacks(D) : state(s, D) ← state(s, gen(D, n))

      There is no argument of `restore` naming a stack, so its effect on stack
      s is independent of which stack asked. |stacks(D)| > 1 ⟹ a request made
      on behalf of one stack is executed on behalf of all of them.
    domain: "D ∈ StateDirs, n ∈ ℕ, s ∈ stacks(D)"
    codomain: "StateDir"
    invariants:
      - "restore takes no stack argument, so it cannot honour one"
      - "generations are numbered per state dir; stack names do not appear in
         `generations/`"
      - "the diff `undo` prints is computed from the asking config's machines
         only, so it cannot describe what the restore will do to the others"

  refusal_is_total_and_early:
    formula: |
      ∀ entry points e ∈ {undo, undo --generations, undo --resume,
                          rollback --generation, apply --rollback-on-failure} :
        |stacks(D)| > 1  ⟹  exit(e) ≠ 0  ∧  bytes(D)_after = bytes(D)_before

      where bytes(D) is the digest of every path under D — file contents,
      symlink targets, directory structure — including forjar.lock.yaml and
      every machine dir.

      Negation (what the tests assert): the guard is ABSENT iff some e exits 0,
      or exits non-zero having already changed bytes(D).
    domain: "e ∈ EntryPoints, D ∈ StateDirs"
    codomain: "⟨exit, Δstate⟩"
    invariants:
      - "no flag lifts the refusal: there is no --force, and --yes does not
         double as one"
      - "the refusal is at the primitive, so a new caller inherits it"
      - "a refused restore leaves the host converged as it was"

  single_stack_is_untouched:
    formula: |
      |stacks(D)| ≤ 1  ⟹  restore(D, n) behaves exactly as before the guard

      Covering: a dir with one stamp, a legacy 1.0 dir (which migrates to
      exactly one stamp on load), and a dir with no readable global lock at all
      — the state `rollback --generation 0` itself produces.
    domain: "D ∈ StateDirs with |stacks(D)| ≤ 1"
    codomain: "StateDir"
    invariants:
      - "the common single-stack layout is not made harder to operate"
      - "absence of a lock ALLOWS: refusing there would brick a dir that works"
      - "an over-broad guard is a worse defect than the one it fixes, because
         it removes the only recovery path an operator has"

invariants:
  - id: INV-RESTORE-REFUSES-A-SHARED-STATE-DIR
    statement: >-
      A whole-dir restore in a state dir holding more than one stack exits
      non-zero. `forjar undo --yes` against a dir stamped by alpha, bravo and
      charlie is the canonical violation: it exits 0, prints alpha's diff, and
      returns bravo's and charlie's machine locks to whatever the target
      generation held.

  - id: INV-REFUSAL-IS-BEFORE-THE-FIRST-BYTE
    statement: >-
      The refusal happens before the state dir is read back or written. A
      command that destroys and then refuses is not a guard, it is the defect
      with an error message. Asserted by fingerprinting every path under the
      state dir before and after each refused command.

  - id: INV-REFUSAL-NAMES-WHAT-IT-WOULD-HAVE-DONE
    statement: >-
      The refusal lists every stack the restore would have reverted and names
      the ticket that makes the operation possible (PMAT-162). A refusal that
      says only "no" is routed around; one that names the other stacks tells
      the operator whose state dir they are actually holding.

  - id: INV-NO-OVERRIDE
    statement: >-
      No flag lifts this refusal. There is no `--force`, and `--yes` does not
      acquire a second meaning — the flag-has-effect-v1 lesson (`--yes` also
      disabling BLAKE3 integrity) applied before the second meaning exists. The
      escape is a separate state dir, which is a real operation an operator can
      verify, not a promise the binary cannot keep.

  - id: INV-GUARD-AT-THE-PRIMITIVE
    statement: >-
      The guard sits on the function that writes the dir back, not on any verb.
      `rollback --generation` reaches it with no config in the picture at all
      and `apply --rollback-on-failure` reaches it from the failure path, so a
      guard in `undo` would leave both open. Two verbs ALSO ask earlier, and
      both are stated and tested: `undo --resume` never reaches that function
      at all (it re-applies the target generation's recorded config directly),
      and `undo` has destructive work in front of it —
      `undo_prune::destroy_absent_from_target` removes the resources the target
      generation does not hold, from the host, before the restore is called, so
      the primitive's copy of the guard fires too late for that verb. Earlier
      calls are additions to the guard at the primitive, never replacements:
      deleting the primitive's call must still turn MSD-04 red.

  - id: INV-A-RENAME-IS-ONE-LINEAGE
    statement: >-
      A stack renamed in place — the same config file under a new `name:` — is
      ONE stack, and the count this contract refuses on is a count of stacks,
      not of stamps. The apply that finds a stamp recording the very `-f` it is
      being applied from retires that stamp into the new name (machines and
      output keys move with it) and says so in one `note:` line. Without the
      retirement the old name's entry stays in `stacks`, a dir one config has
      ever been applied to "holds 2 stacks", and the renamed stack's own undo is
      refused for ever — by the very apply the refusal names as the remedy.

  - id: INV-A-REPLAY-STAMPS-THE-INVOKING-STACK
    statement: >-
      The apply `undo` runs underneath itself stamps the state dir as the stack
      that INVOKED the command, from the `-f` that invoked it — never as the
      identity of the document it is replaying. The target generation's
      recorded config carries the `name:` the stack had THEN, and
      `rollback_to_generation` restores that generation's `forjar.lock.yaml`
      before the replay runs, so a replay that stamps what it applies writes
      the historical name straight back: a stack renamed under
      INV-A-RENAME-IS-ONE-LINEAGE is un-renamed by its own first undo, and
      because the replay records no `-f` for the staged temp config, the
      file-less stamp it leaves is not positive evidence of a rename and the
      next apply's retirement cannot clear it. `|stacks(D)|` then counts a
      stack that is not there and the next restore is refused.

  - id: INV-SINGLE-STACK-UNCHANGED
    statement: >-
      One stack, one state dir — the overwhelmingly common case — restores
      exactly as it did before. Anti-vacuity: without this the whole contract
      is satisfiable by refusing every restore, which would be a worse defect
      than the one it fixes.

  - id: INV-A-PROMISE-IS-REFUSED-BEFORE-IT-IS-MADE
    statement: >-
      `apply --rollback-on-failure` promises a restore, and the promise is
      refused where the refusal is still free: in the preflight, above the
      drift gate and the ControlMaster sockets, before the config is planned
      and before the host is touched. Asking only on the failure path — where
      the flag's rollback actually runs — means the operator gets the apply,
      no rewind, and a `warning:` line about a promise that was never keepable.
      `--dry-run` is exempt: it converges nothing, so it makes no promise, and
      the read-only preview of a shared dir must stay available.

  - id: INV-A-STAMP-NAMES-ONE-FILE
    statement: >-
      A stamp's recorded `-f` names EXACTLY ONE file, and the comparison is
      made in the one frame both sides are written in: the recorded string
      against what `stamped_config_file` produces for this state dir now.
      Nothing is skipped and nothing matches by suffix. A stamp with no
      recorded file matches nothing at all. The suffix form made
      `../forjar.yaml` name every `machines/<m>/forjar.yaml` under the state
      dir's parent, and the reader that acts on a match — `retire_renamed` —
      DELETES what it matches, so the first machine manifest applied into the
      root stack's dir retired the root stack's stamp and took its machines and
      output keys with it. Retirement also applies to EVERY entry recording
      this file, not the first one found: a leftover second entry keeps the dir
      counting two stacks for ever, which is the condition retirement exists to
      clear.

  - id: INV-A-SCOPE-NARROWS-WORK-NOT-OWNERSHIP
    statement: >-
      `apply -m X` narrows what CONVERGES, not what the stack owns. The
      machines a stamp claims are (previous ∪ written ∪ retired) ∩ declared,
      with the declared set taken from the config being applied: a machine is
      released when the config stops declaring it — an edit the operator made
      and can see — never because one invocation happened not to converge it.
      Writing the stamp from the apply's own results made `apply -m mini`
      release every other machine of the stack, which is exactly how
      `stack_conflict` is told a machine is free, so the next stack to claim
      one took it in silence.

  - id: INV-RETENTION-DOES-NOT-CROSS-STACKS
    statement: >-
      Snapshot retention deletes nothing it cannot attribute. The count is per
      state dir while `policy.snapshot_generations` is promised by ONE config,
      so in a dir several stacks share, one stack's apply trimmed its
      neighbours' pre-apply snapshots — the copies an operator reaches for to
      recover from this very class of mistake. Until snapshots carry an owner
      (PMAT-162), an apply into a dir holding more than one stack keeps every
      snapshot and says so on stderr, naming the count and the ticket. A
      single-stack dir prunes exactly as before.

fixtures:
  - id: FX-THREE-STACKS
    description: >-
      alpha/bravo/charlie: three configs, three DISTINCT machine names, three
      distinct file resources, ONE `--state-dir` — the paiml/infra shape, and a
      layout forjar supports and must keep supporting for `apply`. A fourth
      apply by alpha follows, so every generation `undo` can target differs
      from the live state and the command reaches the restore instead of
      reporting "already at generation N". Writes only inside a tempdir.
    setup: |
      # tests/common/stack_stamp_harness.rs::fleet(), verbatim in Rust:
      #   write_stack(root, "alpha",   "alpha",   "mini",        "one")
      #   write_stack(root, "bravo",   "bravo",   "lambda-labs", "one")
      #   write_stack(root, "charlie", "charlie", "clean-room",  "one")
      #   for cfg in [alpha, bravo, charlie]:
      #       forjar apply -f $cfg --state-dir $root/state --yes
      #   write_stack(root, "alpha", "alpha", "mini", "two")
      #   forjar apply -f $root/alpha/forjar.yaml --state-dir $root/state --yes
      # each config sets policy.snapshot_generations: 10, without which apply
      # records no generation at all and undo has nothing to target.

  - id: FX-ONE-STACK
    description: >-
      The control: alpha alone, applied twice into its own state dir, so the
      dir holds exactly one stamp. Every assertion the multi-stack fixture
      makes is made here with the opposite expectation.
    setup: |
      # tests/falsification_state_stamp_per_name.rs::
      #   a_single_stack_dir_behaves_exactly_as_before
      #   write_stack(root, "alpha", "alpha", "mini", "one"); apply
      #   write_stack(root, "alpha", "alpha", "mini", "two"); apply

  - id: FX-THREE-STACKS-PLUS-A-DROPPED-RESOURCE
    description: >-
      FX-THREE-STACKS, then alpha applies a SECOND file resource
      (`alpha_extra` → `alpha/extra.txt`) over a dir whose earlier generations
      were written without it. That asymmetry is what makes the target
      generation DROP a resource, which is what sends `undo` through
      `undo_prune::destroy_absent_from_target` with real work to do. The
      three-stack fixture alone cannot exercise the ordering: alpha's resource
      SET never changes there, only its content.
    setup: |
      # tests/common/stack_stamp_harness.rs::fleet(), then
      #   write_stack_plus_extra(root, "alpha", "alpha", "mini", "one")
      #   forjar apply -f $root/alpha/forjar.yaml --state-dir $root/state --yes
      # undo's target then holds alpha_file but not alpha_extra.

  - id: FX-LOCK-BY-HAND
    description: >-
      A global lock written by hand with N stamps, over a state dir with one
      real generation. The shape under test belongs to the DIR, not to any one
      apply, so the unit tests construct it directly instead of driving N
      applies. No `.b3` sidecar is needed: `load_global_lock` does not verify
      one (the pre-apply integrity gate does, and no apply runs here).
    setup: |
      # src/cli/tests_generation.rs::write_global_lock(state_dir, &["alpha", "bravo"])
      # schema: "1.1" with stacks: {alpha: {...}, bravo: {...}}

  - id: FX-RENAMED-STACK
    description: >-
      One stack, one state dir, renamed in place: alpha is applied, then the
      SAME `forjar.yaml` is rewritten with `name: alpha-renamed` and new
      content (the resource ids and the machine are untouched — a rename OF the
      stack, not an edit to it), and applied again. The content changes so the
      undo that follows has work to do: without it the undo reports "already at
      generation N" and "allowed" cannot be told from "did nothing", which is
      how the interlock suite's renamed-stack test passed while the real undo
      was refused.
    setup: |
      # tests/common/stack_stamp_harness.rs::rename_stack, driven by
      # tests/falsification_state_stamp_per_name.rs::
      #   a_renamed_stack_is_one_lineage_not_two_stacks
      #   write_stack(root, "alpha", "alpha", "mini", "one"); apply
      #   rename_stack(cfg, "alpha", "alpha-renamed", "two"); apply
      # The anti-vacuity half adds bravo (its own file, its own machine) in a
      # state dir of its own, because the undo above replays the target
      # generation's config and re-stamps the dir under the historical name.

  - id: FX-BASENAME-TWIN
    description: >-
      The paiml/infra layout that produced the reproducer: `<root>/forjar.yaml`
      (`name: root-stack`, machine `box`) applied into `<root>/state`, then
      `<root>/machines/mini/forjar.yaml` (`name: mini`, machine `mini-box`)
      applied into the SAME dir. Two different files that share a basename and
      nothing else. The root stack's stamp records `../forjar.yaml`, which is
      what a suffix comparison matches the machine manifest against.
    setup: |
      # tests/common/stamp_rename_cases.rs::
      #   a_config_sharing_a_basename_is_not_a_rename_of_the_root_stack
      #   write_stack(root, ".", "root-stack", "box", "one"); apply
      #   write_stack(root, "machines/mini", "mini", "mini-box", "one"); apply

  - id: FX-TWO-MACHINE-STACK
    description: >-
      ONE stack declaring TWO machines, each with its own file resource, so a
      scoped `apply -m mini` has something to leave out. A one-machine stack
      cannot express the defect: its scoped and unscoped applies write the same
      set. The consequence half adds a sibling stack claiming the OTHER
      machine, because "still owned" is only meaningful if the ownership record
      is still read.
    setup: |
      # tests/common/stack_stamp_harness.rs::write_two_machine_stack, driven by
      # tests/common/stamp_rename_cases.rs::
      #   a_scoped_apply_keeps_the_machines_the_config_still_declares
      #   write_two_machine_stack(root, "alpha", "alpha", ("mini", "lambda-labs"), "one"); apply
      #   apply -m mini   # then: write_stack(root, "beta", "beta", "lambda-labs", "one"); apply

  - id: FX-PLANTED-SNAPSHOTS
    description: >-
      FX-THREE-STACKS plus twelve snapshot directories planted straight into
      `state/snapshots/`, over a keep count of 10. Planted rather than applied
      because the snapshot name carries a SECOND-resolution timestamp: applies
      driven back to back inside one second collide on it and the dir never
      reaches the retention count. `gc_old_snapshots` reads the dir, not the
      applies that filled it, and the planted names sort before `pre-apply-*`,
      so they are exactly what a gc that runs removes first.
    setup: |
      # tests/common/stack_stamp_harness.rs::plant_snapshots(state, 12), driven by
      # tests/common/stamp_rename_cases.rs::
      #   snapshot_gc_is_skipped_while_the_state_dir_holds_several_stacks
      # The anti-vacuity half plants the same twelve in a SINGLE-stack dir.


proof_obligations:
  - type: safety
    property: "A restore that cannot be scoped does not run"
    formal: "|stacks(D)| > 1 ⟹ exit ≠ 0 ∧ Δstate = ∅"
    tolerance: 0.0
    applies_to: "generation::rollback_to_generation and every caller of it"
    discharged_by: "FALSIFY-MSD-01, FALSIFY-MSD-02, FALSIFY-MSD-03, FALSIFY-MSD-04, FALSIFY-MSD-06, FALSIFY-MSD-08"

  - type: safety
    property: "The refusal precedes every destructive step of the asking verb, not just the restore"
    formal: "|stacks(D)| > 1 ⟹ ¬∃ w ∈ writes(e) : w before refuse(e)"
    tolerance: 0.0
    applies_to: "cmd_undo, whose destroy of the resources the target generation drops runs before the restore"
    discharged_by: "FALSIFY-MSD-08"

  - type: completeness
    property: "Every entry point onto the restore primitive is covered"
    formal: "∀ e ∈ EntryPoints : guarded(e)"
    tolerance: 0.0
    applies_to: "undo, undo --generations, undo --resume, rollback --generation"
    discharged_by: "FALSIFY-MSD-01..04 (one row per entry point)"

  - type: soundness
    property: "The guard does not fire on a dir it has no business refusing"
    formal: "|stacks(D)| ≤ 1 ⟹ restore behaves as before"
    tolerance: 0.0
    applies_to: "single-stack dirs, legacy 1.0 dirs, dirs with no global lock"
    discharged_by: "FALSIFY-MSD-05, FALSIFY-MSD-07"

  - type: soundness
    property: "The refusal counts stacks, not stamps: a rename is one lineage"
    formal: "rename(D, old -> new) ⟹ |stacks(D)| unchanged"
    tolerance: 0.0
    applies_to: "state::stamp::apply_stamp, whose retirement makes the count honest"
    discharged_by: "FALSIFY-MSD-09"

  - type: soundness
    property: "An undo does not add a stack to the dir it is undoing in"
    formal: "undo(D, g) ⟹ stacks(D) = {invoking} when |stacks(D)| = 1 before"
    tolerance: 0.0
    applies_to: "cli::undo_replay::replay_generation and state::stamp::replay, which resolve the identity the replay stamps with"
    discharged_by: "FALSIFY-MSD-10"

  - type: safety
    property: "A flag promising a restore is refused before the apply it precedes"
    formal: "|stacks(D)| > 1 ∧ --rollback-on-failure ⟹ exit ≠ 0 ∧ Δstate = ∅ ∧ Δhost = ∅"
    tolerance: 0.0
    applies_to: "cli::apply_preflight::rollback_on_failure_gate, and helpers_state::maybe_rollback_generation behind it"
    discharged_by: "FALSIFY-MSD-11"

  - type: soundness
    property: "A stamp's recorded -f names one file, so retirement cannot reach another stack"
    formal: "same_config_file(r, D, c) ⟺ r = stamped_config_file(D, c)"
    tolerance: 0.0
    applies_to: "state::stamp::identity, and state::stamp::rename::retire_renamed which deletes on a match"
    discharged_by: "FALSIFY-MSD-12"

  - type: soundness
    property: "A scoped apply does not release the machines the config still declares"
    formal: "machines(stamp') = (machines(stamp) ∪ written ∪ retired) ∩ declared"
    tolerance: 0.0
    applies_to: "state::stamp::rename::next_stamp, with the declared set supplied by cli::apply_output"
    discharged_by: "FALSIFY-MSD-13"

  - type: safety
    property: "Retention deletes no snapshot in a dir it cannot attribute"
    formal: "|stacks(D)| > 1 ⟹ snapshots(D) after ⊇ snapshots(D) before"
    tolerance: 0.0
    applies_to: "cli::apply_snapshot::gc_old_snapshots"
    discharged_by: "FALSIFY-MSD-14"

falsification_tests:
  - id: FALSIFY-MSD-01
    rule: INV-RESTORE-REFUSES-A-SHARED-STATE-DIR
    defect: undo-in-a-shared-state-dir-reverts-every-stack
    severity: HIGH
    prediction: >-
      `forjar undo --yes` in a dir holding three stacks exits non-zero, names
      PMAT-162, lists 'bravo' and 'charlie', and leaves every path under the
      state dir byte-identical.
    fixture: FX-THREE-STACKS
    command: |
      cargo test --test falsification_state_stamp_per_name \
        a_state_dir_holding_several_stacks_refuses_every_restore
    red_output: |
      undo --yes restored a state dir holding three stacks, reverting the other
      two with it:
      Undo: generation 3 → 2
      Changes (3 resource(s)):
        + charlie_file (clean-room): will be created
        + bravo_file (lambda-labs): will be created
        ~ alpha_file (mini): will be updated
      Rolled back to generation 2
      Re-applying generation 2's recorded config to converge the host...
      Apply complete: 1 converged, 0 unchanged.
    can_go_red: >-
      Measured 2026-09-06 at c26c468a, before the guard: rc=0, and the
      re-applied config was CHARLIE's — the operator asked to undo alpha. The
      test also runs the same command from bravo's config, so "refused" cannot
      be an accident of which stack asked.
    if_fails: >-
      An operator undoing their own manifest silently rolls the rest of a fleet
      back to a state nobody asked for, and the lock files that would have
      shown it are themselves what got reverted.
    owner: forjar

  - id: FALSIFY-MSD-02
    rule: INV-RESTORE-REFUSES-A-SHARED-STATE-DIR
    defect: explicit-generation-target-bypasses-nothing
    severity: HIGH
    prediction: >-
      `forjar undo --generations 3 --yes` — the same restore with its target
      named explicitly — is refused identically. (`undo` spells it
      `--generations N`, "how many back"; `--generation N` belongs to
      `rollback`.)
    fixture: FX-THREE-STACKS
    command: |
      cargo test --test falsification_state_stamp_per_name \
        a_state_dir_holding_several_stacks_refuses_every_restore
    red_output: |
      undo --generations 3 --yes restored a state dir holding three stacks,
      reverting the other two with it
    can_go_red: >-
      Same run as MSD-01: naming the generation changed nothing about the
