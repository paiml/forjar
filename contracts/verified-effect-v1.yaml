  - id: FALSIFY-VE-009
    rule: INV-JSON-IS-A-FORMAT-NOT-A-MODE
    prediction: "`run <task> --json` executes the task and propagates its exit code."
    test: |
      D=$(mktemp -d); cd "$D"
      cat > forjar.yaml <<EOF
      version: "1.0"
      name: repro
      machines:
        local: {hostname: localhost, addr: 127.0.0.1, user: noah,
                ssh_key: ~/.ssh/id_ed25519, arch: x86_64}
      resources:
        side-effect: {type: task, machine: local, command: "touch $D/effect.txt"}
        boom:        {type: task, machine: local, command: "exit 3"}
      EOF
      $FORJAR run side-effect >/dev/null 2>&1
      test -e effect.txt && echo PLAIN_RAN; rm -f effect.txt
      $FORJAR run side-effect --json >/dev/null 2>&1; echo "json_exit=$?"
      test -e effect.txt && echo JSON_RAN || echo JSON_DID_NOT_RUN
      $FORJAR run boom >/dev/null 2>&1;        echo "boom_plain_exit=$?"
      $FORJAR run boom --json;                 echo "boom_json_exit=$?"
    expected_red: |
      PLAIN_RAN
      json_exit=0
      JSON_DID_NOT_RUN
      boom_plain_exit=1
      {"task":"boom","command":"exit 3","script":"set -euo pipefail\nexit 3\n","timeout_secs":null}
      boom_json_exit=0
    red_is_reachable: >-
      Executed 2026-08-11. PLAIN_RAN and boom_plain_exit=1 are the controls from
      the same binary and same config: adding an output-format flag both skips
      the side effect and converts a failing task into a success. The emitted
      object has no status/exit_code field, so a JSON consumer cannot recover the
      failure either. GREEN requires JSON_RAN and boom_json_exit=1.
    if_fails: >-
      Any automation that chose --json for machine-readability gets a tool
      that never runs the task and never reports failure — the strictly
      worst combination, because the script's own error handling is disarmed
      at the same moment the work stops happening.
    owner: forjar

  - id: FALSIFY-VE-010
    rule: INV-UNSUPPORTED-IS-AN-ERROR-NOT-A-SUCCESS
    prediction: "`oci-pack` either produces the layout or exits non-zero in both channels."
    test: |
      D=$(mktemp -d); cd "$D"; mkdir src; echo x > src/a.txt
      $FORJAR oci-pack src --tag t:1 | tail -2; echo "exit=${PIPESTATUS[0]}"
      test -d oci-output && echo LAYOUT_PRESENT || echo LAYOUT_ABSENT
      $FORJAR oci-pack src --tag t:3 --output "$D/j" --json | head -3
      echo "json_exit=${PIPESTATUS[0]}"
      test -d "$D/j" && echo JSON_LAYOUT_PRESENT || echo JSON_LAYOUT_ABSENT
    expected_red: |
      OCI layout generation requires sha2+flate2 crates.
      Use `forjar apply` with type: image resources for full builds.
      exit=0
      LAYOUT_ABSENT
      {
        "source": "src",
        "tag": "t:3",
      json_exit=0
      JSON_LAYOUT_ABSENT
    red_is_reachable: >-
      Executed 2026-08-11. Two independent falsifications: the stated reason is
      untrue (`forjar build` writes a real OCI layout with sha256 blobs in the
      same binary, so those crates are compiled in), and --json suppresses even
      the honest caveat, emitting a full schemaVersion-2 manifest for a directory
      that does not exist. GREEN requires LAYOUT_PRESENT, or exit=1 in BOTH
      channels with the caveat present in the JSON too.
    if_fails: >-
      A synthesised OCI manifest for a directory that does not exist will be
      consumed by whatever reads that JSON, so the lie propagates downstream
      instead of stopping at the command that told it.
    owner: forjar

  - id: FALSIFY-VE-011
    rule: INV-SUCCESS-IMPLIES-VERIFIED-EFFECT
    prediction: "`contracts -f <missing>` reports the read failure instead of an empty report."
    test: |
      D=$(mktemp -d); cd "$D"
      $FORJAR contracts -f "$D/absent.yaml" | head -3; echo "exit=${PIPESTATUS[0]}"
      $FORJAR contracts -f "$D/absent.yaml" --json | head -2
      $FORJAR complexity -f "$D/absent.yaml"; echo "control_exit=$?"
    expected_red: |
      Contract Coverage Report
      ========================
      Resources analyzed: 0
      exit=0
      {
        "total_resources": 0,
      error: read <D>/absent.yaml: No such file or directory (os error 2)
      control_exit=1
    red_is_reachable: >-
      Executed 2026-08-11. "Resources analyzed: 0" over an absent file is
      indistinguishable from a genuinely empty config; the JSON carries no error
      field at all. `complexity -f` and `impact -f` on the same path exit 1 —
      every other -f consumer in the binary is the control. The root cause is a
      single `unwrap_or_default()` degrading a read error to an empty config.
      GREEN requires exit=1 naming the file, and an "error" key under --json.
    if_fails: >-
      Contract-coverage reporting is a quality signal. Pointed at a path
      typo it reports a clean zero-resource run, so the coverage metric
      silently measures nothing and trends beautifully.
    owner: forjar

  - id: FALSIFY-VE-012
    rule: INV-UNSUPPORTED-IS-AN-ERROR-NOT-A-SUCCESS
    prediction: >-
      A compiled-out feature and a stub runtime both exit non-zero rather than
      reporting skipped/Converged.
    test: |
      D=$(mktemp -d); cd "$D"; mkdir -p state/local
      echo 'secret1: ENC[age,data:abcdef0123456789]' > state/forjar.lock.yaml
      echo 'secret1: ENC[age,data:abcdef0123456789]' > state/local/state.lock.yaml
      BEFORE=$(md5sum state/forjar.lock.yaml | cut -d' ' -f1)
      $FORJAR state-decrypt --passphrase totally-wrong; echo "decrypt_exit=$?"
      AFTER=$(md5sum state/forjar.lock.yaml | cut -d' ' -f1)
      [ "$BEFORE" = "$AFTER" ] && echo FILES_UNTOUCHED
      $FORJAR state-encrypt --passphrase totally-wrong; echo "control_exit=$?"
      $FORJAR plugin init good >/dev/null 2>&1
      $FORJAR plugin run good --operation apply --json; echo "plugin_exit=$?"
    expected_red: |
      Decrypted 0 file(s), skipped 2, errors 0
      decrypt_exit=0
      FILES_UNTOUCHED
      error: encryption feature not enabled — build with --features encryption
      control_exit=1
      {"plugin":"good","operation":"apply","success":true,"message":"apply: stub (enable --features wasm-runtime)","status":"Converged","runtime":"stub"}
      plugin_exit=0
    red_is_reachable: >-
      Executed 2026-08-11. `state-encrypt` is the control and it is CORRECT in
      the very same build, on the very same wrong passphrase — the binary even
      ships the string "ENC[age,...] markers found but forjar was compiled
      without encryption support" that state-decrypt never prints. The plugin
      case is the same shape: a stub that executed nothing reports
      status Converged. GREEN requires decrypt_exit=1 and plugin_exit=1 with
      success:false.
    if_fails: >-
      A build without the encryption or wasm feature reports secrets handled
      and plugins converged. Operators conclude state is encrypted and
      plugin policy is enforced when neither code path exists in the binary
      they are running.
    owner: forjar

  - id: FALSIFY-VE-013
    rule: INV-NO-UNFALSIFIABLE-COUNTER
    prediction: >-
      `build --push` targets the declared tag, authenticates, and fails
      non-zero when it cannot; `build --json` emits JSON.
    test: |
      D=$(mktemp -d); cd "$D"; mkdir ctx; echo hi > ctx/a.txt
      cat > forjar.yaml <<EOF
      version: "1.0"
      name: repro
      machines:
        local: {hostname: localhost, addr: 127.0.0.1, user: noah,
                ssh_key: ~/.ssh/id_ed25519, arch: x86_64}
      resources:
        img: {type: image, machine: local, path: $D/ctx,
              tag: "ghcr.io/foo/bar:1.2.3"}
      EOF
      unshare -rn $FORJAR build --resource img --push 2>&1 | tail -5
      echo "push_exit=${PIPESTATUS[0]}"
      $FORJAR build --resource img --json 2>&1 | head -1
      $FORJAR build --resource img --json 2>/dev/null \
        | python3 -m json.tool >/dev/null; echo "json_parse=$?"
    expected_red: |
      --push: OCI Distribution v1.1
        registry: docker.io
        name: app
        tag: latest
        blobs: 3 to push
        push skipped: registry unreachable (no Location header in upload response)
      push_exit=0
      Warning: --json is not yet implemented for build output. Flag ignored.
      json_parse=1
    red_is_reachable: >-
      Executed 2026-08-11 (BLOCKER). Two independent proofs the push is
      fabricated: the registry/name/tag are the hardcoded constants
      docker.io/app:latest regardless of the declared ghcr.io/foo/bar:1.2.3, and
      under `unshare -rn` — no network at all — it still exits 0. With a network
      it prints "Push complete: 3 uploaded" while docker.io answers HTTP/2 401 to
      anonymous uploads and ~/.docker/config.json holds no docker.io credential.
      The build half is the control: it writes a real OCI layout under
      state/images/<res>/blobs/sha256/. GREEN requires push_exit≠0 offline, the
      declared tag echoed, and json_parse=0.
    if_fails: >-
      The BLOCKER: an image reported as pushed was never uploaded, to a
      registry nobody named, under a tag nobody declared. A deploy that
      pulls the declared tag gets whatever was there before, and the build
      log says the push completed.
    owner: forjar

  - id: FALSIFY-VE-014
    rule: INV-ARTIFACT-PARSES-IN-ITS-CONSUMER-FORMAT
    prediction: "`image --user-data` writes cloud-init that a YAML parser accepts."
    test: |
      mkrepro
      $FORJAR image -m local --user-data -o ud.yaml; echo "exit=$?"
      python3 -c "import yaml; yaml.safe_load(open('ud.yaml'))" 2>&1 | tail -3
      echo "parse_exit=$?"
      awk 'NR>=27&&NR<=30{printf "%d|%s\n",NR,$0}' ud.yaml
    expected_red: |
      Wrote user-data for 'local' to ud.yaml
      exit=0
      yaml.scanner.ScannerError: while scanning a simple key
        in "ud.yaml", line 29, column 1
      could not find expected ':'
      parse_exit=0
      27|    - |
      28|      cat > /target/etc/systemd/system/forjar-firstboot.service <<'UNIT'
      29|[Unit]
      30|Description=Forjar First Boot Convergence
    red_is_reachable: >-
      Executed 2026-08-11 (also 2/2 fresh dirs in the original dogfood). The
      oracle is a stock YAML parser, exactly the consumer cloud-init uses. Line
      29 leaves the `|` block scalar because the embedded heredoc body is
      interpolated without re-indentation. The same generator feeds the --base
      ISO path, so this artefact reaches real first boots. GREEN requires
      yaml.safe_load to succeed.
    if_fails: >-
      The unparseable cloud-init reaches real first boots via the same
      generator that feeds --base. The failure appears as an unattended
      install that silently skips forjar convergence, far from the command
      that reported 'Wrote user-data'.
    owner: forjar

  - id: FALSIFY-VE-015
    rule: INV-SUCCESS-IMPLIES-VERIFIED-EFFECT
    prediction: >-
      `apply --preview` and `apply --output-scripts` either apply, or say
      plainly that they did not.
    test: |
      mkrepro
      $FORJAR apply --yes --output-scripts ./sc 2>&1 | head -1
      test -e f1.txt && echo OS_APPLIED || echo OS_NOT_APPLIED
      test -d state  && echo OS_STATE    || echo OS_NO_STATE
      rm -rf state sc f1.txt
      $FORJAR apply --yes --preview 2>&1 | head -1; echo "preview_exit=${PIPESTATUS[0]}"
      test -e f1.txt && echo PV_APPLIED || echo PV_NOT_APPLIED
      $FORJAR status; echo "status_exit=$?"
    expected_red: |
      Exported 3 scripts to ./sc
      OS_NOT_APPLIED
      OS_NO_STATE
      Planning repro (1 machines, 1 resources)
      preview_exit=0
      PV_NOT_APPLIED
      error: cannot read state dir state: No such file or directory (os error 2)
      status_exit=1
    red_is_reachable: >-
      Executed 2026-08-11. `apply --yes` is an explicit instruction to apply;
      both flags silently downgrade it to a plan and still exit 0, and --preview
      — documented as "Show generated scripts before execution" — never shows a
      script, it prints a plan. `status` exiting 1 immediately afterwards is the
      independent oracle that nothing was applied. GREEN requires OS_APPLIED and
      PV_APPLIED, or an explicit "apply skipped" line.
    if_fails: >-
      `apply --yes` is an explicit instruction to converge. Downgrading it
      to a plan while exiting 0 means a deploy pipeline reports success
      having changed nothing — and --preview does not even show the scripts
      it is named for.
    owner: forjar

  - id: FALSIFY-VE-016
    rule: INV-OBSERVED-FAILURE-REACHES-THE-EXIT-CODE
    prediction: >-
      `validate --check-resource-names` compiles the pattern as a regex and
      exits non-zero on violations.
    test: |
      D=$(mktemp -d); cd "$D"
      cat > forjar.yaml <<EOF
      version: "1.0"
      name: repro
      machines:
        local: {hostname: localhost, addr: 127.0.0.1, user: noah,
                ssh_key: ~/.ssh/id_ed25519, arch: x86_64}
      resources:
        good-name: {type: file, machine: local, path: $D/a.txt, content: "a\n"}
        Bad_Name:  {type: file, machine: local, path: $D/b.txt, content: "b\n"}
      EOF
      $FORJAR validate --check-resource-names '.*' --no-color; echo "exit=$?"
      $FORJAR validate --check-resource-names '^[a-z-]+$' --no-color; echo "exit=$?"
      $FORJAR validate --check-naming --no-color 2>&1 | tail -1
      echo "control_exit=${PIPESTATUS[0]}"
    expected_red: |
      Resource naming violations (2):
        Bad_Name — does not match '.*'
        good-name — does not match '.*'
      exit=0
      Resource naming violations (2):
        Bad_Name — does not match '^[a-z-]+$'
        good-name — does not match '^[a-z-]+$'
      exit=0
      error: 1 naming violations
      control_exit=1
    red_is_reachable: >-
      Executed 2026-08-11. `.*` matching NOTHING is decisive: the pattern is
      applied as `name.contains(pattern)`, not a regex, so the documented
      "naming regex pattern" is a literal substring test that flags every
      well-named resource. The sibling --check-naming exits 1 on violations,
      which is the control for the exit-code half. GREEN requires exit=0 for
      '.*', exit=1 for '^[a-z-]+$' flagging only Bad_Name.
    if_fails: >-
      The naming policy is enforced by substring, so '.*' flags every well-
      named resource and no pattern can ever fail the build. A lint gate
      that cannot fail is a gate nobody will notice is off.
    owner: forjar

  - id: FALSIFY-VE-017
    rule: INV-OBSERVED-FAILURE-REACHES-THE-EXIT-CODE
    prediction: >-
      `bench --iterations 0` is rejected at the argument boundary, and an unmet
      target set never exits 0.
    test: |
      D=$(mktemp -d); cd "$D"
      $FORJAR bench --iterations 0 --no-color 2>&1 | grep -E 'NaN|targets met'
      echo "exit=${PIPESTATUS[0]}"
      $FORJAR bench --iterations abc 2>&1 | tail -1; echo "control_exit=${PIPESTATUS[0]}"
    expected_red: |2
        validate (3m, 20r)   NaNµs    0.0µs    0.0µs    < 10ms   [fail] FAIL
      ✗ 0/6 targets met
      exit=0
      error: invalid value 'abc' for '--iterations <ITERATIONS>': invalid digit found in string
      control_exit=2
    red_is_reachable: >-
      Executed 2026-08-11. The command prints its own verdict — "✗ 0/6 targets
      met" — and exits 0 anyway; the NaN is a literal divide-by-zero surfacing in
      user-visible output. clap already rejects a non-numeric value with rc=2, so
      the argument-validation machinery exists and simply has no lower bound.
      GREEN requires exit≠0 (rc=2 from value_parser range(1..) is preferred).
    if_fails: >-
      A benchmark that prints NaN and '0/6 targets met' while exiting 0
      makes a perf regression gate structurally unable to catch a perf
      regression.
    owner: forjar

  - id: FALSIFY-VE-018
    rule: INV-NO-UNFALSIFIABLE-COUNTER
    prediction: >-
      `environments rollback` resolves and restores a generation before logging,
      and rejects --generations 0.
    test: |
      D=$(mktemp -d); cd "$D"; mkdir -p state/prod
      $FORJAR environments rollback prod; echo "exit=$?"
      $FORJAR environments rollback prod --generations 0; echo "gen0_exit=$?"
      find state -type f
    expected_red: |
      Rollback logged for environment 'prod' (1 generation(s))
      exit=0
      Rollback logged for environment 'prod' (0 generation(s))
      gen0_exit=0
      state/prod/events.jsonl
    red_is_reachable: >-
      Executed 2026-08-11. There are ZERO generations to roll back to — state/prod
      was created empty by mkdir — yet it reports "(1 generation(s))" and, when
      asked for zero, reports "(0 generation(s))" as a success. The only file on
      disk afterwards is the audit log it just fabricated: the command's sole
      observable effect is the record claiming it did something else. GREEN
      requires exit=1 ("no generations for environment 'prod'") and gen0_exit=2.
    if_fails: >-
      Rollback is the last-resort operation. If it fabricates an audit event
      without restoring anything, the incident record says the environment
      was rolled back while it is still serving the bad generation.
    owner: forjar

  - id: FALSIFY-VE-019
    rule: INV-REMOTE-ACK-IS-PART-OF-THE-EFFECT
    prediction: >-
      A webhook receiver that rejects the notification with HTTP 500 produces
      the same warning as an unreachable one.
    test: |
      mkrepro
      cat > sink500.py <<'EOF'
      import http.server, sys
      class H(http.server.BaseHTTPRequestHandler):
          def do_POST(self):
              n = int(self.headers.get('Content-Length', 0)); self.rfile.read(n)
              self.send_response(500); self.send_header('Content-Length', '5')
              self.end_headers(); self.wfile.write(b'boom!')
          def log_message(self, *a): pass
      http.server.HTTPServer(("127.0.0.1", int(sys.argv[1])), H).serve_forever()
      EOF
      setsid nohup python3 sink500.py 19831 >/dev/null 2>&1 < /dev/null & sleep 1
      $FORJAR apply --yes --notify http://127.0.0.1:19831/n 2>&1 | tail -1
      echo "http500_exit=${PIPESTATUS[0]}"
      rm -rf state f1.txt
      $FORJAR apply --yes --notify http://127.0.0.1:19999/n 2>&1 | tail -1
      kill %1 2>/dev/null
    expected_red: |
      Apply complete: 1 converged, 0 unchanged.
      http500_exit=0
      Warning: webhook POST to http://127.0.0.1:19999/n failed (exit exit status: 7)
    red_is_reachable: >-
      Executed 2026-08-11 (2/2 runs, fresh dirs). The RED signal is the ABSENCE
      of a warning in the first case: the 500 receiver logs the hit, so delivery
      was attempted and refused, yet forjar says nothing. The dead-port control
      proves the warning path exists and fires — the difference is solely that
      curl is invoked without --fail, so it exits 0 for any completed HTTP
      transaction including 5xx. Port 19831/19999 on 127.0.0.1 only; no fleet
      host is contacted. GREEN requires the 500 case to print "Warning: webhook
      POST to http://127.0.0.1:19831/n failed (HTTP 500)".
    if_fails: >-
      A rejected webhook is indistinguishable from an accepted one, so a
      notification pipeline that has been failing since its receiver broke
      looks identical to one that works. This is the fleet's proven silent-
      green shape.
    owner: forjar

  - id: FALSIFY-VE-020
    rule: INV-RETENTION-IS-ORDERED-BEFORE-IT-IS-CUT
    prediction: "`logs --gc` keeps the 10 NEWEST runs per machine."
    test: |
      mkrepro
      for i in $(seq 1 15); do $FORJAR apply --yes --force >/dev/null 2>&1; sleep 0.4; done
      ls -1tr state/local/runs > order.txt
      $FORJAR logs --gc --dry-run > gc.out 2>&1; echo "exit=$?"
      grep 'would delete' gc.out | sed 's#.*local/##;s/ .*//' > del.txt
      python3 - <<'PY'
      order = [l.strip() for l in open('order.txt') if l.strip()]
      idx = {n: i + 1 for i, n in enumerate(order)}
      dels = [idx[l.strip()] for l in open('del.txt') if l.strip() in idx]
      print("runs=%d deleted_oldest_first_indices=%s" % (len(order), sorted(dels)))
      print("CORRECT" if sorted(dels) == list(range(1, len(order) - 9))
            else "RETENTION_VIOLATED")
      PY
    expected_red: |
      exit=0
      runs=15 deleted_oldest_first_indices=[2, 8, 9, 11, 13]
      RETENTION_VIOLATED
    red_is_reachable: >-
      Executed 2026-08-11 with 15 timestamp-ordered runs. Correct behaviour is
      deleting exactly indices [1, 2, 3, 4, 5]. Observed: index 1 — the OLDEST
      run — was KEPT while index 13 (3rd newest) was deleted. Two earlier trials
      showed different arbitrary subsets, which is the signature of
      filesystem/hash enumeration order rather than a sort. This is destructive
      data loss reported as routine housekeeping ("deleted N runs"). The 0.4s
      sleep guarantees distinct start timestamps so the correct answer is
      unambiguous. GREEN requires CORRECT.
    if_fails: >-
      Log retention deletes arbitrary runs including recent ones while
      claiming to keep the 10 newest. Forensic evidence for the incident you
      are investigating may already be gone, and the gc log says the policy
      was honoured.
    owner: forjar

  - id: FALSIFY-VE-021
    rule: INV-SERVER-HONOURS-ITS-TRANSPORT-TERMINATION
    prediction: "`forjar mcp` exits shortly after its stdin reaches EOF."
    test: |
      D=$(mktemp -d); cd "$D"
      printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"c","version":"1"}}}' > eof.jsonl
      $FORJAR mcp < eof.jsonl > eof.out 2>/dev/null &
      PID=$!; sleep 6
      if kill -0 $PID 2>/dev/null; then
        echo "STILL RUNNING 6s after stdin EOF"; kill -9 $PID
      else echo "EXITED"; fi
      head -c 60 eof.out; echo
      timeout 5 $FORJAR mcp < eof.jsonl >/dev/null 2>&1; echo "timeout_exit=$?"
    expected_red: |
      STILL RUNNING 6s after stdin EOF
      {"jsonrpc":"2.0","id":1,"result":{"protocolVersion":"2
      timeout_exit=124
    red_is_reachable: >-
      Executed 2026-08-11 (2/2 background-PID runs). timeout_exit=124 is the
      machine-readable form and every scripted MCP interaction in the dogfood
      returned it. The server DOES answer initialize, so it is alive and
      correct — it simply never observes its own termination condition, leaking
      one forjar process per client session. This is the family's degenerate
      member: unverified non-termination rather than unverified success. GREEN
      requires EXITED and timeout_exit=0.
    if_fails: >-
      Every MCP client leaks one forjar process per session and a spec-
      following client hangs at shutdown. Hosts accumulate parked servers
      until something else on the box fails first.
    owner: forjar

enforcement:
  black_box_oracle:
    layer: cli
    failure_mode: nonzero_exit
    ci_gate: required
    severity: "ERROR"
    check: "falsification_tests[*].test, executed against the release binary"
    description: |
      ENFORCED AT THE CLI BOUNDARY, NOT BY debug_assert.

      Every other contract in this directory enforces with debug_assert! inside
      a pure function. That is unavailable here for a structural reason worth
      stating: the property is about what the PROCESS tells the outside world,
      and a debug_assert on an internal struct is authored by the same code
      whose honesty is in question. Asserting `summary.converged ==
      plan.to_create` proves the planner agrees with itself. The oracle has to
      be outside.

      So enforcement is: each falsification_tests[].test is a black-box shell
      command whose oracle is the filesystem, a second process, a YAML/JSON
      parser, an HTTP status, or a sibling command in the same binary that is
      already correct. They run in CI against the RELEASE binary, in a fresh
      mktemp -d, with no fleet host reachable.

  one_exit_code_site_per_command:
    layer: cli
    failure_mode: nonzero_exit
    ci_gate: required
    severity: "ERROR"
    check: "FALSIFY-VE-006, FALSIFY-VE-016, FALSIFY-VE-017"
    description: |
      Results accumulate into a single collection; the exit code is computed
      from it once, after all branches. No branch may render output and return.
      `doctor --network`, `validate --check-resource-names` and `bench` are all
      this bug. A fix that merely adds a second `std::process::exit` will
      regress within a release.

  one_selector_resolver:
    layer: cli
    failure_mode: nonzero_exit
    ci_gate: required
    severity: "ERROR"
    check: "FALSIFY-VE-005, FALSIFY-VE-007, FALSIFY-VE-008"
    description: |
      `resolve_resource(name)?` / `resolve_machine(name)?` used by EVERY
      consumer, so a new flag cannot opt out of the membership check. Six graph
      flags already do it and two do not, which is precisely how the exemption
      arises: the check is per-call-site instead of per-type.

  json_is_a_renderer_not_a_branch:
    layer: cli
    failure_mode: nonzero_exit
    ci_gate: required
    severity: "ERROR"
    check: "FALSIFY-VE-009, FALSIFY-VE-010, FALSIFY-VE-002, FALSIFY-VE-013"
    description: |
      --json runs AFTER the work, over the same result value the text renderer
      consumes, and never before it. It must not skip execution, must not alter
      the exit code, and must not print human banners around its object in any
      mode. `run`, `oci-pack`, `promote --dry-run` and `build` are all this bug.

  release_gate:
    layer: release
    failure_mode: block_publish
    ci_gate: required
    severity: "ERROR"
    check: "full falsification set GREEN against the exact artifact being published"
    description: |
      Family B is why 1.12.3 must not be the reference for "forjar works". A
      crate release whose falsification set is not fully GREEN against the exact
      artifact being published is not releasable: the dogfood that found these
      24 defects ran against the PUBLISHED binary, and not one of them was
      visible from inside the test suite.

qa_gate:
  id: F-VE-001
  name: "Verified Effect Contract"
  description: >-
    Gates the claim that forjar's success output means something: no command
    reports success, and no command exits 0, without having confirmed its
    claimed effect through an oracle it did not author.
  checks:
    - "INV-SUCCESS-IMPLIES-VERIFIED-EFFECT"
    - "INV-NO-UNFALSIFIABLE-COUNTER"
    - "INV-A-GATE-MUST-BE-ABLE-TO-BLOCK"
    - "INV-EMPTY-SELECTION-IS-NOT-CLEAN"
    - "INV-OBSERVED-FAILURE-REACHES-THE-EXIT-CODE"
    - "INV-UNSUPPORTED-IS-AN-ERROR-NOT-A-SUCCESS"
    - "INV-JSON-IS-A-FORMAT-NOT-A-MODE"
    - "INV-ARTIFACT-PARSES-IN-ITS-CONSUMER-FORMAT"
    - "INV-REMOTE-ACK-IS-PART-OF-THE-EFFECT"
    - "INV-RETENTION-IS-ORDERED-BEFORE-IT-IS-CUT"
    - "INV-SERVER-HONOURS-ITS-TRANSPORT-TERMINATION"
  pass_criteria: >-
    All 21 falsification tests GREEN against the release binary, covering all
    24 confirmed members of family B (issue #210). Every test is RED today
    against forjar 1.12.3 from crates.io — that asymmetry is the gate's teeth.
  falsification: >-
    Restore any single early-returning render-and-return branch — e.g. make
    `doctor --network` print its results and return Ok(()) again — and
    FALSIFY-VE-006 goes RED. Re-introduce `unwrap_or_default()` on the config
    load in `contracts` and FALSIFY-VE-011 goes RED. Drop `--fail-with-body`
    from the notify curl invocation and FALSIFY-VE-019 goes RED.

verification_level: L2
