---
metadata:
  version: "1.0.0"
  kind: pattern
  created: "2026-08-11"
  author: "PAIML Engineering"
  description: |
    VERIFIED EFFECT — a command may report success only after it has confirmed,
    from a source independent of its own intent, that the work it claims
    happened actually happened.

    THE INVARIANT IN ONE LINE

      report(C) = success  ⟹  every effect C claimed is observable in the world
                              through a channel C did not author.

    WHY THIS CLASS KEEPS HAPPENING HERE

    forjar is a declarative tool. Its entire value proposition is that
    `Apply complete: 1 converged` means something. Yet the 2026-08-10 dogfood of
    the published 1.12.3 binary found 24 distinct commands that print a success
    banner and exit 0 while doing nothing, doing the wrong thing, or observing
    nothing at all. They are not 24 unrelated bugs. They are one bug written 24
    times, and the codebase reproduces it because of five structural habits:

    1. INTENT IS TREATED AS EVIDENCE. The success message is emitted from the
       branch that DECIDED to act, not from a read-back of the world. `trigger`
       counts the actions it MATCHED and prints "1 action(s) fired" —
       `actions_count` is the length of a Vec, not a tally of executions. Nothing
       downstream ever asks "did the action run?", so the count is unfalsifiable
       by construction.

    2. FEATURES SHIP AS PARSED-AND-DROPPED. clap declares the flag, --help
       documents it with an FJ- ticket number, and the value is never read.
       --checkpoint, --pre-check, --post-check, --pre-apply-hook,
       --post-apply-hook all parse cleanly and vanish. Because clap accepts them
       and the command exits 0, both the CLI surface and CI look healthy. This
       makes --pre-check a GATE THAT CANNOT BLOCK: a script that exits 1 still
       lets the apply through. An unpassable gate trains bypass; an unfailable
       gate trains false confidence, which is worse, because nobody notices.

    3. AN EMPTY SELECTION IS SCORED AS ZERO PROBLEMS RATHER THAN ZERO CHECKS.
       `drift --tripwire -m ghost` filters the machine list to nothing, finds no
       findings in nothing, and prints "No drift detected." while the only real
       machine is drifting. `test -r nosuch` reports "0 pass, 0 fail, 0 skip".
       In CI the exit code is frequently the ONLY signal read, so this converts a
       typo into a green build. The same command family already knows better:
       `explain nosuch` and `graph --subgraph NOSUCHRES` both exit 1 "not found".

    4. UNSUPPORTED IS RENDERED AS SUCCEEDED. Where a capability is compiled out
       or stubbed, the stub returns Ok. `plugin run --operation apply` reports
       "success": true, "status": "Converged", "runtime": "stub". `state-decrypt`
       counts ENC[age,...] files as "skipped" and exits 0. The binary contains
       the correct behaviour for the identical situation one command over:
       `state-encrypt` exits 1 "encryption feature not enabled". Two adjacent
       code paths, opposite honesty.

    5. THE FAILURE SIGNAL IS OBSERVED BUT NEVER ROUTED TO THE EXIT CODE.
       `doctor --network` PRINTS "✗ bogus (nonexistent-host.invalid) —
       unreachable" and exits 0, because the --network branch renders its own
       results and returns before the shared counter that computes the exit code.
       `bench --iterations 0` prints "✗ 0/6 targets met" and exits 0.
       `validate --check-resource-names` prints "Resource naming violations (2)"
       and exits 0. The tool sees the failure, says the failure, and then
       reports success.

    A SIXTH, SUBTLER FORM: SUCCESS THAT IS NEVER READ BACK THROUGH THE CONSUMER.
    `image --user-data` writes a cloud-init file and reports "Wrote user-data",
    but the file is not parseable YAML — no YAML parser was ever pointed at the
    generator's output. `build --push` prints "Push complete: 3 uploaded" to a
    hardcoded docker.io/app:latest with no auth. `apply --notify` shells out to
    curl WITHOUT --fail, so a receiver returning HTTP 500 is indistinguishable
    from acceptance while a refused connection (curl exit 7) is correctly warned
    about. In every case the independent oracle already exists — a YAML parser,
    the registry's HTTP status, curl's -w '%{http_code}' — and simply is not
    consulted.

    WHY THIS IS A `pattern` CONTRACT AND NOT A KERNEL ONE

    The property quantifies over PROCESS EXIT CODES, THE FILESYSTEM AFTER A RUN,
    and HTTP RESPONSES FROM A LIVE RECEIVER. None of that is in Kani's model. A
    bounded harness here could only prove something about a stubbed executor —
    i.e. it would prove that the code that already believes itself agrees with
    itself, which is the exact epistemic error this contract exists to outlaw.
    NO KANI HARNESS IS DECLARED, DELIBERATELY. The obligations are discharged by
    21 falsification tests, each a runnable shell command that is RED today
    against the published binary.

    HOW THE FALSIFICATION TESTS WERE CONSTRUCTED

    Every test below was EXECUTED against /home/noah/.cargo/bin/forjar (1.12.3,
    crates.io) on 2026-08-11 and observed to fail. The `expected_red` blocks are
    transcripts, ANSI stripped, not predictions. Each test also names a CONTROL —
    a sibling command in the same binary that behaves correctly on the same
    input — which is how we know the RED is a defect and not an unimplementable
    demand, and which supplies the exact wording the fix should adopt.

  verification_command: |
    # Preamble. Every falsification_tests[].test below is a complete shell
    # command that assumes only these two definitions.
    #
    #   RED   (bug present): the published 1.12.3 binary
    #   GREEN (bug fixed)  : the fix branch build
    #
    export FORJAR=/home/noah/.cargo/bin/forjar          # RED — all 21 fail
    # export FORJAR=/tmp/forjar-fix/target/release/forjar   # must go GREEN
    #
    # Minimal single-file repro config; $D is the fresh dir, cwd is $D.
    mkrepro() {
      D=$(mktemp -d); cd "$D" || return 1
      cat > forjar.yaml <<YAML
    version: "1.0"
    name: repro
    machines:
      local: {hostname: localhost, addr: 127.0.0.1, user: noah,
              ssh_key: ~/.ssh/id_ed25519, arch: x86_64}
    resources:
      f1: {type: file, machine: local, path: $D/f1.txt, content: "aaa\n",
           mode: "0644"}
    YAML
    }
    #
    # Then run each falsification_tests[].test in its own subshell. No test
    # touches a real fleet host: every machine is 127.0.0.1/localhost or an
    # RFC-2606 .invalid name, and every artefact lands under mktemp -d.

  references:
    - "issue: https://github.com/paiml/forjar/issues/210 — family B,
       unverified success (24 confirmed defects)"
    - "issue: https://github.com/paiml/forjar/issues/208 — umbrella dogfood
       inventory, 101 confirmed defects across 6 families"
    - "build-semantics-v1.yaml INV-NO-EVIDENCE-IS-NOT-SUCCESS and
       INV-EMPTY-SELECTION-IS-AN-ERROR — the v1.12 statement of the same rule,
       which this contract generalises from `check`/`apply` to EVERY command"
    - "source-content-identity-v1.yaml — the same disease in the planner:
       'unchanged' printed over stale bytes because the hash could not differ"
    - "idempotent-apply-v1.yaml — sound but vacuous if success is unverified"
    - "apply-summary-distinguishability-v1.yaml — why a summary line must
       distinguish outcomes it currently conflates"

equations:
  verified_effect:
    formula: |
      ∀ C ∈ Command:
        report(C) = success
          ⟹ ∀ e ∈ claims(C): observe(e, world_after(C)) = true
      where observe is evaluated by an ORACLE independent of C:
        the filesystem, a second process, a parser, or an HTTP status —
        never C's own intent, plan, or match set.
    domain: "C ∈ Command invocations, e ∈ claimed effects"
    codomain: "{success, failure} × exit_code ∈ ℕ"
    invariants:
      - "Success implies every claimed effect is independently observable"
      - "A claim counter (`N action(s) fired`, `N uploaded`, `N generation(s)`)
         counts EXECUTIONS, never matches, intentions, or Vec lengths"
      - "The contrapositive is the operative form: an unobservable effect makes
         the report a failure, and a failure exits non-zero"

  exit_code_totality:
    formula: |
      ∀ C: exit(C) = 0 ⟺ report(C) = success
        ∧ printed_failure(C) ≠ ∅ ⟹ exit(C) ≠ 0
    domain: "C ∈ Command invocations"
    codomain: "exit_code ∈ ℕ"
    invariants:
      - "No command prints a failure it does not also exit non-zero for"
      - "The exit code is computed once, at the end, from the SHARED result
         set — never by an early-returning branch that renders its own output"
      - "A tally the command itself printed as unmet (`0/6 targets met`,
         `violations (2)`, `✗ unreachable`) forces a non-zero exit"

  channel_agreement:
    formula: |
      ∀ C, ∀ channels t (text), j (--json):
        effects(C, t) = effects(C, j) ∧ exit(C, t) = exit(C, j)
        ∧ (j requested ⟹ stdout(C, j) ∈ WellFormedJSON)
    domain: "C ∈ Command invocations, channel ∈ {text, json}"
    codomain: "effect set × exit_code × stdout grammar"
    invariants:
      - "--json is an OUTPUT FORMAT, never a mode change: it must not skip
         execution and must not alter the exit code"
      - "When --json is set, stdout parses as JSON in EVERY mode of that
         command, including --dry-run"
      - "An artefact a command claims to have written parses in the format its
         consumer will use (YAML for cloud-init, JSON for a manifest)"

invariants:
  - id: INV-SUCCESS-IMPLIES-VERIFIED-EFFECT
    statement: >-
      A command prints a success banner and exits 0 only after reading the
      effect back. `trigger rb1` prints "Trigger 'rb1': 1 action(s) fired" while
      f1.txt and state/ do not exist and a plain `apply` in the same directory
      creates them; `promote -t prod` prints "Result: APPROVED (auto-approve:
      true)" with nothing applied and "No history for environment 'prod'";
      `apply --yes --checkpoint mycp` exits 0 with `snapshot list` saying
      "No snapshots.". All three are the same violation.

  - id: INV-NO-UNFALSIFIABLE-COUNTER
    statement: >-
      Every count in success output is derived from completed work, not from the
      size of a candidate set. "1 action(s) fired" is the length of the matched
      actions vector; "Push complete: 3 uploaded" is the blob count the packer
      produced; "Rollback logged for environment 'prod' (1 generation(s))" is a
      constant. A counter that cannot be wrong is not evidence.

  - id: INV-A-GATE-MUST-BE-ABLE-TO-BLOCK
    statement: >-
      Any option documented as a validation gate can stop the operation. A
      `--pre-check` script that exits 1 must abort the apply. Today it does not:
      the apply completes and exits 0, while the sibling `--pre-flight` on the
      identical script exits 1 with "error: Pre-flight check failed:" and writes
      nothing. A flag that is parsed and dropped is worse than an absent flag,
      because --help promises it and CI believes it.

  - id: INV-EMPTY-SELECTION-IS-NOT-CLEAN
    statement: >-
      A selector that matches nothing is an error naming what IS available, never
      a clean result. Zero checks performed must never be rendered as zero
      problems found. `drift --tripwire -m ghost` → "No drift detected." rc=0
      while the unfiltered run of the same tree exits 1 "Drift detected: 1
      resource(s)"; `test -r nosuch` → "0 pass, 0 fail, 0 skip" rc=0;
      `graph --prune NOSUCHRES` → "Pruned NOSUCHRES and 0 dependent(s)" rc=0.
      The binary's own convention is already rc=1 "not found" (`explain`,
      `graph --subgraph`, `graph --blast-radius`).

  - id: INV-OBSERVED-FAILURE-REACHES-THE-EXIT-CODE
    statement: >-
      A failure the command printed is a failure the command exits on. There is
      exactly one place per command where the exit code is computed, and every
      branch feeds it. `doctor --network` printing "✗ bogus
      (nonexistent-host.invalid) — unreachable" must exit 1 the way every other
      doctor failure does ("5 checks: 2 pass, 2 warn, 1 fail" / "error: doctor
      found failures").

  - id: INV-UNSUPPORTED-IS-AN-ERROR-NOT-A-SUCCESS
    statement: >-
      A compiled-out feature, a stub runtime, or an unimplemented renderer exits
      non-zero naming what is missing. It never reports Converged, never reports
      success: true, and never emits a synthesised artefact as though it were
      real. `state-encrypt` already does this correctly ("error: encryption
      feature not enabled — build with --features encryption"); `state-decrypt`,
      `plugin run`, and `oci-pack --json` in the same binary do not.

  - id: INV-JSON-IS-A-FORMAT-NOT-A-MODE
    statement: >-
      Adding --json never changes what a command DOES and never changes its exit
      code, and its stdout parses as JSON in every mode. Today `run <task>
      --json` skips execution entirely and turns a task that exits 3 (plain: rc=1
      "error: task 'boom' failed with exit 3") into rc=0 with no status field;
      `promote --dry-run --json` wraps the object in banner and footer lines so
      stdout is unparseable; `build --json` prints "Warning: --json is not yet
      implemented for build output. Flag ignored." and human text.

  - id: INV-ARTIFACT-PARSES-IN-ITS-CONSUMER-FORMAT
    statement: >-
      "Wrote X" is claimed only after X has been read back with a parser for the
      format its consumer uses. `image --user-data` reports success on a
      cloud-init file whose embedded heredoc body sits at column 0 inside a `|`
      block scalar, so PyYAML fails at line 29 — and the same generator feeds the
      --base ISO path, so the broken artefact reaches real boots.

  - id: INV-REMOTE-ACK-IS-PART-OF-THE-EFFECT
    statement: >-
      For a network side effect, delivery means the peer ACCEPTED it. HTTP status
      is the independent oracle and must be checked. `apply --notify` shells out
      to curl without --fail, so a receiver replying 500 produces no warning at
      all, while a refused connection to a dead port correctly produces "Warning:
      webhook POST to <url> failed (exit exit status: 7)". The rejection is
      currently indistinguishable from acceptance.

  - id: INV-RETENTION-IS-ORDERED-BEFORE-IT-IS-CUT
    statement: >-
      A retention policy stated as "keep the N newest" sorts by timestamp before
      cutting. `logs --gc` enumerates run directories in filesystem/hash order
      and keeps whichever N it meets first: with 15 known-ordered runs it deleted
      oldest-first indices 2, 8, 9, 11 and 13, keeping index 1 (the OLDEST) and
      destroying index 13 while claiming "within retention: 10 runs/machine".

  - id: INV-SERVER-HONOURS-ITS-TRANSPORT-TERMINATION
    statement: >-
      A process that serves a transport implements that transport's shutdown
      clause. `forjar mcp` serves MCP stdio, whose shutdown is "client closes the
      child's stdin and waits for exit", but a zero-length read is treated as
      "no message this iteration" and the loop parks forever. This is the
      degenerate member of the family: rather than reporting an unverified
      success, it never reports at all — a spec-following client hangs and every
      scripted interaction returns 124 from `timeout`.

proof_obligations:
  - type: soundness
    property: "Reported success entails the claimed effect occurred"
    formal: "report(C) = success ⟹ ∀ e ∈ claims(C): observe(e, world_after(C))"
    tolerance: 0.0
    applies_to: "every command that prints a success banner or exits 0"

  - type: independence
    property: >-
      The verification oracle is independent of the command's own intent — the
      filesystem, a second process, a parser, or an HTTP status
    formal: "observe ∉ σ(plan(C), match_set(C), intent(C))"
    tolerance: 0.0
    applies_to: "every success determination"

  - type: completeness
    property: "Every claim in the success output is covered by an observation"
    formal: "∀ e ∈ claims(C): ∃ o ∈ observations(C): o verifies e"
    tolerance: 0.0
    applies_to: "counters, banners, and boolean status fields"

  - type: postcondition
    property: "exit(C) = 0 iff no failure was observed or printed"
    formal: "printed_failure(C) ≠ ∅ ∨ unverified_claim(C) ≠ ∅ ⟹ exit(C) ≠ 0"
    tolerance: 0.0
    applies_to: all

  - type: classification
    property: "An empty selection classifies as error, not as clean"
    formal: "selection(C) = ∅ ⟹ report(C) = failure ∧ exit(C) = 1"
    tolerance: 0.0
    applies_to: "-m, -r, -t, --prune, --highlight and every other selector"

  - type: safety
    property: "An unsupported or stubbed capability never reports success"
    formal: "¬supported(feature(C)) ⟹ report(C) = failure ∧ exit(C) ≠ 0"
    tolerance: 0.0
    applies_to: "stub runtimes, compiled-out features, unimplemented renderers"

  - type: equivalence
    property: "Text and --json channels agree on effects and exit code"
    formal: "effects(C, text) = effects(C, json) ∧ exit(C, text) = exit(C, json)"
    tolerance: 0.0
    applies_to: "every command accepting --json"

  - type: precondition
    property: >-
      A gate option can refuse: a non-zero gate script aborts before any
      resource is touched
    formal: "gate(C) ≠ 0 ⟹ world_after(C) = world_before(C) ∧ exit(C) ≠ 0"
    tolerance: 0.0
    applies_to: "--pre-check, --post-check, --pre-apply-hook, --post-apply-hook"

  - type: ordering
    property: "Retention sorts by timestamp before applying the keep-N cut"
    formal: "kept(runs, N) = take(N, sort_desc_by_start(runs))"
    tolerance: 0.0
    applies_to: "logs --gc and every other retention sweep"

  - type: termination
    property: "A stdio server exits when its input stream reaches EOF"
    formal: "read(stdin) = EOF ⟹ ◇(process exits with 0)"
    tolerance: 0.0
    applies_to: "forjar mcp (stdio transport)"

falsification_tests:
  - id: FALSIFY-VE-001
    rule: INV-SUCCESS-IMPLIES-VERIFIED-EFFECT
    prediction: >-
      `trigger <rulebook>` reports actions fired only if they executed.
    test: |
      mkrepro
      cat > forjar-rules.yaml <<'EOF'
      rulebooks:
        - name: rb1
          events:
            - type: manual
          actions:
            - apply:
                file: forjar.yaml
      EOF
      $FORJAR trigger rb1; echo "exit=$?"
      test -e f1.txt && echo EFFECT_PRESENT || echo EFFECT_ABSENT
      $FORJAR trigger rb1 --json
      $FORJAR apply --yes >/dev/null 2>&1   # control: same dir, same config
      test -e f1.txt && echo CONTROL_APPLY_WORKS
    expected_red: |
      Trigger 'rb1': 1 action(s) fired
        [0] apply
      exit=0
      EFFECT_ABSENT
      {"rulebook": "rb1", "fired": true, "actions_count": 1}
      CONTROL_APPLY_WORKS
    red_is_reachable: >-
      Executed 2026-08-11 against 1.12.3 — output above is the transcript. The
      control line proves the action is executable in that exact directory, so
      "1 action(s) fired" is a fabricated count, not an environment problem.
      GREEN requires EFFECT_PRESENT, or fired:false with a non-zero exit.
    if_fails: >-
      A rulebook is a promise that infrastructure repairs itself on an
      event. If this is RED, every event-driven repair in the fleet is a no-
      op that logs 'fired' — the automation reports it healed something it
      never touched.
    owner: forjar

  - id: FALSIFY-VE-002
    rule: INV-SUCCESS-IMPLIES-VERIFIED-EFFECT
    prediction: >-
      `promote -t <env>` applies and records before reporting APPROVED, and its
      --dry-run --json stdout parses.
    test: |
      mkrepro
      cat >> forjar.yaml <<'EOF'
      environments:
        dev: {}
        prod:
          promotion:
            from: dev
            gates:
              - validate: {}
            auto_approve: true
      EOF
      $FORJAR promote -t prod < /dev/null | tail -1; echo "exit=$?"
      test -e f1.txt && echo EFFECT_PRESENT || echo EFFECT_ABSENT
      $FORJAR environments history prod
      $FORJAR promote -t prod --dry-run --json 2>/dev/null \
        | python3 -m json.tool >/dev/null; echo "dryrun_json_parse=$?"
      $FORJAR promote -t prod --json 2>/dev/null \
        | python3 -m json.tool >/dev/null; echo "plain_json_parse=$?"
    expected_red: |
      Result: APPROVED (auto-approve: true)
      exit=0
      EFFECT_ABSENT
      No history for environment 'prod'
      dryrun_json_parse=1
      plain_json_parse=0
    red_is_reachable: >-
      Executed 2026-08-11. Covers two family-B members at once: the promotion
      that approves without applying, and the --dry-run banner/footer that break
      its own JSON. plain_json_parse=0 is the control — the same command emits
      clean JSON in its other mode, so the dry-run breakage is a defect, not a
      limitation. GREEN requires EFFECT_PRESENT, a history entry, and
      dryrun_json_parse=0.
    if_fails: >-
      A promotion that approves without applying means prod is declared to
      match dev while still running the previous release, and the empty
      history removes the audit trail that would reveal it.
    owner: forjar

  - id: FALSIFY-VE-003
    rule: INV-NO-UNFALSIFIABLE-COUNTER
    prediction: "`apply --checkpoint NAME` creates a checkpoint discoverable by `snapshot list`."
    test: |
      mkrepro
      $FORJAR apply --yes >/dev/null 2>&1
      sed -i 's/"aaa/"AAA2/' forjar.yaml
      $FORJAR apply --yes --checkpoint mycp >/dev/null 2>&1; echo "exit=$?"
      $FORJAR snapshot list
      echo "mycp artifacts: $(find . -name '*mycp*' | wc -l)"
      $FORJAR apply --yes --force --snapshot-before snap1 >/dev/null 2>&1
      $FORJAR snapshot list          # control: the storage path works
    expected_red: |
      exit=0
      No snapshots.
      mycp artifacts: 0
        pre-apply-<epoch>
        snap1
    red_is_reachable: >-
      Executed 2026-08-11. The control `--snapshot-before snap1` in the SAME
      directory writes two snapshots, so the writer is functional and
      --checkpoint is parsed-and-dropped. GREEN requires "mycp" in `snapshot
      list` (or a checkpoint record `--resume` can consume), or a non-zero exit.
    if_fails: >-
      --checkpoint is the documented safety net taken BEFORE a risky apply.
      If it is RED, the rollback point the operator believes exists does
      not, and they discover it only when they need it.
    owner: forjar

  - id: FALSIFY-VE-004
    rule: INV-A-GATE-MUST-BE-ABLE-TO-BLOCK
    prediction: "A `--pre-check` script exiting 1 aborts the apply with a non-zero exit."
    test: |
      mkrepro
      printf '#!/bin/sh\nexit 1\n' > fail.sh; chmod +x fail.sh
      $FORJAR apply --yes --pre-check "$PWD/fail.sh" 2>&1 | tail -1
      echo "pre_check_exit=${PIPESTATUS[0]:-$?}"
      test -e f1.txt && echo APPLIED_ANYWAY || echo BLOCKED
      rm -rf state f1.txt
      $FORJAR apply --yes --pre-flight "$PWD/fail.sh" 2>&1 | tail -1
      test -e f1.txt && echo CONTROL_APPLIED || echo CONTROL_BLOCKED
    expected_red: |
      Apply complete: 1 converged, 0 unchanged.
      pre_check_exit=0
      APPLIED_ANYWAY
      error: Pre-flight check failed:
      CONTROL_BLOCKED
    red_is_reachable: >-
      Executed 2026-08-11. `--pre-flight` is the control: the identical failing
      script blocks the apply and exits 1 there. --pre-check/--post-check/
      --pre-apply-hook/--post-apply-hook are all parsed and dropped (verified by
      a hook that touches a marker file: only --pre-flight and --post-flight ran).
      GREEN requires BLOCKED and pre_check_exit=1.
    if_fails: >-
      A validation gate that cannot refuse is worse than no gate: --pre-
      check exists specifically so a policy script can stop an apply, and CI
      will treat its exit 0 as evidence the policy passed.
    owner: forjar

  - id: FALSIFY-VE-005
    rule: INV-EMPTY-SELECTION-IS-NOT-CLEAN
    prediction: "`drift -m <unknown>` errors instead of reporting the tree clean."
    test: |
      mkrepro
      $FORJAR apply --yes >/dev/null 2>&1
      echo TAMPER > f1.txt
      $FORJAR drift --tripwire -m ghost; echo "ghost_exit=$?"
      $FORJAR drift --tripwire 2>&1 | tail -2; echo "control_exit=${PIPESTATUS[0]}"
    expected_red: |
      No drift detected.
      ghost_exit=0
      Drift detected: 1 resource(s)
      error: 1 drift finding(s)
      control_exit=1
    red_is_reachable: >-
      Executed 2026-08-11. Same tree, same instant: the unfiltered tripwire
      exits 1 on real drift while `-m ghost` reports clean. A cron tripwire
      pinned to a renamed machine is therefore permanently green. GREEN requires
      ghost_exit=1 with an "unknown machine 'ghost'" style error.
    if_fails: >-
      A cron tripwire pinned to a machine that was renamed or removed
      reports 'No drift detected.' forever. Drift monitoring silently stops
      monitoring, and the absence of an alarm is read as the absence of
      drift.
    owner: forjar

  - id: FALSIFY-VE-006
    rule: INV-OBSERVED-FAILURE-REACHES-THE-EXIT-CODE
    prediction: "`doctor --network` exits non-zero when a connectivity check fails."
    test: |
      D=$(mktemp -d); cd "$D"
      cat > net.yaml <<'EOF'
      version: "1.0"
      name: repro
      machines:
        bogus: {hostname: bogus, addr: nonexistent-host.invalid, user: noah,
                ssh_key: ~/.ssh/id_ed25519, arch: x86_64}
      resources: {}
      EOF
      $FORJAR doctor -f net.yaml --network --no-color; echo "exit=$?"
      $FORJAR doctor -f missing.yaml --no-color 2>&1 | tail -2
      echo "control_exit=${PIPESTATUS[0]}"
    expected_red: |2
        ✗ bogus (nonexistent-host.invalid) — unreachable (22ms)
      exit=0
      5 checks: 2 pass, 2 warn, 1 fail
      error: doctor found failures
      control_exit=1
    red_is_reachable: >-
      Executed 2026-08-11 (also reproduced in the original dogfood in 2 fresh
      dirs). The control shows the shared counter path exits 1 correctly; only
      the --network branch bypasses it by rendering and returning early.
      nonexistent-host.invalid is RFC 2606 — it can never resolve, so the check
      genuinely fails every run. GREEN requires exit=1.
    if_fails: >-
      The one doctor check that actually touches the network is the one that
      cannot fail the command, so `forjar doctor --network` in a pre-flight
      script certifies an unreachable fleet as healthy.
    owner: forjar

  - id: FALSIFY-VE-007
    rule: INV-EMPTY-SELECTION-IS-NOT-CLEAN
    prediction: "`test -r <unknown>` errors instead of reporting an all-green empty run."
    test: |
