      error: resource 'nosuch' not found
      control_exit=1
    red_is_reachable: >-
      Executed 2026-08-11. `explain` on the identical unknown name is the
      binary's own established convention (rc=1 "not found"), so the demand is
      already implemented one command over. A mistyped `-r` in a CI test gate is
      currently a silent green. GREEN requires exit=1.
    if_fails: >-
      A typo in a CI test selector turns the test gate green with zero tests
      executed. The pipeline reports 'tests passed' having run none.
    owner: forjar

  - id: FALSIFY-VE-008
    rule: INV-EMPTY-SELECTION-IS-NOT-CLEAN
    prediction: "`graph --prune`/`--highlight` reject unknown resources like their siblings do."
    test: |
      mkrepro
      $FORJAR graph --no-color --prune NOSUCHRES | tail -1
      echo "prune_exit=${PIPESTATUS[0]}"
      $FORJAR graph --no-color --highlight NOSUCHRES >/dev/null 2>&1
      echo "highlight_exit=$?"
      $FORJAR graph --no-color --subgraph NOSUCHRES; echo "control_exit=$?"
    expected_red: |
      ── Pruned NOSUCHRES and 0 dependent(s)
      prune_exit=0
      highlight_exit=0
      error: Resource 'NOSUCHRES' not found
      control_exit=1
    red_is_reachable: >-
      Executed 2026-08-11. Six resource-taking flags on this one command already
      exit 1 "not found" (--subgraph, --blast-radius, --affected,
