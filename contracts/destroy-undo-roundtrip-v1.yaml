---
metadata:
  version: "1.0.0"
  kind: pattern
  created: "2026-06-12"
  author: "PAIML Engineering"
  description: |
    Destroy/undo roundtrip — a destroy (or any state mutation) followed by
    `forjar undo` restores the prior generation's state snapshot. An apply
    snapshots the state directory as a numbered generation (Nix-style) when
    the config sets `policy.snapshot_generations`, which is both the
    on-switch and the retention count; rollback restores the snapshot and
    atomically re-points the `current` symlink. Resolves the
    destroy/undo-roundtrip leg of paiml/forjar#97 (KZ-11).

    This block used to read "Each apply snapshots the state directory",
    unconditionally. It did not, and the contract could not tell: every test
    behind FALSIFY-UNDO-001..003 calls `create_generation` directly on a
    hand-built state dir, and every `cmd_undo` test fabricates
    `state/generations/N` with `create_dir_all` plus a hand-made `current`
    symlink. Nothing drove `apply` into `undo`, so all three stayed green
    across releases in which no real apply on a default config ever produced
    a generation and `undo` therefore always exited 1. FALSIFY-UNDO-004
    closes that gap by driving the binary.
  references:
    - "issue: https://github.com/paiml/forjar/issues/97"
    - "FJ-1386: generational state snapshots — src/cli/generation.rs"
    - "FJ-2003: active undo — src/cli/undo.rs"
    - "FJ-2005: undo-destroy replay — src/cli/undo_helpers.rs"
    - "Dolstra (2006) The Purely Functional Software Deployment Model (Nix generations)"

equations:
  snapshot_generation:
    formula: |
      create_generation(S) = g
        where generations/g = copy(S) ∧ current → g ∧ g = max(existing) + 1
    domain: "S = state_dir contents (lock files per machine)"
    codomain: "Result<u32, String> (new generation number)"
    invariants:
      - "Generation numbers are strictly increasing and never reused"
      - "current symlink points at the new generation after create"
      - "Snapshot excludes generations/ and snapshots/ (no recursion)"

  restore_generation:
    formula: "rollback_to_generation(g) ⟹ state_dir = generations/g ∧ current → g"
    domain: "g ∈ u32, existing generation"
    codomain: "Result<(), String>"
    invariants:
      - "current symlink points at the restored generation after rollback"
      - "Restored lock files match the snapshot content byte-for-byte"
      - "Rollback to a nonexistent generation is an error"
      - "Symlink switch is atomic (temp symlink + rename)"

  undo_roundtrip:
    formula: |
      undo(n) targets g = current − n;
      rollback(g) ∘ mutate ∘ snapshot(S → g) = S at the lock level
    domain: "n ∈ u32, n ≤ current generation"
    codomain: "Result<(), String>"
    invariants:
      - "Destroy followed by undo restores the prior generation's lock state"
      - "undo(n) with fewer than n generations is an error"
      - "After undo, current_generation = generation_from − n"
      - "An apply under `policy.snapshot_generations` records a generation on
         the FIRST apply, not the second — the state dir not yet existing is
         not a reason to skip it, since the pre-apply state is simply empty"
      - "A refusal names a remedy that can succeed for the config given: with
         `policy.snapshot_generations` unset, `forjar apply` is not one"

proof_obligations:
  - type: invariant
    property: "Create points current at the new generation"
    formal: "∀ S: create_generation(S) = Ok(g) ⟹ current_generation(gen_dir) = Some(g)"
    applies_to: all
    enforced_by: "src/cli/generation.rs::create_generation debug_assert_eq!"

  - type: invariant
    property: "Rollback points current at the restored generation"
    formal: "∀ g: rollback_to_generation(g) = Ok(()) ⟹ current_generation(gen_dir) = Some(g)"
    applies_to: all
    enforced_by: "src/cli/generation.rs::rollback_to_generation debug_assert_eq!"

  - type: roundtrip
    property: "Roundtrip restores the snapshot byte-for-byte"
    formal: "snapshot(S → g); mutate(S); rollback(g) ⟹ locks(state_dir) = locks(S)"
    applies_to: all
    enforced_by: "src/cli/tests_generation.rs::test_gh97_destroy_undo_roundtrip_restores_snapshot"

  - type: soundness
    property: "Undo refuses impossible targets"
    formal: "current < n ⟹ cmd_undo(n) = Err"
    applies_to: all
    enforced_by: "src/cli/undo.rs::cmd_undo guard (current < generations)"

  - type: completeness
    property: "The refusal names a remedy that can succeed for this config"
    formal: |
      no_generations(state_dir) ∧ policy.snapshot_generations = None
        ⟹ err names `policy.snapshot_generations` ∧ ¬(apply alone is offered)
    applies_to: all
    enforced_by: "src/cli/undo.rs::nothing_recorded_error"

  - type: roundtrip
    property: "A real apply, not a hand-built directory, feeds undo"
    formal: "apply(cfg) ∘ apply(cfg') ∘ apply(cfg'') ⟹ cmd_undo(1) = Ok(())"
    applies_to: all
    enforced_by: "tests/falsification_undo_advice_is_actionable.rs::apply_then_undo_reaches_the_rollback"

enforcement:
  current_symlink_resolves_to_new_generation:
    description: |
      The `current` symlink must resolve to the generation just created or
      restored; a debug_assert! aborts a debug build on a torn symlink
      switch. Release builds skip the asserts, so the roundtrip unit test
      carries the same shape on CI.
    check: "contract_tests::FALSIFY-UNDO-001"
    severity: "ERROR"
  unreliable_entries_excluded_from_the_guarantee:
    description: |
      The replay path (cmd_undo_destroy) is best-effort by design: entries
      flagged reliable_recreate=false require --force and are excluded from
      the byte-for-byte guarantee rather than silently counted within it.
    check: "contract_tests::FALSIFY-UNDO-002"
    severity: "ERROR"

falsification_tests:
  - id: FALSIFY-UNDO-001
    rule: "Snapshot monotonicity"
    prediction: "Consecutive create_generation calls return strictly increasing numbers"
    test: "src/cli/tests_generation.rs::test_create_multiple_generations"
    if_fails: "Generation numbers reused — rollback target ambiguous"

  - id: FALSIFY-UNDO-002
    rule: "Roundtrip restoration"
    prediction: "snapshot, mutate, rollback restores original lock content and current symlink"
    test: "src/cli/tests_generation.rs::test_gh97_destroy_undo_roundtrip_restores_snapshot"
    if_fails: "Rollback loses or corrupts state — undo is not a true inverse"

  - id: FALSIFY-UNDO-003
    rule: "Nonexistent target rejected"
    prediction: "rollback_to_generation to a missing generation returns Err"
    test: "src/cli/tests_generation.rs::test_rollback_nonexistent_generation"
    if_fails: "Rollback silently no-ops or destroys state on bad target"

  - id: FALSIFY-UNDO-004
    rule: "Undo is reachable from a real apply"
    prediction: |
      Driving the BINARY — three applies of changing content under
      `policy.snapshot_generations` — makes `undo --yes` exit 0 and roll back
      to the previous generation. UNDO-001..003 cannot see this: they build
      `state/generations/` themselves.
    test: "tests/falsification_undo_advice_is_actionable.rs::apply_then_undo_reaches_the_rollback"
    if_fails: "Undo is inert in production while the contract reads green"

  - id: FALSIFY-UNDO-005
    rule: "A refusal names a remedy that works"
    prediction: |
      On a config without `policy.snapshot_generations`, three successful
      applies leave undo's error BYTE-IDENTICAL — so an error offering
      `forjar apply` as the remedy is offering the one action that cannot
      help. The message must name the setting instead, and following it must
      make undo run.
    test: "tests/falsification_undo_advice_is_actionable.rs::misdirection_repro"
    if_fails: "Undo misdirects the operator into an unbounded re-apply loop"

qa_gate:
  id: F-UNDO-001
  name: "Destroy/Undo Roundtrip Contract"
  description: "Undo restores the prior generation's state snapshot, and refuses honestly when it cannot"
  checks:
    - "snapshot_generation"
    - "restore_generation"
    - "undo_roundtrip"
  pass_criteria: "All 5 falsification tests pass"
  falsification: "Skip restore_generation_to_state in rollback, switching only the symlink; or restore the `!state_dir.exists()` early return in apply.rs::maybe_auto_snapshot, which makes the first apply record nothing"

verification_level: L3
