metadata:
  version: "2.0.0"   # GH-235: composite_hash framing changed; every composite digest differs from v1
  created: "2026-02-24"
  author: "PAIML Engineering"
  description: "BLAKE3 content-addressed state hashing — tripwire integrity foundation"
  references:
    - "O'Connor et al. (2019) BLAKE3: One function, fast everywhere"

equations:
  hash_string:
    formula: "H(s) = 'blake3:' || hex(BLAKE3(s.as_bytes()))"
    domain: "s ∈ String"
    codomain: "String matching /^blake3:[0-9a-f]{64}$/"
    invariants:
      - "Output always has prefix 'blake3:'"
      - "Output length = 71 (7 prefix + 64 hex)"
      - "Deterministic: H(s) = H(s) for all s"

  hash_file:
    formula: "H(path) = 'blake3:' || hex(BLAKE3(read_all(path)))"
    domain: "path ∈ Path where path.exists() ∧ path.is_file()"
    codomain: "Result<String, String>"
    invariants:
      - "Output always has prefix 'blake3:' on success"
      - "Deterministic: same file contents → same hash"
      - "Returns Err for non-existent paths"

  composite_hash:
    formula: |
      H(c₁, ..., cₙ) = 'blake3:' || hex(BLAKE3(
          DOMAIN || u64le(n) || u64le(|c₁|) || c₁ || ... || u64le(|cₙ|) || cₙ ))
      where DOMAIN = "forjar-composite-v2\0"
    domain: "components ∈ [&str], n > 0"
    codomain: "String matching /^blake3:[0-9a-f]{64}$/"
    invariants:
      - "Output always has prefix 'blake3:'"
      - "Order-sensitive: H(a, b) ≠ H(b, a) in general"
      - "Deterministic: same inputs → same hash"
      - "INJECTIVE: distinct component vectors produce distinct digests. Components are length-PREFIXED, not merely NUL-SEPARATED. Separation alone is not injective — a NUL inside a component is indistinguishable from a component boundary, so H([\"a\\0b\"]) == H([\"a\", \"b\"]) under the v1 formula. This is the store's address function, and `arch`/`provider` are free-form strings from user YAML, so a collision means two derivations sharing one store entry."
      - "The component COUNT is hashed, so a 1-component vector can never reproduce an n-component one"
      - "DOMAIN-SEPARATED: a v2 digest can never coincide with a v1 digest of any input, so the re-address is clean rather than a cross-version collision"
    migration: |
      v2 changes every composite digest. Affected: store entry addressing
      (store_path), task artifact staleness (io_tracking), closure hashes.
      Store entries re-address once; task artifacts re-run once; both are
      self-healing. Machine state and drift hashes do NOT use composite_hash,
      so `forjar drift` is unaffected.

      The contract ID stays `blake3-state-v1` because it also governs
      hash_string and hash_file, which are unchanged, and the ID is the binding
      used by #[contract(...)] and generated_contracts.rs. The metadata version
      records the break.

proof_obligations:
  - type: invariant
    property: "All hashes have blake3: prefix"
    formal: "∀ input: output.starts_with('blake3:')"
    applies_to: all

  - type: invariant
    property: "Deterministic hashing"
    formal: "∀ s: hash_string(s) = hash_string(s)"
    applies_to: all

  - type: ordering
    property: "Composite hash is order-sensitive"
    formal: "∃ a, b: composite_hash([a, b]) ≠ composite_hash([b, a])"
    applies_to: all

enforcement:
  prefix_format:
    description: "All hash outputs must start with 'blake3:'"
    check: "contract_tests::FALSIFY-B3-001"
    severity: "ERROR"
  determinism:
    description: "Same input must always produce same hash"
    check: "contract_tests::FALSIFY-B3-002"
    severity: "ERROR"
  order_sensitivity:
    description: "Composite hash must be order-sensitive"
    check: "contract_tests::FALSIFY-B3-003"
    severity: "ERROR"
  injectivity:
    description: "Distinct component vectors must produce distinct digests (GH-235)"
    check: "contract_tests::FALSIFY-B3-004"
    severity: "ERROR"

falsification_tests:
  - id: FALSIFY-B3-001
    rule: "Prefix format"
    prediction: "hash_string(s) starts with 'blake3:' and has length 71 for any s"
    test: "proptest with 1000 random strings"
    if_fails: "Format string bug in hash_string"

  - id: FALSIFY-B3-002
    rule: "Determinism"
    prediction: "hash_string(s) = hash_string(s) for any random s"
    test: "proptest with random strings, call twice"
    if_fails: "Non-deterministic state in hasher"

  - id: FALSIFY-B3-003
    rule: "Order sensitivity"
    prediction: "composite_hash([a, b]) ≠ composite_hash([b, a]) for distinct a, b"
    test: "proptest with distinct string pairs"
    if_fails: "Missing NUL separator or sorting in composite_hash"

  - id: FALSIFY-B3-004
    rule: "Injectivity under embedded separators"
    prediction: |
      composite_hash(["a\0b"]) ≠ composite_hash(["a", "b"])
      composite_hash(["a\0b", "c"]) ≠ composite_hash(["a", "b\0c"])
    test: "tests/falsification_composite_hash_injectivity.rs"
    if_fails: |
      composite_hash reverted to unframed NUL separation. Two distinct
      derivations then share one store path: the second silently reuses the
      first's build output. FALSIFY-B3-001/002/003 all PASS on the broken
      implementation and always will — order-sensitivity and determinism are
      both satisfied by a non-injective function, which is why this obligation
      had to be added rather than being caught by the existing three.

kani_harnesses:
  - id: KANI-B3-001
    obligation: "Prefix format"
    property: "hash_string output format"
    bound: 32
    strategy: exhaustive
    harness: verify_hash_string_prefix

qa_gate:
  id: F-B3-001
  name: "BLAKE3 State Contract"
  description: "Content-addressed hashing quality gate"
  checks:
    - "prefix_format"
    - "determinism"
    - "order_sensitivity"
  pass_criteria: "All 4 falsification tests pass"
  falsification: "Remove 'blake3:' prefix from hash_string"

lean_proofs:
  # L4 — Lean 4 proof of this contract's decidable core. Verify: `lean lean/BlakeState.lean` (0 errors, no sorry).
  - id: blake3-state-lean-001
    file: lean/BlakeState.lean
    theorems: [PrefixOfAppend, HashDeterministic, HashHasBlakePrefix, HashNonEmpty]
    status: proved
verification_summary:
  total_obligations: 4
  l4_lean_proved: 2
  l4_not_applicable: 1   # I/O obligations, falsification-tested not Lean-proved
  l4_sorry_count: 0
  # prefix + determinism proved; hash-of-file disk read is I/O (falsification-tested)
