---
metadata:
  version: "1.0.0"
  kind: pattern
  created: "2026-08-11"
  author: "PAIML Engineering"
  description: |
    Flag-has-effect — every flag a command accepts must either change
    observable behaviour or be rejected at parse time. A flag that parses and
    does nothing is a lie in `--help`.

    WHY THIS CLASS KEEPS HAPPENING HERE

    forjar's CLI surface is declared in clap structs and its behaviour is
    dispatched somewhere else entirely. Adding a field to `ApplyArgs` makes the
    flag appear in `--help`, accepted, documented with an FJ- ticket number, and
    exit 0 — with no compiler obligation to ever read it. `Option<String>` that
    is never matched on is not dead code to rustc, it is a struct field. So the
    declared surface and the dispatch surface drift apart silently, and every
    smoke test that runs the flag and checks `rc == 0` passes.

    The 15 defects behind issue #211 share a signature that makes this
    diagnosable rather than merely embarrassing: EVERY ONE OF THEM HAS A WORKING
    SIBLING IN THE SAME BINARY.

      * `--skip / --only-machine / --exclude-machine / --resource-filter` are
        inert; `--subset / -r / -m` filter correctly in the same command line.
      * `--notify-slack-webhook` and `--notify-webhook-v2` never POST;
        `--notify-slack` and `--notify-webhook` POST to the identical
        127.0.0.1 receiver in the same run.
      * `apply --explain` prints nothing; `plan --why` prints per-resource
        explanations from a renderer that already exists.
      * `forjar validate` misnames a mis-indented `addr` as a missing field;
        forjar's OWN language server, on the identical bytes, reports the true
        indentation error.

    That sibling is simultaneously (a) the proof the defect is a defect and not
    an environment problem, and (b) the reason nobody noticed: the capability
    demonstrably works, just not from the surface that advertises it.

    The consequence is worse than a missing feature. An inert flag is a
    NEGATIVE-value feature: an operator who wires alerting to
    `--notify-slack-webhook` gets exit 0 and total silence; an operator who adds
    `--approval-webhook` believes change control is enforced while zero HTTP
    requests are made and convergence proceeds unconditionally. Removing the
    flag would leave them better off than shipping it.

    SCOPE

    "Flag" here means any element of the declared surface that promises an
    effect: a CLI flag, an MCP tool argument, and — for the subcommands whose
    entire declared effect is inert (`saga`, `undo`, `import`, `canary`) — the
    subcommand's own help text. The invariant is identical in all three cases:
    the declared effect must be observable, or the input must be refused.

    NO KANI HARNESS, DELIBERATELY. This property quantifies over PROCESS
    behaviour — argv parsing, filesystem deltas, network egress, TTY
    confirmation, subprocess execution — none of which is in Kani's model. A
    harness here could only prove something about a stubbed dispatcher, i.e.
    prove nothing about the bug. Obligations are discharged by the 16
    falsification tests below, each of which is a command that goes RED against
    the published binary today. Declaring an unrunnable harness to satisfy a
    schema would be exactly the vacuous-contract failure that let these 15
    defects ship.

    CI-RESIDENT FORM. Fifteen hand-written per-flag tests do not stop the
    SIXTEENTH inert flag. FALSIFY-FLAG-A16 is the only test in this contract
    that scales: enumerate every option field on the args structs BY REFLECTION
    over their serialised form and assert each is referenced by a dispatcher.
    A hand-written list of flags to check has precisely the same failure mode as
    the hand-written list of flags to consume — the next flag added is missing
    from both.
  verification_command: |
    # GREEN leg (CI-resident, must stay green):
    cargo fmt --all -- --check && cargo clippy --all-targets -- -D warnings && cargo test --lib
    # RED leg (must still reproduce against the shipped defect):
    #   export FORJAR=/home/noah/.cargo/bin/forjar   # 1.12.3 from crates.io
    #   run fixtures[].setup, then each falsification_tests[].command
    #   every command must emit its recorded red_output
    # FIXED leg:
    #   export FORJAR=/tmp/forjar-fix/target/release/forjar
    #   the same commands must NOT emit red_output
  references:
    - "issue: https://github.com/paiml/forjar/issues/211 — family A,
       flag-declared-never-consumed (15 confirmed defects)"
    - "issue: https://github.com/paiml/forjar/issues/208 — umbrella dogfood
       inventory (101 confirmed defects across 6 families)"
    - "build-semantics-v1.yaml § INV-EMPTY-SELECTION-IS-AN-ERROR — the v1.12
       precedent: a selector that matches nothing is an error, never a
       successful no-op. This contract is that principle applied to the flag
       that never reaches the selector at all."
    - "apply-summary-distinguishability-v1.yaml — the sibling failure mode:
       an effect that happened but is unreportable. Here the effect never
       happened and is reported as success."
    - "execution-safety-v1.yaml — fail-closed obligation that
       --approval-webhook violates"
    - "measured against forjar 1.12.3 (crates.io) on 2026-08-11: all 16
       falsification tests below were extracted from this file and executed
       verbatim, and all 16 emitted their recorded red_output byte-for-byte"

equations:
  flag_effect_or_reject:
    formula: |
      Let obs(c, A, E) = ⟨exit, stdout, stderr, Δfs, Δstate, egress, subprocs⟩
      be the complete observable trace of running command c with argv A in
      environment E.

      ∀ c ∈ Commands, ∀ f ∈ declared_flags(c):
          ( ∃ A, E :  obs(c, A ⊕ f, E) ≠ obs(c, A, E) )      -- f has an effect
        ∨ ( ∀ A, E :  exit(c, A ⊕ f, E) ≠ 0 )                -- or f is refused

      Negation (the falsifiable form actually tested): f is INERT iff over the
      witness set W of environments chosen to exercise its documented effect,
        ∀ E ∈ W : obs(c, A ⊕ f, E) = obs(c, A, E)  ∧  exit = 0.
    domain: "c ∈ Commands, f ∈ declared_flags(c), A ∈ Argv, E ∈ Environment"
    codomain: "Bool"
    invariants:
      - "A flag present in `--help` is present in some dispatch path"
      - "An unimplemented flag exits non-zero naming itself, rather than
         exiting 0 and doing nothing"
      - "`rc == 0` is never sufficient evidence that a flag was honoured"

  sibling_parity:
    formula: |
      variants(f) = { g ∈ declared_flags(c) : help(g) declares the same
                      capability as help(f), modulo a documented delta }

      ∀ f, g ∈ variants(f) : consumed(f) ⟺ consumed(g)

      where consumed(f) ⟺ the struct field backing f is read on some path
      reachable from the dispatcher for c.
    domain: "f, g ∈ declared_flags(c)"
    codomain: "Bool"
    invariants:
      - "--notify-webhook consumed ⟹ --notify-webhook-v2 consumed"
      - "--notify-slack consumed ⟹ --notify-slack-webhook consumed"
      - "--subset consumed ⟹ --skip, --only-machine, --exclude-machine and
         --resource-filter are consumed"
      - "plan --why renders ⟹ apply --explain renders"
      - "the LSP parses to an untyped Value before typing ⟹ the CLI config
         loader does too"

  gate_fails_closed:
    formula: |
      ∀ f ∈ gate_flags(c) with external dependency d:
        ¬granted(d)  ⟹  exit ≠ 0  ∧  Δfs = ∅  ∧  Δstate = ∅

      where ¬granted(d) covers: non-2xx response, connection failure, timeout,
      and an operator answering 'n' at a TTY prompt. Contacting d is a
      precondition of applying, not a side effect of it.
    domain: "f ∈ {--approval-webhook, canary confirmation, --auto-proceed}"
    codomain: "⟨exit, Δfs, Δstate⟩"
    invariants:
      - "A gate that cannot deny is not a gate"
      - "Zero requests to the approval endpoint is a denial, not an approval"
      - "No resource executes before the gate resolves"

  derived_values_recomputed:
    formula: |
      ∀ filter φ applied to a plan P:
        summary(P_φ) = summarise(changes(P_φ))
        ⟹ to_create + to_update + to_destroy + unchanged = |changes|

      A flag consumed at one site but not at the sites deriving values from it
      is a PARTIAL consumption, and produces output that contradicts itself.
    domain: "P ∈ ExecutionPlan, φ ∈ {resource, tag, machine} filter"
    codomain: "PlanSummary"
    invariants:
      - "Counts describe the array they are returned with"
      - "conservation of the change set survives every filter"
      - "A filter naming something that does not exist is an error, not an
         empty result with non-empty counts"

invariants:
  - id: INV-FLAG-EFFECT-OR-REJECT
    statement: >-
      Every flag in `--help` either changes the observable trace on some input,
      or is refused at parse time with a non-zero exit that names it. There is
      no third state. `apply --yes --skip a-file` writing a.txt, b.txt and
      c.txt at rc=0 is the canonical violation: the operator asked for less and
      got everything, with a success summary.

  - id: INV-SIBLING-PARITY
    statement: >-
      When two flags are documented as variants of one capability, either both
      reach the dispatcher or the unimplemented one is refused. Parity is
      checkable without knowing what either flag means, which is why it is the
      cheapest guard in this contract. Its violations are the sharpest evidence
      in the dogfood corpus: `--notify-slack` and `--notify-slack-webhook`
      pointed at the SAME 127.0.0.1 receiver in the SAME command line, and only
      one arrived.

  - id: INV-GATE-FAILS-CLOSED
    statement: >-
      A flag whose help text promises a gate must be able to STOP the
      operation. `--approval-webhook` (FJ-546, "POST for approval before
      applying (GitOps gate)") must POST before applying and must abort
      non-zero on non-2xx, timeout or connection failure. `canary` must not
      proceed to the fleet without an affirmative answer. Failing open is worse
      than having no gate, because the operator has stopped watching.

  - id: INV-FLAG-EFFECT-CONFINED
    statement: >-
      The dual of INV-FLAG-EFFECT-OR-REJECT, and the more dangerous half: a
      flag's effect is CONFINED to what its help text says. No flag may relax a
      safety gate it does not name. `--yes` ("skip confirmation prompt (CI
      mode)") also switched off BLAKE3 state-integrity verification —
      `has_errors(&issues) && !yes` — and `--yes` is mandatory for every
      non-interactive apply, so the gate was absent for exactly the runs nobody
      watches: apply printed `ERROR: integrity check failed`, converged over the
      tampered lock, and exited 0. A flag that means two things cannot be
      reasoned about from `--help`, and the second meaning is always the one
      discovered during an incident. The fix is to remove the second meaning,
      not to rename it — the gate now takes no override argument at all, and the
      refusal names the deliberate recovery instead (`forjar reseal`). Where a
      refusal names an escape, this contract requires that escape to be TESTED:
      a gate whose stated way out does not work is the shape that trains people
      to bypass gates.

  - id: INV-SINK-FLAGS-PRODUCE-ARTIFACTS
    statement: >-
      A flag naming a sink — a file path, a log path, a URL, a command to run —
      must, after a run that reports success, have written that file, emitted
      that JSON, reached that URL, or executed that command. If the sink cannot
      be written the run exits non-zero. Silence is not an acceptable outcome
      for a flag whose entire purpose is to break silence.

  - id: INV-HEADER-FLAGS-REACH-THE-WIRE
    statement: >-
      A flag carrying transport metadata (`--notify-webhook-headers`,
      `--notify-custom-headers`) must appear on the request. Dropping it does
      not merely lose a feature: most real webhook receivers authenticate via a
      header, so the notification goes out unauthenticated and is rejected —
      and forjar does not report that rejection either. Malformed JSON is an
      error, never a silent drop.

  - id: INV-METADATA-FLAGS-ARE-RETRIEVABLE
    statement: >-
      `--label`, `--comment` (FJ-430, "attach a comment to the apply run in
      event log") and `--runbook` (FJ-566, "attach runbook URL to apply for
      audit trail") must be recoverable afterwards from state, `history --json`
      or `audit`. "Attached to the audit trail" means grep-able. Metadata that
      cannot be read back was not recorded.

  - id: INV-ENUM-FLAGS-VALIDATE-THEIR-DOMAIN
    statement: >-
      A flag documented with a value set rejects values outside it at parse
      time. `--sandbox` documents "pepita, container, chroot" and accepts
      `bogusbackend` at rc=0; the same binary rejects
      `completion powershell` at rc=2 with a possible-values list, so the
      mechanism exists and is simply not applied. Accepting a typo'd backend
      silently is how an operator concludes a sandbox was used when none was.

  - id: INV-EFFECT-COMPLETENESS
    statement: >-
      A flag's effect is applied at ONE point, before any value derived from it
      is computed. Partial consumption is a distinct and nastier failure than
      no consumption, because the output is self-contradictory rather than
      merely wrong: MCP `forjar_plan` with `resource: hello-file` returns
      `changes` of length 1 alongside `to_create: 2`. The sibling `tag` filter
      in the same handler filters before summarising and is correct — internal
      proof this is a bug, not a "global totals" design.

  - id: INV-REACHABLE-RENDERER-MUST-BE-REACHED
    statement: >-
      Where correct behaviour is demonstrably implemented elsewhere in the same
      binary, the surface that declares it dispatches to it rather than to a
      degraded fallback. `apply --explain` must invoke the renderer `plan --why`
      already uses. The CLI config loader must parse to an untyped Value first
      and propagate scanner errors verbatim, as forjar's own LSP already does —
      otherwise a mis-indented `addr:` that is textually present is reported as
      "missing field `addr`", byte-identical to the genuinely-absent case, and
      the user retypes a key that was already there.

  - id: INV-DECLARED-OPERATION-HAPPENS
    statement: >-
      The flag invariant generalised to subcommands: a subcommand's declared
      effect must be observable or the command must fail. `saga` must not print
      `Success: true` with `Applied: 0` and every step `[PENDING]`; success
      derived from `failed == 0` rather than `applied == total` makes any CI job
      gating on `.success` pass on a no-op. `undo` must restore the target
      generation's content rather than re-converging forward against the
      current config. `import` against an unreachable host must exit non-zero
      rather than spend 15s failing to connect and print
      "Imported 0 resources".

fixtures:
  - id: FX-3FILE
    description: >-
      Three file resources on one local machine. Used by every apply-flag test.
      Writes only inside /tmp/forjar-dogfood — never a real host.
    setup: |
      export FORJAR=${FORJAR:-/home/noah/.cargo/bin/forjar}
      export D=/tmp/forjar-dogfood/flagA/base
      rm -rf "$D" && mkdir -p "$D" && cd "$D"
      cat > forjar.yaml <<EOF
      version: "1.0"
      name: dogfood-sandbox
      params:
        sandbox: $D
      machines:
        local: {hostname: localhost, addr: 127.0.0.1, user: noah, arch: x86_64}
      resources:
        a-file: {type: file, machine: local, path: "{{params.sandbox}}/a.txt", content: "A\n", mode: "0644"}
        b-file: {type: file, machine: local, path: "{{params.sandbox}}/b.txt", content: "B\n", mode: "0644"}
        c-file: {type: file, machine: local, path: "{{params.sandbox}}/c.txt", content: "C\n", mode: "0644"}
      EOF

  - id: FX-3FILE-SCOPE
    description: >-
      PMAT-160 (#466 #467): three file resources on two machines, one in a
      resource group, so `--subset`/`--exclude`/`-g`/`--skip`/`-m` each have a
      distinct set to select. Writes only inside /tmp/forjar-dogfood.
    setup: |
      export FORJAR=${FORJAR:-/home/noah/.cargo/bin/forjar}
      export G=/tmp/forjar-dogfood/flagA/scope
      rm -rf "$G" && mkdir -p "$G" && cd "$G"
      cat > forjar.yaml <<EOF
      version: "1.0"
      name: dogfood-sandbox
      machines:
        local: {hostname: localhost, addr: 127.0.0.1, user: noah, arch: x86_64}
        other: {hostname: localhost, addr: 127.0.0.1, user: noah, arch: x86_64}
      resources:
        a-file: {type: file, machine: local, resource_group: web, path: "$G/a.txt", content: "A\n", mode: "0644"}
        b-file: {type: file, machine: local, path: "$G/b.txt", content: "B\n", mode: "0644"}
        c-file: {type: file, machine: other, path: "$G/c.txt", content: "C\n", mode: "0644"}
      EOF

  - id: FX-HTTP-SINK
    description: >-
      A localhost HTTP receiver that logs method, path, headers and body of
      every POST. 127.0.0.1 only; no fleet host is ever contacted.
    setup: |
      export FORJAR=${FORJAR:-/home/noah/.cargo/bin/forjar}
      export H=/tmp/forjar-dogfood/flagA/http
      rm -rf "$H" && mkdir -p "$H" && cd "$H"
      cat > forjar.yaml <<EOF
      version: "1.0"
      name: appr
      machines:
        local: {hostname: localhost, addr: 127.0.0.1, user: noah, arch: x86_64}
      resources:
        hello-file: {type: file, machine: local, path: $H/hello.txt, content: "hi\n", mode: "0644"}
      EOF
      cat > sink.py <<'PY'
      import http.server, sys
      class Handler(http.server.BaseHTTPRequestHandler):
          def do_POST(self):
              n = int(self.headers.get('Content-Length', 0))
              body = self.rfile.read(n)
              print("HIT %s hdrs=%s body=%s" % (self.path, dict(self.headers),
                                                body.decode()), flush=True)
              self.send_response(200); self.send_header('Content-Length', '2')
              self.end_headers(); self.wfile.write(b'ok')
          def log_message(self, *a): pass
      http.server.HTTPServer(("127.0.0.1", int(sys.argv[1])), Handler).serve_forever()
      PY
      pkill -f "sink.py 19871" 2>/dev/null; sleep 1   # a stale sink would
      setsid nohup python3 sink.py 19871 > s.log 2>&1 < /dev/null &   # keep the
      sleep 1                                         # port and log elsewhere
      # teardown: pkill -f "sink.py 19871"

proof_obligations:
  - type: completeness
    property: "The dispatch surface covers the declared surface"
    formal: "∀ f ∈ declared_flags(c) : consumed(f) ∨ refused(f)"
    tolerance: 0.0
    applies_to: "every clap args struct and every MCP tool input schema"
    discharged_by: "FALSIFY-FLAG-A16 (reflection), A01, A02, A07, A08, A09, A10"

  - type: soundness
    property: "`--help` never claims an effect that does not occur"
    formal: "help(f) asserts E ⟹ ∃ input : E observable in obs(c, A ⊕ f)"
    tolerance: 0.0
    applies_to: "all documented flags and subcommands"
    discharged_by: "FALSIFY-FLAG-A01..A15"

  - type: safety
    property: "Gate flags fail closed; nothing executes before the gate resolves"
    formal: "¬granted(d) ⟹ exit ≠ 0 ∧ Δfs = ∅ ∧ Δstate = ∅"
    tolerance: 0.0
    applies_to: "--approval-webhook, canary fleet phase, --auto-proceed"
    discharged_by: "FALSIFY-FLAG-A05, FALSIFY-FLAG-A06"

  - type: safety
    property: "A flag does not relax a gate its help text does not name"
    formal: "gate G blocks c ∧ f ∉ overrides(G) ⟹ obs(c, A ⊕ f) still blocked by G"
    tolerance: 0.0
    applies_to: "--yes vs the BLAKE3 state-integrity gate; --plan-file and
                 --refresh-only vs the whole apply preflight; every future
                 confirmation flag"
    discharged_by: "FALSIFY-FLAG-A17, FALSIFY-FLAG-A18, FALSIFY-FLAG-A19"

  - type: liveness
    property: "Every named sink is written, reached, or executed before exit 0"
    formal: "sink(f) = s ∧ exit = 0 ⟹ observed_at(s)"
    tolerance: 0.0
    applies_to: "--notify-file, --notify-log, --notify-json, --notify-exec,
                 --log-file, all --notify-*-webhook URLs"
    discharged_by: "FALSIFY-FLAG-A02, FALSIFY-FLAG-A03"

  - type: equivalence
    property: "Sibling flags are consumed together"
    formal: "∀ f, g ∈ variants : consumed(f) ⟺ consumed(g)"
    tolerance: 0.0
    applies_to: "--notify-webhook/-v2, --notify-slack/-webhook,
                 --subset/--skip/--only-machine/--exclude-machine/--resource-filter,
                 plan --why / apply --explain, LSP loader / CLI loader"
    discharged_by: "FALSIFY-FLAG-A01, A03, A07, A15"

  - type: classification
    property: "Enum-valued flags reject values outside their documented set"
    formal: "v ∉ values(f) ⟹ exit = 2 ∧ stderr names the possible values"
    tolerance: 0.0
    applies_to: "--sandbox {pepita, container, chroot}"
    discharged_by: "FALSIFY-FLAG-A10"

  - type: frame
    property: "A restricting flag restricts the write frame"
    formal: "frame(apply --exclude-machine m) ∩ resources_on(m) = ∅"
    tolerance: 0.0
    applies_to: "--skip, --only-machine, --exclude-machine, --resource-filter"
    discharged_by: "FALSIFY-FLAG-A01"

  - type: conservation
    property: "Plan counters are derived from the change set they accompany"
    formal: "to_create + to_update + to_destroy + unchanged = |changes|"
    tolerance: 0.0
    applies_to: "MCP forjar_plan under every filter argument"
    discharged_by: "FALSIFY-FLAG-A14"

  - type: postcondition
    property: "Run metadata supplied on the command line is retrievable"
    formal: "apply --comment X ⟹ X ∈ history --json ∪ audit ∪ state/"
    tolerance: 0.0
    applies_to: "--label, --comment, --runbook"
    discharged_by: "FALSIFY-FLAG-A08"

  - type: old_state
    property: "Undo converges to the restored generation, not to the current config"
    formal: "content_after(undo) = content_at(generation N-1)"
    tolerance: 0.0
    applies_to: "undo, generation rollback"
    discharged_by: "FALSIFY-FLAG-A12"

  - type: invariant
    property: "A declared operation that performed nothing does not report success"
    formal: "applied < total ⟹ success = false ∧ exit ≠ 0"
    tolerance: 0.0
    applies_to: "saga, import"
    discharged_by: "FALSIFY-FLAG-A11, FALSIFY-FLAG-A13"

falsification_tests:
  - id: FALSIFY-FLAG-A01
    rule: INV-FLAG-EFFECT-OR-REJECT
    defect: apply-targeting-flags-silently-ignored
    severity: HIGH
    prediction: >-
      Each of --skip, --only-machine, --exclude-machine and --resource-filter
      changes the set of converged resources, or exits non-zero.
    fixture: FX-3FILE
    command: |
      cd "$D"
      t(){ rm -rf state a.txt b.txt c.txt; "$FORJAR" apply --yes "$@" >out 2>&1
           echo "[$*] rc=$? files=[$(ls | grep '\.txt$' | tr '\n' ' ')]"; }
      t --skip a-file
      t --only-machine ghost
      t --exclude-machine local
      t --resource-filter 'a-*'
      t --subset 'a-*'       # in-binary control
      t -r a-file            # in-binary control
      t -m ghost             # in-binary control
    red_output: |
      [--skip a-file] rc=0 files=[a.txt b.txt c.txt ]
      [--only-machine ghost] rc=0 files=[a.txt b.txt c.txt ]
      [--exclude-machine local] rc=0 files=[a.txt b.txt c.txt ]
      [--resource-filter a-*] rc=0 files=[a.txt b.txt c.txt ]
      [--subset a-*] rc=0 files=[a.txt ]
      [-r a-file] rc=0 files=[a.txt ]
      [-m ghost] rc=0 files=[]
    can_go_red: >-
      Confirmed RED on forjar 1.12.3 on 2026-08-11. The last three lines are the
      control: the identical harness, same binary, same config, produces a
      RESTRICTED file set for --subset/-r/-m, so the test can distinguish
      "filtering is broken" from "filtering is unimplemented". It goes GREEN
      only when the first four lines restrict too, or exit non-zero.
    if_fails: >-
      An operator excluding a machine from a fleet apply gets a full apply to it
      with a green summary — the exact shape of a production incident.
    owner: forjar

  - id: FALSIFY-FLAG-A02
    rule: INV-SINK-FLAGS-PRODUCE-ARTIFACTS
    defect: apply-local-notification-and-log-sinks-do-nothing
    severity: HIGH
    prediction: >-
      --notify-file writes a file, --notify-log appends JSON lines,
      --notify-json prints JSON on stdout, --notify-exec runs the command, and
      --log-file writes a log — or apply exits non-zero.
    fixture: FX-3FILE
    command: |
      cd "$D"; rm -rf state a.txt b.txt c.txt st.txt ev.jsonl EXECMARK apply.log
      "$FORJAR" apply --yes \
        --notify-file "$D/st.txt" --notify-log "$D/ev.jsonl" --notify-json \
        --notify-exec "/usr/bin/touch $D/EXECMARK" --log-file "$D/apply.log" \
        > nout 2>&1; echo "rc=$?"
      for x in st.txt ev.jsonl EXECMARK apply.log; do
        test -e "$D/$x" && echo "$x EXISTS" || echo "$x MISSING"; done
      echo "json lines: $(grep -c '^{' nout)"
    red_output: |
      rc=0
      st.txt MISSING
      ev.jsonl MISSING
      EXECMARK MISSING
      apply.log MISSING
      json lines: 0
    can_go_red: >-
