        "$FORJAR" validate -f "$f" > "$f.out" 2>&1; echo "$f exit=$?"; cat "$f.out"; done
      diff misindented.yaml.out missing.yaml.out >/dev/null \
        && echo "INDISTINGUISHABLE FROM GENUINELY-MISSING" \
        || echo "distinguishable"
    red_output: |
      misindented.yaml exit=3
      error: YAML parse error: machines.local: missing field `addr` at line 5 column 5
      missing.yaml exit=3
      error: YAML parse error: machines.local: missing field `addr` at line 5 column 5
      mis2.yaml exit=3
      error: YAML parse error: did not find expected key at line 7 column 4, while parsing a block mapping at line 4 column 3
      INDISTINGUISHABLE FROM GENUINELY-MISSING
    can_go_red: >-
      Confirmed RED on 1.12.3 on 2026-08-11. Three independent controls make
      this unarguable: (1) mis2.yaml, the same mistake one line later, gets the
      CORRECT scanner message from the same binary; (2) forjar's own LSP on the
      identical bytes publishes "did not find expected key at line 6 column 4";
      (3) an independent YAML parser (PyYAML) agrees on line 6. GREEN requires
      the first message to mention line 6 AND to differ from missing.yaml's.
    if_fails: >-
      The user deletes and retypes a key that was already there instead of
      fixing the indentation, and forjar's two surfaces keep disagreeing about
      the same file.
    owner: forjar

  - id: FALSIFY-FLAG-A16
    rule: INV-FLAG-EFFECT-OR-REJECT
    defect: "systemic — the guard that stops the sixteenth inert flag"
    severity: SYSTEMIC
    prediction: >-
      Reflection over the serialised form of every args struct finds no option
      field that is unreferenced by any dispatcher and not listed in an explicit
      REFUSED table.
    fixture: none
    command: |
      # cheap RED probe: does the scaling guard exist at all?
      cd /tmp/forjar-fix
      echo "guard defined: $(grep -rl 'every_declared_flag_is_consumed_or_refused' src/ 2>/dev/null | wc -l)"
      # GREEN check once it does (a name filter that matches nothing runs 0 tests
      # and still exits 0, which is why the existence probe above comes first):
      #   cargo test --lib every_declared_flag_is_consumed_or_refused
    red_output: |
      guard defined: 0
    can_go_red: >-
      This is the only test in the contract that scales, and it is currently RED
      in the strongest possible way: the guard does not exist, which is exactly
      how 15 inert flags shipped. Note the trap the probe is written around —
      `cargo test --lib <name>` with a filter matching nothing prints
      "0 passed; 0 failed" and EXITS 0, so wiring CI to the cargo command alone
      would reproduce this contract's own subject matter one level up: an
      invocation that is accepted and does nothing. The probe therefore asserts
      the guard's existence first. It goes GREEN when the reflection test lands
      and passes; it goes RED again the moment a new option field is added to an
      args struct without a dispatch site. The field set MUST be discovered by
      reflection over the serialised form, following the precedent of
      build-semantics-v1 FALSIFY-BUILD-203 — a hand-written list of flags to
      check has the same failure mode as the hand-written list of flags to
      consume.
    if_fails: >-
      Fifteen per-flag tests pass and the sixteenth inert flag ships anyway.
    owner: forjar

  - id: FALSIFY-FLAG-A17
    rule: INV-FLAG-EFFECT-CONFINED
    defect: yes-silently-disabled-the-blake3-state-integrity-gate
    severity: HIGH
    prediction: >-
      `apply --yes` over a lock file that does not match its `.b3` sidecar exits
      non-zero and executes no resource, and so does every other apply flag an
      operator might reach for (`--force`, `--no-tripwire`, `--force-unlock`,
      `--refresh`, `--dry-run`). The refusal names `forjar reseal`, and
      `forjar reseal --all` followed by a plain `apply --yes` converges — the
      escape the message names is exercised, not merely quoted.
    fixture: none    # tests/falsification_yes_is_not_an_integrity_override.rs
                     # builds its own tempdir sandbox and touches no real host
    command: |
      cargo test --test falsification_yes_is_not_an_integrity_override
      # equivalently, by hand:
      #   forjar apply --yes                        # converge, then
      #   printf '\n# tampered\n' >> state/<m>/state.lock.yaml
      #   forjar apply --yes ; echo "rc=$?"
    red_output: |
      localhost: 1 converged, 1 unchanged, 0 failed (0.6s)
      Apply complete: 1 converged, 1 unchanged.
      ERROR: integrity check failed for state/localhost/state.lock.yaml: expected 6e4c0ec5…, got 91c61de3…
      rc=0
    can_go_red: >-
      Confirmed RED on 1.16.0 on 2026-08-23: 2 of the 6 tests failed, the two
      that observe the apply itself. The in-binary control is
      `a_clean_state_dir_is_unaffected`: identical config, identical `--yes`,
      state NOT tampered — it converges and exits 0. So the difference is the
      tamper and not the flag, which distinguishes "the gate was bypassed" from
      "apply refuses everything now". The gate's own unit tests
      (`verify_state_integrity`, `has_errors`) were green throughout and always
      would be: the verdict was computed correctly and then discarded by an
      unrelated flag, which is why this had to be an end-to-end test.
    if_fails: >-
      Tamper detection is off for every unattended apply on the fleet — `--yes`
      is the only way past the confirmation prompt, so the population that
      cannot read a warning is exactly the population that has no gate.
    owner: forjar

  - id: FALSIFY-FLAG-A18
    rule: INV-FLAG-EFFECT-CONFINED
    defect: plan-file-skipped-the-entire-apply-preflight
    severity: HIGH
    prediction: >-
      `apply --plan-file p.json --yes` runs every gate an ordinary `apply --yes`
      runs, over a plan the ungated `forjar plan --out` produced from the SAME
      config: a corrupted `.b3` sidecar refuses with "state integrity check
      failed", a blocking `policies:` rule refuses, `policy.security_gate:
      critical` refuses BEFORE the secret is written, the declared
      `policy.pre_apply` hook runs, `--confirm-destructive` blocks the destroy
      and, without `--yes`, FJ-286 asks first.
    fixture: none    # tests/falsification_plan_file_runs_every_gate.rs builds
                     # its own tempdir sandbox; only `type: file` resources
    command: |
      cargo test --test falsification_plan_file_runs_every_gate
      # equivalently, by hand:
      #   forjar apply -f c.yaml --state-dir s --yes        # converge
      #   forjar plan -f c.yaml --state-dir s --out p.json  # after editing c.yaml
      #   printf 'deadbeef' > s/<m>/state.lock.yaml.b3      # sidecar ONLY
      #   forjar apply -f c.yaml --state-dir s --plan-file p.json --yes; echo "rc=$?"
    red_output: |
      Plan applied: 1 converged, 1 unchanged, 0 failed
      rc=0
    can_go_red: >-
      Measured RED on 1.24.0 and again on a debug build of f0cbf635: seven of the
      nine tests failed, and each named a different gate. The in-binary controls
      are `a_gate_free_plan_file_apply_still_applies` and
      `refresh_only_still_works_on_honest_state` — identical fixtures with no
      gate declared and no tamper — so the difference is the gate, not "plan-file
      refuses everything now". Only the `.b3` sidecar is corrupted, never the
      lock body, because `plan_seal::digest::state_leg` hashes the BODY: the
      seal still verifies, the plan loads, and the gate that would have caught
      the tamper simply never ran.
    if_fails: >-
      The documented two-stage plan/review/apply flow — the flow the feature
      exists for — runs with the policy engine, the security gate, the pre_apply
      hook, the destructive block, the confirmation prompt and state integrity
      all off, at exit 0.
    owner: forjar

  - id: FALSIFY-FLAG-A19
    rule: INV-FLAG-EFFECT-CONFINED
    defect: refresh-only-re-sealed-a-tampered-lock-and-laundered-the-gate
    severity: HIGH
    prediction: >-
      Over a tampered lock BODY the sequence `apply --yes` → `apply
      --refresh-only` → `apply --yes` refuses, refuses, refuses. The `.b3`
      sidecar is byte-identical before and after the refresh.
    fixture: none    # same sandbox as A18
    command: |
      cargo test --test falsification_plan_file_runs_every_gate \
        refresh_only_cannot_launder_a_tampered_lock
      # equivalently, by hand:
      #   sed -i 's/content_hash: /content_hash: X/' s/<m>/state.lock.yaml
      #   forjar apply --yes ; forjar apply --refresh-only ; forjar apply --yes
    red_output: |
      error: state integrity check failed — … No apply flag overrides this check.
      Refresh complete: 1 resources queried, 0 drifted      # .b3 7d869a9f… -> 9b96fcbd…
      Apply complete: 1 converged (1 repaired drift), 0 unchanged.
    can_go_red: >-
      Measured RED on 1.24.0. This is the half that makes the fix structural
      rather than a fourth one-off after #356, #358 and #370: `--refresh-only`
      takes the same `apply_mode_exits` early return `--plan-file` does and
      writes state through `state::save_lock` with no gate, so a fix confined to
      `cmd_apply_from_plan` would leave the same hole open one flag over.
    if_fails: >-
      The BLAKE3 gate whose own refusal text says "No apply flag overrides this
      check" is overridable by running a different apply mode first, and the
      re-seal destroys the only evidence the tamper happened.
    owner: forjar

  - id: FALSIFY-FLAG-A20
    rule: INV-FLAG-EFFECT-OR-REJECT
    defect: apply-check-ignored-every-scope-flag-but-machine-and-resource
    severity: HIGH
    prediction: >-
      `apply --check` under each of --subset, --exclude, -g and --skip checks
      only the selected resources and exits 0 when only an UNSELECTED resource
      is red, exactly as -m already did.
    fixture: FX-3FILE-SCOPE
    command: |
      cd "$G"; rm -rf state
      "$FORJAR" apply --yes > setup.out 2>&1   # converge a-file, b-file, c-file
      printf 'TAMPERED\n' > c.txt              # drift c-file only
      t(){ "$FORJAR" apply --yes --check "$@" >out 2>&1
           echo "[$*] rc=$? checked=[$(grep -oE '(ok|FAIL) [a-z]+-file' out | awk '{print $2}' | sort -u | tr '\n' ' ')]"; }
      t --subset a-file
      t --exclude c-file
      t -g web
      t --skip c-file
      t -m local              # in-binary control
    red_output: |
      [--subset a-file] rc=1 checked=[a-file b-file c-file ]
      [--exclude c-file] rc=1 checked=[a-file b-file c-file ]
      [-g web] rc=1 checked=[a-file b-file c-file ]
      [--skip c-file] rc=1 checked=[a-file b-file c-file ]
      [-m local] rc=0 checked=[a-file b-file ]
    can_go_red: >-
      Confirmed by the family measured 2026-08 and 2026-09-05 (#467):
      `dispatch_apply_b.rs` returned into `cmd_check` before `cmd_apply_scoped`
      ran, so `--check` saw only the four parameters that path already forwarded
      to `cmd_check` (file, machine, resource, tag) — `--subset`, `--exclude`,
      `-g` and `--skip` were not read at all. `-m` is the in-binary control:
      it went through unchanged and already restricts, which is why the last
      line is the only one that restricts pre-fix — the identical harness, same
      fixture, same drifted resource. GREEN is every line matching `-m`'s shape:
      `checked` excludes `c-file` and `rc=0`.
    if_fails: >-
      A scoped `--check` in CI reports the operator's own target as broken
      because something outside the scope they asked about is red, which is
      the exact defect #467 was filed from (`ok screen-sharing` followed by
      `error: 4 check(s) failed` on four resources nobody asked about).
    owner: forjar

  - id: FALSIFY-FLAG-A21
    rule: INV-FLAG-EFFECT-OR-REJECT
    defect: apply-dry-run-rendered-the-unscoped-plan-under-r-and-g
    severity: HIGH
    prediction: >-
      `apply --dry-run` under -r and -g lists only the selected resources,
      exactly as `plan -r`/`plan -g` already do over the same config.
    fixture: FX-3FILE-SCOPE
    command: |
      cd "$G"; rm -rf state
      t(){ "$FORJAR" apply --yes --dry-run "$@" >out 2>&1
           echo "[$*] rc=$? listed=[$(grep -oE '[a-z]+-file' out | sort -u | tr '\n' ' ')]"; }
      t -r a-file
      t -g web
      t                        # unscoped, for comparison — this one SHOULD list all three
      p(){ "$FORJAR" plan "$@" >out 2>&1
           echo "[plan $*] listed=[$(grep -oE '[a-z]+-file' out | sort -u | tr '\n' ' ')]"; }
      p -r a-file              # in-binary control
    red_output: |
      [-r a-file] rc=0 listed=[a-file b-file c-file ]
      [-g web] rc=0 listed=[a-file b-file c-file ]
      [] rc=0 listed=[a-file b-file c-file ]
      [plan -r a-file] listed=[a-file ]
    can_go_red: >-
      Confirmed RED on 1.24.0 and read unchanged on 1.25.2 (#466, measured
      against `paiml/infra`: `apply --dry-run -r stack-tool-forjar` printed all
      139 resources of a fleet manifest as "would execute"). `plan -r` on the
      identical config, through `plan_selector`, is the in-binary control and
      restricts correctly, which is what makes "the flag is unimplemented"
      unavailable as an explanation. GREEN is `-r a-file` and `-g web` matching
      `plan -r a-file`'s shape — a strict subset of the unscoped line, which
      stays `[a-file b-file c-file ]` because it asked for everything.
    if_fails: >-
      The one flag that exists to preview an apply's blast radius shows work
      the apply will not do, so an operator either aborts a correct scoped
      apply or learns to ignore the preview — the exact incident #466 was
      filed from.
    owner: forjar

enforcement:
  declared_surface_is_consumed:
    description: >-
      Every option field on every args struct has a dispatch site or an entry
      in an explicit REFUSED table.
    check: "cargo test --lib every_declared_flag_is_consumed_or_refused"
    severity: "ERROR"
    layer: ci
    failure_mode: test_failure
    ci_gate: required
    notes: |
      LEG 1 — the reflection guard (FALSIFY-FLAG-A16) is the only part of this
      contract that scales. It enumerates option fields by reflection over the
      serialised args structs and fails CI when one has no dispatch site and no
      REFUSED entry. Adding a flag to the REFUSED table is allowed and is the
      honest interim state: `--pairs` exiting 2 with "not implemented" is
      strictly better than `--pairs` exiting 0 and doing nothing.

  flag_behaviour_is_observed_in_the_world:
    description: >-
      Each of the 15 confirmed defects has a process-level test that reads a
      filesystem fact, a receiver log, a subprocess marker or an exit code.
    check: "contract_tests::FALSIFY-FLAG-A01..A15 (dogfood lane, release binary)"
    severity: "ERROR"
    layer: process
    failure_mode: test_failure
    ci_gate: required
    notes: |
      LEG 2 — these tests fork the binary and write only to a sandbox under
      /tmp/forjar-dogfood. They cannot live in `cargo test --lib` unchanged:
      `std::env::set_current_dir` is disallowed in this repo as process-global
      and flaky, so each must be ported as an integration test that passes an
      explicit working directory rather than mutating the process's. Until then
      they run as the dogfood lane against the release binary.

      ASSERT ON THE WORLD, NOT ON THE TEXT. Asserting that stdout contains
      "Apply complete" is what let this family survive: all fifteen defects
      print a correct-looking success message. Same lesson build-semantics-v1
      records for `forjar check`, where `script.contains(...)` assertions stayed
      green for five months over an unfailable check script.

  safety_gates_are_not_lifted_by_unrelated_flags:
    description: >-
      No flag relaxes a gate its own help text does not name. `--yes` must not
      appear in any gate predicate other than the confirmation prompt itself.
      Where a refusal names a recovery command, that recovery is tested.
    check: "cargo test --test falsification_yes_is_not_an_integrity_override"
    severity: "ERROR"
    layer: process
    failure_mode: test_failure
    ci_gate: required
    notes: |
      The review question this makes routine: for each boolean in a gate's
      condition, does its `--help` text mention this gate? `!yes` in
      `has_errors(&issues) && !yes` failed that question for two releases while
      reading as ordinary CI ergonomics.

      Renaming the override is the tempting half-fix and is not sufficient on
      its own. Prefer removing it where an existing command already expresses
      the operator's intent more precisely — here `forjar reseal`, which says
      "these contents are good" rather than "ignore the question".

  every_finding_carries_an_in_binary_control:
    description: >-
      Each falsification test exercises a working sibling in the same process,
      fixture and command line wherever one exists.
    check: "review gate on falsification_tests[].can_go_red"
    severity: "ERROR"
    layer: review
    failure_mode: review_rejection
    ci_gate: required
    notes: |
      Without the control, "the webhook did not arrive" is indistinguishable
      from "the receiver is down" and the finding is dismissible. The controls
      in this contract are: --subset/-r/-m for A01; --notify-slack and
      --notify-webhook hitting the same receiver for A03/A04/A05; plain `apply`
      under the same PTY for A06; `plan --why` for A07; localhost import for
      A13; the `tag` filter in the same MCP handler for A14; mis2.yaml plus
      forjar's own LSP plus PyYAML for A15.

  red_before_green:
    description: >-
      A test that is green against BOTH forjar 1.12.3 and the fixed binary is
      rejected as unfalsifiable.
    check: "run falsification_tests[].command with FORJAR=/home/noah/.cargo/bin/forjar"
    severity: "ERROR"
    layer: review
    failure_mode: review_rejection
    ci_gate: required
    notes: |
      Each test records its exact red_output against the published binary. A
      test that cannot reproduce it is not evidence of a fix; it is evidence of
      a test that cannot fail — which is the defect class this whole contract
      exists to catch, reappearing one level up.

known_gaps:
  - id: GAP-EXISTENTIAL-QUANTIFIER
    statement: >-
      The core equation is existential — a flag has an effect if SOME input
      distinguishes it. No test can search that space exhaustively, so each
      falsification test uses the witness set the flag's own help text implies.
      A flag that only takes effect on some input nobody thought to try will
      still be reported inert. That is the correct bias: if the documented
      scenario does not exercise the flag, the documentation is wrong too.

  - id: GAP-REFUSAL-IS-A-VALID-FIX
    statement: >-
      This contract does NOT require any flag to be implemented. Refusing
      `--skip` with a non-zero exit satisfies it exactly as well as making
      `--skip` work, and is a one-line change. The contract is about honesty of
      the CLI surface, not feature completeness. Removing the flag from `--help`
      also satisfies it.

  - id: GAP-REFLECTION-CANNOT-JUDGE-CORRECTNESS
    statement: >-
      FALSIFY-FLAG-A16 proves a field is READ somewhere. It cannot prove it is
      read correctly, at the right point, or by the right dispatcher — it would
      not have caught the MCP count mismatch (A14), where the filter IS consumed
      but after the summary was computed. Reflection is the scaling guard;
      per-flag behavioural tests remain necessary for semantics.

  - id: GAP-HELP-TEXT-IS-NOT-MACHINE-READABLE
    statement: >-
      Sibling parity (INV-SIBLING-PARITY) is stated over "flags documented as
      variants of one capability", which no tool can currently derive. It is
      enforced by the hand-maintained variant groups listed in the
      sibling_parity equation. A future `variant_of = "notify_webhook"` attribute
      on the args struct would make the grouping machine-checkable and is the
      right eventual fix.

  - id: GAP-SUBCOMMAND-SCOPE
    statement: >-
      A01..A15 cover the fifteen defects confirmed in issue #211. They are a
      sample of the surface, not a proof over it: `--approval-required`,
      `--require-approval` and `--approval-timeout` sit next to the proven-inert
      `--approval-webhook` and were never exercised. Only FALSIFY-FLAG-A16
      quantifies over the whole surface, which is why it is the only test whose
      absence is itself recorded as RED.

qa_gate:
  id: F-FLAG-A01
  name: "Flag Has Effect Contract (family A, issue #211)"
  description: >-
    Gates the honesty of forjar's declared surface: every flag in --help either
    changes the observable trace or is refused, gates can deny, sinks receive,
    metadata is retrievable, enum flags validate their domain, and a filter's
    effect reaches every value derived from it.
  checks:
    - "INV-FLAG-EFFECT-OR-REJECT"
    - "INV-FLAG-EFFECT-CONFINED"
    - "INV-SIBLING-PARITY"
    - "INV-GATE-FAILS-CLOSED"
    - "INV-SINK-FLAGS-PRODUCE-ARTIFACTS"
    - "INV-HEADER-FLAGS-REACH-THE-WIRE"
    - "INV-METADATA-FLAGS-ARE-RETRIEVABLE"
    - "INV-ENUM-FLAGS-VALIDATE-THEIR-DOMAIN"
    - "INV-EFFECT-COMPLETENESS"
    - "INV-REACHABLE-RENDERER-MUST-BE-REACHED"
    - "INV-DECLARED-OPERATION-HAPPENS"
  pass_criteria: >-
    All 17 falsification tests pass against the fixed binary, AND each still
    reproduces its recorded red_output against the binary it was measured on
    (1.12.3 for A01–A16, 1.16.0 for A17). A test that is green against BOTH
    binaries is not evidence of a fix, it is evidence of a test that cannot
    fail — reject it.
  falsification: >-
    Delete the dispatch site for --subset and A01's control lines stop
    restricting; move the MCP resource filter back after the summariser and A14
    returns to `"to_create":2 changes=1`; delete the reflection guard and A16
    returns to RED by absence; restore `&& !yes` to the state-integrity
    predicate and A17 returns to a converged, rc=0 apply over a tampered lock.

verification_level: L2
