[package]
name = "forjar"
version = "1.23.0"
edition.workspace = true
rust-version = "1.89.0"
authors = ["Pragmatic AI Labs"]
description = "Rust-native Infrastructure as Code — bare-metal first, BLAKE3 state, provenance tracing"
license.workspace = true
repository.workspace = true
homepage = "https://paiml.com"
keywords = ["iac", "infrastructure", "devops", "provisioning", "bare-metal"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["benches/", ".pmat/", ".pmat-work/", ".claude/", "/state/", "docs/", "examples/", "target/", "*.profraw", "*.profdata", ".vscode/", ".idea/", "proptest-regressions/"]

[workspace]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/paiml/forjar"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(kani)', 'cfg(verus)'] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
checked_conversions = "warn"
undocumented_unsafe_blocks = "deny"

[lints]
workspace = true

# Every interface this release ships, declared where it is versioned with the
# code that implements it. The pre-release protocol runs each e2e target BY NAME
# (`cargo test --test <target>`), which turns "that target does not exist" or
# "its features are not enabled" into a hard error instead of a bare `cargo test`
# exiting 0 without mentioning it.
#
# forjar ships exactly two interfaces:
#   cli — 159 subcommands, all advertised in `--help`
#   mcp — `forjar mcp`, stdio JSON-RPC, one tool per `verb::verbs()` row
#
# There is NO http/serve surface. `core::webhook_server` exists but is not
# reachable from any subcommand, so it is not an interface this release ships;
# the protocol's transport-absence gate asserts the binary advertises nothing
# beyond what is declared here.
#
# Both targets spawn CARGO_BIN_EXE_forjar. That is load-bearing: an e2e suite
# that calls the library cannot see reachability, and rmedia's four-way parity
# suite was green throughout the period its transports had no caller from
# main.rs.
[package.metadata.transports]
cli = { e2e = "dogfood_p4_cli" }
mcp = { e2e = "e2e_mcp_stdio_t" }
# Each key names the e2e that proves the transport is REACHABLE from the shipped
# binary — not that it exists in the source. e2e_verb_http_t spawns
# CARGO_BIN_EXE_forjar and talks to it over a real socket.
http = { e2e = "e2e_verb_http_t" }

# How the dogfood protocol asks THIS binary about its own surface, so the
# transport-invariance gate is DERIVED rather than a hand-written probe list.
# `list` must print one verb name per line; {verb} and {params} are substituted.
[package.metadata.unified_surface]
list = "verb list"
cli = "verb call {verb} --json {params}"
http = { serve = "verb serve --port {port}", path = "/v1/verbs/{verb}" }
# A verb that is safe to invoke repeatedly and has no side effects.
probe = { verb = "validate", params = "{\"path\":\"forjar.yaml\"}" }

[dependencies]
blake3 = "1.8"
# Rolling delta engine — forjar computes the delta locally via copia; the receiver
# reports a copia Signature computed with od+awk+b3sum (no staged binary). Exact-pin.
copia = "=0.2.0"
serde.workspace = true
serde_yaml_ng = "0.10"
serde_json.workspace = true
clap = { version = "4", features = ["derive"], optional = true }
indexmap = { version = "2.7", features = ["serde"] }
aprender-contracts-macros = "0.31"
base64 = "0.22.1"
bashrs = "6.68.0"
pforge-runtime = { version = "0.1.4", optional = true }
pforge-config = { version = "0.1.4", optional = true }
tokio = { version = "1.35", features = ["rt-multi-thread", "macros"], optional = true }
async-trait = { version = "0.1", optional = true }
schemars = { version = "0.8", features = ["derive"], optional = true }
regex = "1"
glob = "0.3"
rustc-hash = "2"
age = { version = "0.11", default-features = false, optional = true }
wasmi = { version = "0.40", optional = true }
clap_complete = { version = "4", optional = true }
zip = { version = "2", default-features = false, features = ["deflate", "bzip2", "zstd"] }
bzip2 = "0.6"
zstd = "0.13"
tar = "0.4"
sha2 = "0.10"
# HMAC-SHA256 for webhook request authentication (FJ-3104). One pure-Rust crate:
# sha2 is already a direct dep above, and hmac/digest/subtle were already in
# Cargo.lock transitively, so this adds no new transitive dependencies.
hmac = "0.12"
flate2 = "1"
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
dhat = { version = "0.3.3", optional = true }
toml = "1.1"
# OpenSSL: system pkg-config by default, vendored for cross-compilation.
# Clean-room CI has libssl-dev; nightly/release builds use vendored-openssl feature.
openssl = { version = "0.10", optional = true }
# GH-228: the OCI registry transport (HEAD/POST/PUT/PATCH against /v2/).
# ureq, not reqwest: `src/core` contains zero `async fn`, while the MCP path runs
# a live tokio runtime. `reqwest::blocking` panics when called from inside an
# async context, so a blocking wrapper around an async client is a latent panic
# on the one code path this crate actually has a runtime on. ureq is synchronous
# and spins no runtime of its own.
# `platform-verifier` is load-bearing, not decoration: curl validated TLS against
# the OS trust store, and ureq's default `RootCerts::WebPki` is a bundled Mozilla
# root set — without this feature a push to a registry fronted by a corporate or
# private CA would start failing on a host where it worked before.
ureq = { version = "3.4", features = ["platform-verifier"] }

[build-dependencies]
aprender-contracts = "0.31"
serde = { version = "1.0", features = ["derive"] }
serde_yaml_ng = "0.10"

[dev-dependencies]
aprender-contracts = "0.31"
tempfile.workspace = true
criterion = { version = "0.8", features = ["html_reports"] }
proptest = "1"
dhat = "0.3.3"

[[bench]]
name = "core_bench"
harness = false

[[bench]]
name = "store_bench"
harness = false

[[bench]]
name = "copia_bench"
harness = false

[[bench]]
name = "cli_bench"
harness = false

[[bench]]
name = "memory_bench"
harness = true

# Explicit so `--no-default-features` yields a LIBRARY. Without this section the
# binary is auto-discovered from src/main.rs, which hard-uses `clap::Parser` and
# `forjar::cli::Commands`, and cargo would try to build it with `cli` off.
[[bin]]
name = "forjar"
path = "src/main.rs"
required-features = ["cli"]

[features]
# The shipped product. `forjar` the binary IS `default`; a consumer who wants
# only the library writes `default-features = false` and gets `api`, `core`,
# `copia`, `resources`, `transport` and `tripwire` with none of clap, pforge,
# tokio, rusqlite or openssl. Before GH-237 there was no `default` key at all,
# so `default-features = false` subtracted the empty set and removed nothing.
default = ["cli"]

# The binary and both server surfaces. ONE feature, not three: src/mcp/handlers.rs
# calls crate::cli at three sites (strip_unrequested_phony_for_mcp, and
# graph_core::{GraphFormat, parse_graph_format} twice) and src/cli/infra.rs calls
# crate::mcp::{serve, export_schema} back, and Cargo rejects cyclic feature
# definitions. Splitting `mcp` out first requires moving graph_core and
# strip_unrequested_phony_for_mcp into core. Tracked separately.
cli = [
  "dep:clap",
  "dep:clap_complete",
  "dep:pforge-runtime",
  "dep:pforge-config",
  "dep:tokio",
  "dep:async-trait",
  "dep:schemars",
  "db",
  "tls",
]
# SQLite-backed state store: src/core/store/{db,query,ingest}.rs.
db = ["dep:rusqlite"]
# Direct openssl. This crate has no `openssl::` call site — the dependency
# exists so `vendored-openssl` can reach openssl-sys through the
# reqwest -> native-tls chain and vendor it for cross-compiled targets.
tls = ["dep:openssl"]

# NOT severable in this change, recorded so the next reader does not retry it:
#   bashrs  — backs invariant I8 ("no raw shell execution; all shell is
#             bashrs-purified"). Gating it means shipping a build that executes
#             unpurified shell, which is a correctness regression wearing a
#             packaging win as a hat.
#   zip/bzip2/zstd/tar/flate2 — cascade through store::{conda,far,layer_builder,
#             chunker,sandbox_exec} into six more store modules and into
#             benches/store_bench.rs. A separate cut with its own test surface.

encryption = ["dep:age"]
wasm-runtime = ["dep:wasmi"]
container-test = []
gpu-container-test = []
dhat-heap = ["dep:dhat"]
# `openssl/vendored` alone would already force the now-optional dep on; naming
# `tls` as well makes that intent readable. The release lanes
# (binary-release.yml, release.yml, nightly.yml) build with
# `--features vendored-openssl` and NO `--no-default-features`, so this must
# keep resolving to the openssl dependency or every cross-compiled artifact
# fails at tag time.
vendored-openssl = ["tls", "openssl/vendored"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--generate-link-to-definition"]

[package.metadata.binstall]
pkg-url = "https://github.com/paiml/forjar/releases/download/v{ version }/forjar-{ version }-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "https://github.com/paiml/forjar/releases/download/v{ version }/forjar-{ version }-x86_64-unknown-linux-gnu.tar.gz"

[package.metadata.binstall.overrides.x86_64-unknown-linux-musl]
pkg-url = "https://github.com/paiml/forjar/releases/download/v{ version }/forjar-{ version }-x86_64-unknown-linux-musl.tar.gz"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "https://github.com/paiml/forjar/releases/download/v{ version }/forjar-{ version }-aarch64-unknown-linux-gnu.tar.gz"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "https://github.com/paiml/forjar/releases/download/v{ version }/forjar-{ version }-aarch64-apple-darwin.tar.gz"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "https://github.com/paiml/forjar/releases/download/v{ version }/forjar-{ version }-x86_64-apple-darwin.tar.gz"

[package.metadata.release]
shared-version = true
pre-release-replacements = [
  { file = "CHANGELOG.md", search = "Unreleased", replace = "{{version}}" },
]

[profile.dev]
panic = "abort"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
