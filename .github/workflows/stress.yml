# Stress testing — extended test runs with randomized scheduling
# Catches race conditions and intermittent failures

name: Stress Tests

on:
  schedule:
    - cron: '0 4 * * 1'  # Weekly Monday 4am UTC
  workflow_dispatch:

concurrency:
  group: stress-${{ github.sha }}
  cancel-in-progress: true

jobs:
  stress:
    # forjar#598 -- PINNED TO BARE METAL (interim, named coupling). This job
    # runs UNFILTERED lib tests, which include nas_archive's
    # the_environment_can_exercise_the_safety_property -- a test that FAILS
    # rather than skips when rsync is absent (#289). rsync is absent from the
    # yoga-build* containers that `[self-hosted, clean-room, X64]` also
    # matches, so without `intel` this job is a per-run lottery. `intel` is a
    # hostname standing in for a capability; remove it with the others when a
    # capability label exists or yoga's images converge (paiml/infra#813).
    runs-on: [self-hosted, clean-room, X64, intel]
    # infra#430: sixteen clean-room runners share one ~/.cargo, and an hourly
    # reaper deletes registry/src entries by mtime -- under a live build, which
    # makes rustc read a source file that has just vanished:
    #   couldn't read .../registry/src/.../<crate>/src/<file>.rs: No such file
    #   error: could not parse/generate dep info at: .../deps/<crate>.d
    # MEASURED on this branch: msrv and coverage both died that way the first
    # time PMAT-547 moved them off GitHub-hosted runners, where each job had a
    # private ~/.cargo by construction. A registry private to this runner takes
    # the job off the shared surface. The path is outside the workspace, so it
    # survives the checkout clean and is a cache rather than a cold download.
    # The host-side fix is paiml/infra's.
    env:
      CARGO_HOME: ${{ github.workspace }}/../cargo-home-${{ github.job }}
    # #673: a red leg must mean a test failed IN THAT LEG. With the default
    # fail-fast, one leg's timeout cancelled the other two before a runner was
    # assigned, so no run ever yielded evidence from more than one leg.
    strategy:
      fail-fast: false
      matrix:
        iteration: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: stress-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      # #673: the loop is SIZED TO THE TIMEOUT. It was 10 passes in 30 minutes;
      # one single-threaded pass measured 373-516 s on intel-clean-room-13
      # (run 37300806114), so a leg finished 3 and timed out every week —
      # a lane that cannot go green whatever the suite does. 3 legs x 3 passes
      # is still 9 full single-threaded passes a week.
      # tests/falsification_673_stress_fits_its_timeout.rs holds
      # STRESS_PASSES x 9 min + 10 min build <= timeout-minutes.
      - name: Stress test iteration ${{ matrix.iteration }}
        env:
          STRESS_PASSES: 3
        run: |
          for run in $(seq 1 "$STRESS_PASSES"); do
            echo "=== Run $run/$STRESS_PASSES ==="
            cargo test --lib -- --test-threads=1
          done
        timeout-minutes: 45
