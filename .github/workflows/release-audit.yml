# Read the published release objects BACK and assert each describes itself.
#
# #325. v1.18.0 shipped with four `forjar-1.17.0-*.tar.gz` assets attached to it
# and a SHA256SUMS carrying 10 lines for 6 archives. It was repaired by hand, and
# the same defect then reached v1.19.0, v1.20.0 and v1.20.1 unnoticed — because
# nothing in this repo has ever read a finished release object. nightly.yml's
# "Tag/release parity check" asserts only that every `v*` tag HAS a release,
# never that the release is a description of ITSELF.
#
# Two producers (release.yml and binary-release.yml) upload to one object, and
# nothing orders them against each other. #324 and the guard now in
# binary-release.yml's `checksums` job close the two known ways contamination
# gets in. This lane is what notices the third.
#
# NOT PUT IN nightly.yml on purpose: that file's header says it is generated by
# machines/clean-room/deploy-workflows.sh, a generator that does not live in this
# repo, so an edit there is overwritten on the next deploy.
name: Release Audit

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-audit
  cancel-in-progress: false

jobs:
  audit:
    name: every release describes itself
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # the tag list is the work list

      - name: Audit every published release object
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORJAR_AUDIT_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          fail=0
          for t in $(git tag -l 'v*' | sort -V); do
            # A release with no assets at all is not a contaminated description
            # of itself, it is a release that shipped no binaries — v1.0.0, which
            # predates the binary pipeline. Whether a tag has a release at all is
            # nightly.yml's parity check, not this one's, so say so and move on
            # rather than pinning this lane permanently red on history.
            n=$(gh api "repos/$FORJAR_AUDIT_REPO/releases/tags/$t" \
                  --jq '.assets | length' 2>/dev/null || echo 0)
            if [ "$n" = "0" ]; then
              echo "skip: $t has no assets"
              continue
            fi
            echo "--- $t"
            bash scripts/release-object-audit.sh check "$t" || fail=1
          done
          if [ "$fail" != "0" ]; then
            echo "::error::at least one published release object is not a description of itself (#325)"
          fi
          exit "$fail"
