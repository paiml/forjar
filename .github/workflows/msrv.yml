# Minimum Supported Rust Version verification
# Ensures the crate compiles on the declared rust-version from Cargo.toml

name: MSRV Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: msrv-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  msrv:
    runs-on: [self-hosted, clean-room, X64]
    # infra#430: sixteen clean-room runners share one ~/.cargo, and an hourly
    # reaper deletes registry/src entries by mtime -- under a live build, which
    # makes rustc read a source file that has just vanished. MEASURED on this
    # branch: this job died that way the first time PMAT-547 moved it off a
    # GitHub-hosted runner, where it had a private ~/.cargo by construction.
    env:
      CARGO_HOME: ${{ github.workspace }}/../cargo-home-${{ github.job }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install MSRV toolchain
        # rust: 1.89.0 (bumped from 1.88 — aprender-contracts 0.30 requires 1.89)
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          rustup override set 1.89.0

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: msrv-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Verify MSRV compiles
        run: cargo check --all-targets
