# Lint and clippy checks across platforms
# Ensures code quality on ubuntu, windows, and macos

name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: lint-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  clippy:
    strategy:
      matrix:
        # PMAT-547: the Linux leg names the fleet, not a GitHub-hosted label.
        # Spelled as `include:` rather than a nested list under `os:` so the
        # runner of each leg is one unambiguous value a reader can check.
        #
        # Windows excluded: openssl-sys vendored build requires Perl/NASM
        # which is unreliable on GH runners. Sovereign-ci handles lint on Linux.
        #
        # macos-latest is the ONE runner this file still asks GitHub for, and
        # it is here because `gh api orgs/paiml/actions/runners` reports 25
        # runners and every one of them is Linux. It cannot move until the
        # fleet has a mac.
        include:
          - runner: [self-hosted, clean-room, X64]
            features: ""
          - runner: [self-hosted, clean-room, X64]
            features: encryption
          - runner: macos-latest
            features: ""
          - runner: macos-latest
            features: encryption
    runs-on: ${{ matrix.runner }}
    # infra#430, as on the fleet jobs above: the clean-room runners share one
    # ~/.cargo and an hourly reaper deletes registry/src under live builds. The
    # macOS/Windows legs of this matrix get a private registry too, which costs
    # them nothing -- a hosted runner's registry is cold every time anyway.
    env:
      CARGO_HOME: ${{ github.workspace }}/../cargo-home-${{ github.job }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          # forjar#567: A RUSTUP *DIRECTORY OVERRIDE* OUTRANKS rust-toolchain.toml.
          #
          # This file pins 1.93.0 with `components = ["rustfmt", "clippy"]`, and
          # on a runner that honours it clippy is present because the pin brings
          # it. Measured on main @ 07f6d122, two different runners, same commit:
          #
          #   /home/noah/eph-build2/...      1.93.0 "overridden by rust-toolchain.toml"   PASS
          #   /home/noah/data/actions-runner-7/...  1.89.0 "directory override for ..."   FAIL
          #
          # Both toolchains were installed on the failing runner; only 1.93.0
          # carries clippy, so the job died with "'cargo-clippy' is not installed
          # for the toolchain '1.89.0-x86_64-unknown-linux-gnu'".
          #
          # The override is PERSISTENT STATE on the runner's workspace directory,
          # set by something outside this repository and surviving every job. That
          # is the thing a clean room is supposed not to have, and it made lint red
          # on main for six consecutive runs while the identical tree was green on
          # a PR -- which reads as "main is broken and the PR fixed it" and is not
          # true of either.
          #
          # `rustup override unset` removes the override for THIS directory and
          # exits 0 when there is none to remove (measured), so it needs no
          # `|| true` -- which this repository forbids on anything that measures.
          rustup override unset
          rustup show

          # AND THEN MEASURE THE PROPERTY -- DO NOT PARSE FOR IT.
          #
          # An earlier draft of this step compared the active toolchain's version
          # against the `channel` in rust-toolchain.toml. THREE REVIEW LANES
          # REFUTED IT INDEPENDENTLY, and they were right: that comparison is
          # correct only for the one channel spelling in use today.
          #
          #   channel = "stable"        want=stable      got=1.93.0   false FAIL
          #   nightly-2026-01-01-...    got=nightly                   false FAIL
          #   1.93.0-beta.1             got=1.93.0                    false PASS
          #
          # `cut -d- -f1` cannot tell a version's hyphens from a target triple's.
          # What this job actually needs is not a matching string -- it is a
          # RUNNABLE CLIPPY, which is one command to ask for directly. Asking
          # the question we mean removes the whole class of parsing bug.
          if ! cargo clippy --version; then
            active="$(rustup show active-toolchain)" || active="UNKNOWN -- rustup could not name one"
            echo "::error::ENVIRONMENT, not lint: cargo clippy is not runnable on this runner. Active toolchain: ${active}. rust-toolchain.toml pins a channel with clippy in its components, so a runner honouring the pin has clippy; this one is not honouring it, and the cause is outside anything this workflow can reach (a rustup override on a PARENT directory, which `rustup override unset` above does not remove, or RUSTUP_TOOLCHAIN in the runner service environment). Nothing about the code under review has been measured -- this is not a lint result."
            exit 1
          fi

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: lint-${{ runner.os }}-${{ matrix.features }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Clippy
        shell: bash
        run: |
          if [ -n "${{ matrix.features }}" ]; then
            cargo clippy --all-targets --features ${{ matrix.features }} -- -D warnings
          else
            cargo clippy --all-targets -- -D warnings
          fi

      - name: Rustfmt
        run: cargo fmt --all -- --check

  # CB-040 max-lines, enforced where it can actually block a merge.
  #
  # This rule lived ONLY in .git/hooks/pre-commit, which is local, opt-in and
  # `--no-verify`-able. PR #397 landed src/resources/task.rs at 530 lines on
  # main and every CI lane stayed green, because no lane looked. A quality gate
  # one `--no-verify` away from off is not a gate.
  #
  # Same ratchet as the hook, deliberately: a file only fails if it GREW in this
  # PR *and* is now over 500. A pre-existing over-limit file (the declarative
  # clap structs CLAUDE.md exempts) is untouched until someone grows it.
  file-health:
    runs-on: [self-hosted, clean-room, X64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Max-lines ratchet on changed .rs files
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          # WHICH BASE. Both obvious answers are wrong, so neither is used.
          #
          # `pull_request.base.sha` is main's tip when the WEBHOOK fired. If main
          # advances before checkout, HEAD (the synthetic refs/pull/N/merge) also
          # contains main's newer commits, and diffing against base.sha bills this
          # PR for another PR's growth. That merge commit's FIRST PARENT is the
          # base tip it was actually built on -- the honest fork point.
          #
          # For a push, `HEAD~1` only covers the LAST commit: push five at once and
          # a 1000-line file smuggled in by the first is invisible. `event.before`
          # is the tip the push actually moved from.
          if [ -n "${PR_BASE:-}" ]; then
            BASE=$(git rev-parse 'HEAD^1' 2>/dev/null || echo "$PR_BASE")
          else
            BASE="${PUSH_BEFORE:-}"
          fi
          if ! git rev-parse --verify "$BASE^{commit}" >/dev/null 2>&1; then
            # First push of a branch hands us all-zeros; fall back rather than die.
            BASE=$(git rev-parse 'HEAD~1' 2>/dev/null || git rev-list --max-parents=0 HEAD | tail -1)
          fi
          echo "Comparing against $BASE"

          failed=0
          check() {   # check <path-now> <path-at-base>
            local f="$1" old="$2" now before
            [ -f "$f" ] || return 0
            now=$(wc -l < "$f")
            # NOT `before=$(git cat-file -p ... | wc -l)`. Under `set -euo pipefail`
            # an absent path makes git exit 128, pipefail propagates, and the
            # ASSIGNMENT trips `set -e`: the job dies 128 on the first new .rs file
            # instead of checking it. Ask whether the blob exists first.
            if [ -n "$old" ] && git cat-file -e "$BASE:$old" 2>/dev/null; then
              before=$(git cat-file -p "$BASE:$old" | wc -l)
            else
              before=0   # new file: the hook's "hard block over 500" rule
            fi
            if [ "$now" -gt 500 ] && [ "$now" -gt "$before" ]; then
              echo "::error file=$f::exceeds the 500-line limit ($before -> $now). Split it: pmat split $f"
              failed=1
            elif [ "$now" -gt 400 ] && [ "$now" -gt "$before" ]; then
              echo "::warning file=$f::approaching the 500-line limit ($now lines)"
            fi
          }

          # -z, and --name-status with -M, for two reasons:
          #   * git QUOTES a path containing a space in its default output, so
          #     `[ -f "$f" ]` looks for a name with literal quotes, finds nothing,
          #     and skips the file silently. NUL-delimited output is never quoted.
          #   * a plain ACM filter drops R entirely, so renaming a 500-line file
          #     and adding 100 more to it in the same PR sails through. R is
          #     included, and the OLD path is what its `before` count must read --
          #     measuring the new path would report 0 and block every rename.
          while IFS= read -r -d '' status; do
            case "$status" in
              R*) IFS= read -r -d '' old; IFS= read -r -d '' new; check "$new" "$old" ;;
              C*) IFS= read -r -d '' _src; IFS= read -r -d '' new; check "$new" "" ;;
              A)  IFS= read -r -d '' new; check "$new" "" ;;
              *)  IFS= read -r -d '' new; check "$new" "$new" ;;
            esac
          # Refs #423: the vendored contract crates are upstream's sources carried
          # byte-for-byte (see crates/*/VENDORED.md); splitting them would break
          # the byte-faithfulness the vendoring receipt asserts. They are not new
          # code this repository wrote, so the ratchet does not bill them.
          done < <(git diff -z -M --name-status --diff-filter=ACMR "$BASE" HEAD -- '*.rs' \
                     ':!crates/forjar-contracts/**' ':!crates/forjar-contracts-macros/**')

          if [ "$failed" -ne 0 ]; then
            echo "File health check failed."
            exit 1
          fi
          echo "File health OK."
