# Quorum gate — mirrors the pre-push check on every PR.
#
# The local hook is FAST FEEDBACK, not enforcement: `.git/hooks/` is untracked,
# `git push --no-verify` always works, and a contributor who never ran
# `make install-hooks` is never gated. This job is the half that can actually
# enforce, and it only does so once `main` has branch protection requiring it —
# see docs/specifications/quorum-spec.md, "A local hook enforces nothing on its own".
name: Quorum

on:
  pull_request:
    types: [opened, reopened, synchronize]

# Cancel a superseded run, matching ci.yml / bench.yml / behavior.yml.
#
# Without this, every push to a PR leaves the previous quorum job running against
# a diff that no longer exists -- and because the gate's whole job is to reject a
# receipt whose diff moved, those stale runs fail LOUDLY and correctly. A red X
# from a run that was already obsolete is exactly how a gate gets reclassified as
# noise and then ignored.
concurrency:
  group: quorum-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  receipt:
    name: quorum receipt
    runs-on: [self-hosted, clean-room, ARM64]
    # A CARGO_HOME private to this job, matching behavior.yml, convergence.yml,
    # mutation.yml and binary-release.yml. This was the one self-hosted workflow
    # in the repo still on the SHARED /home/noah/.cargo, and the rust-cache step
    # below is what makes that matter: its save step runs `cleanRegistry`
    # unconditionally and deletes ${CARGO_HOME}/registry/src -- the extracted
    # crate sources every OTHER job on the box is compiling from at that moment.
    # `cache-bin: "false"`, the paiml/infra#208 mitigation, does not prevent it;
    # it skips `cleanBin` alone. Measured on intel 2026-09-19 (paiml/infra#775):
    # eight save steps in 100 minutes, every crate directory's birth time pinned
    # to the second one of them finished, and an infra `cargo kani` build killed
    # mid-crate with `could not parse/generate dep info ... No such file or
    # directory`.
    #
    # A private CARGO_HOME is the ONLY exoneration, because it is the only thing
    # that moves the SOURCES: `--target-dir`, `cargo install --root` and a fresh
    # $HOME leave cargo reading from the shared registry whatever else the job
    # owns. The path is outside the workspace, so it survives the checkout clean
    # and is a cache rather than a cold download -- the same reasoning the
    # sibling workflows already record.
    env:
      CARGO_HOME: ${{ github.workspace }}/../cargo-home-${{ github.job }}
    steps:
      - uses: actions/checkout@v4
        with:
          # THE PUSHED HEAD, NOT THE PR MERGE COMMIT.
          #
          # `actions/checkout` defaults on `pull_request` to a synthetic merge of
          # (PR head + base tip). Its merge-base with main is therefore the MAIN
          # TIP, not the commit the branch actually forked from -- so the gate
          # read base_commit=<main tip> and rejected an honest receipt that said
          # <fork point>. Observed: local merge-base 20398b99, CI ebd44028, on a
          # receipt that was correct. Checking out the real head makes CI verify
          # exactly the bytes the developer pushed, which is the whole point.
          ref: ${{ github.event.pull_request.head.sha }}
          # The gate diffs against the merge-base with origin/main, so it needs
          # real history. A shallow clone makes `git merge-base` fail, which the
          # gate correctly treats as UNMEASURED -> exit 1 rather than a pass.
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch origin ${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }} || git fetch origin main

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Fetch gate from the PR base commit
        # JUDGE FROM BASE: the gate, its allowlist and its allowed signers come from the PR BASE commit, never
        # the PR's own copy, so a PR cannot weaken the judge that reads it. Fails closed if
        # the base lacks either file.
        # BOOTSTRAP (PMAT-5882): while the PR base has no gate, the one PR that introduces it
        # is judged by its own copy, loudly, so the merge that lands the gate can be green.
        # That is self-limiting: once the gate is on main every later PR has a base copy and
        # takes the first branch. A base that HAS the gate never falls back, and a base copy
        # that fails is a RED, not a fallback.
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          d="$RUNNER_TEMP/quorum-base-gate"
          rm -rf "${d:?}"; mkdir -p "$d/scripts"
          if git cat-file -e "$PR_BASE_SHA:scripts/quorum-store-gate.sh" 2>/dev/null; then
            git show "$PR_BASE_SHA:scripts/quorum-store-gate.sh" > "$d/scripts/quorum-store-gate.sh" \
              || { echo "FAIL: cannot read scripts/quorum-store-gate.sh from PR base" >&2; exit 1; }
            git show "$PR_BASE_SHA:scripts/quorum-models.json" > "$d/scripts/quorum-models.json" \
              || { echo "FAIL: scripts/quorum-models.json absent on PR base" >&2; exit 1; }
            git show "$PR_BASE_SHA:scripts/quorum-allowed-signers" > "$d/scripts/quorum-allowed-signers" \
              || { echo "FAIL: scripts/quorum-allowed-signers absent on PR base" >&2; exit 1; }
          else
            echo "BOOTSTRAP: base $PR_BASE_SHA has no quorum-store-gate.sh; judging with this PR's copy"
            cp scripts/quorum-store-gate.sh scripts/quorum-models.json scripts/quorum-allowed-signers "$d/scripts/"
          fi
          echo "QUORUM_BASE_GATE=$d/scripts/quorum-store-gate.sh" >> "$GITHUB_ENV"

      - name: Verify quorum receipt
        # Reads a SIGNED receipt from the git ref refs/quorum/pr-<N> (<pr>/<headsha>.json
        # + .sig), not a committed .quorum/<branch>.json (a receipt binds to the head sha;
        # committing it would move the head) and not a store a runner can write (R34-3).
        # The signature is verified against scripts/quorum-allowed-signers from the PR BASE.
        # Fails closed on a missing ref, missing/invalid signature or unprovisioned signer.
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # author model ids come from the PR commits' Co-Authored-By trailers (per commit)
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          QUORUM_REPO: ${{ github.repository }}
        run: |
          bash "$QUORUM_BASE_GATE"
