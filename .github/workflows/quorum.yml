# Quorum receipt check — LAB (GATE/LAB rule C324; forjar#862, #876).
#
# This check is not required on main, so it cannot block a merge. A check that
# cannot block is LAB: it never runs inside a PR job. It runs nightly and by
# hand, verifies each open PR's head-bound receipt in the receipt store, and a
# red is one ticket with one owner, not a status on every PR.
# See docs/specifications/quorum-spec.md.
name: Quorum

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Verify one PR (default: every open PR)"
        required: false

concurrency:
  group: quorum-lab
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  receipt:
    name: quorum receipt
    # The receipt store is a lambda host path (/mnt/nvme-raid0/cop-inbox/promote-state);
    # only the lambda-night seats mount it (infra fleet/routing.yaml). Any other label
    # set can be scheduled on a store-less runner: "receipt store ... is missing".
    runs-on: [self-hosted, lambda-night]
    # A CARGO_HOME private to this job (infra#430/#775): the shared ~/.cargo is
    # swept by rust-cache's cleanRegistry under other jobs' builds.
    env:
      CARGO_HOME: ${{ github.workspace }}/../cargo-home-${{ github.job }}
      GH_TOKEN: ${{ github.token }}
      QUORUM_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify each open PR's receipt
        # The gate and its allowlist come from main, never from a PR's own copy.
        env:
          PR_INPUT: ${{ github.event.inputs.pr_number }}
        run: |
          fail=0
          if [ -n "$PR_INPUT" ]; then prs="$PR_INPUT"; else
            prs="$(gh pr list --state open --json number --jq '.[].number')"
          fi
          for pr in $prs; do
            git fetch -q origin "pull/$pr/head:refs/remotes/pr/$pr"
            head="$(git rev-parse "refs/remotes/pr/$pr")"
            base="$(gh pr view "$pr" --json baseRefOid --jq .baseRefOid)"
            git fetch -q origin "$base" || true
            if PR_NUMBER="$pr" PR_HEAD_SHA="$head" PR_BASE_SHA="$base" bash scripts/quorum-store-gate.sh; then
              echo "PASS #$pr"
            else
              echo "RED #$pr (LAB: one ticket, one owner)"; fail=1
            fi
          done
          exit "$fail"
