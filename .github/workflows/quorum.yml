# Quorum gate -- LAB check, nightly + manual (rule C324).
#
# This workflow cannot block a merge (the required ruleset context is only `gate`), so it
# is LAB: it never runs inside a PR job. It runs nightly on idle machines and by hand via
# workflow_dispatch (optionally for one PR), and verifies each open PR's receipt in the
# receipt STORE (#874). It is not a PR check; the local hook is fast feedback only.
# See docs/specifications/quorum-spec.md, "A local hook enforces nothing on its own".
# A red run is reported by its owner, who files the one ticket manually under C324.
# TODO(infra-cop): automate that ticket filing; no step in this workflow does it today.
name: Quorum

on:
  # Rule C324: this check cannot block a merge (the required ruleset context is only `gate`),
  # so it is LAB: it never runs inside a PR job. It runs nightly on idle machines, and by hand
  # with workflow_dispatch (optionally for one PR). It reads the receipt STORE since #874, not a
  # committed .quorum/<branch>.json. forjar#862.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "One PR number to check (empty = every open PR)"
        required: false
        type: string

# Nightly and manual runs get distinct groups so one never cancels the other; a repeat
# dispatch for the same PR supersedes the earlier one.
concurrency:
  group: quorum-lab-${{ github.event_name }}-${{ inputs.pr_number || 'all' }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  receipt:
    name: quorum receipt
    runs-on: [self-hosted, clean-room, ARM64]
    # Bash-only job: no cargo runs here, so no toolchain/cache steps and no CARGO_HOME.
    # The receipt store must be reachable from this runner (the runner/mount choice is
    # owned by infra; do not change runs-on here).
    steps:
      - uses: actions/checkout@v4
        with:
          # Default branch with full history; each PR head is fetched by number below.
          # The gate diffs against the merge-base with origin/main, so it needs
          # real history. A shallow clone makes `git merge-base` fail, which the
          # gate correctly treats as UNMEASURED -> exit 1 rather than a pass.
          fetch-depth: 0

      - name: Verify quorum receipt for each PR
        # JUDGE FROM BASE: per PR, the gate and its allowlist come from the PR BASE commit, never
        # the PR's own copy, so a PR cannot weaken the judge that reads it. Fails closed if the
        # base lacks either file. BOOTSTRAP: the first merge of the gate has no base copy and
        # fails closed (a one-off for the repo owner). The test-only author override is
        # deliberately NOT set; the gate ignores it in CI. A red here never blocks a PR.
        env:
          GH_TOKEN: ${{ github.token }}
          QUORUM_REPO: ${{ github.repository }}
          INPUT_PR: ${{ inputs.pr_number }}
        run: |
          set -uo pipefail
          if [ -n "$INPUT_PR" ]; then
            # untrusted input: digits only, before any use
            if ! [[ "$INPUT_PR" =~ ^[0-9]+$ ]]; then
              echo "FAIL: pr_number must match ^[0-9]+\$ (got a non-numeric value)" >&2
              exit 1
            fi
            prs=("$INPUT_PR")
          else
            # capture first so a gh failure cannot look like "no PRs" (fail closed, UNMEASURED)
            out=$(gh pr list --repo "$QUORUM_REPO" --state open --limit 1000 --json number --jq '.[].number') \
              || { echo '::error::gh pr list failed (UNMEASURED)'; exit 1; }
            prs=()
            while IFS= read -r line; do [ -n "$line" ] && prs+=("$line"); done <<<"$out"
            if [ "${#prs[@]}" -eq 0 ]; then
              echo "no open PRs; nothing checked"
              exit 0
            fi
          fi
          rc=0
          for n in "${prs[@]}"; do
            [[ "$n" =~ ^[0-9]+$ ]] || { echo "FAIL: bad PR number" >&2; rc=1; continue; }
            read -r head base < <(gh pr view "$n" --repo "$QUORUM_REPO" --json headRefOid,baseRefOid --jq '"\(.headRefOid) \(.baseRefOid)"') \
              || { echo "FAIL: gh pr view $n (UNMEASURED)" >&2; rc=1; continue; }
            git fetch -q origin "pull/$n/head" "$base" || { echo "FAIL: fetch PR $n" >&2; rc=1; continue; }
            d="$RUNNER_TEMP/quorum-base-gate-$n"
            rm -rf "${d:?}"; mkdir -p "$d/scripts"
            git show "$base:scripts/quorum-store-gate.sh" > "$d/scripts/quorum-store-gate.sh" \
              && git show "$base:scripts/quorum-models.json" > "$d/scripts/quorum-models.json" \
              || { echo "FAIL: PR $n base lacks the gate or allowlist" >&2; rc=1; continue; }
            echo "== PR #$n head $head"
            PR_NUMBER="$n" PR_HEAD_SHA="$head" PR_BASE_SHA="$base" bash "$d/scripts/quorum-store-gate.sh" || rc=1
          done
          exit "$rc"
