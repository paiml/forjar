# forjar#1021 (part of #1017): README.md is a graded document. `pv-readme --check`
# turns it into one readme:Readme node and validates it against the closed SHACL
# shape in contracts/readme-root.yaml; tests/readme-shape-falsifier.sh plants four
# defects and requires each to be refused.
#
# LAB, not GATE (C324): it cannot block a merge or a release, so it runs nightly
# on main and never on a PR. It moves into ci.yml's `gate` only after three
# green nights, with the operator's yes and one gate retired.
#
# WHY IT INSTALLS ITS OWN VERIFIER. The clean-room runners carry pv 0.65.2
# (aprender-contracts-cli), which predates pv-readme; the first run of this
# check died on `pv-readme: not installed`. Waiting on runner provisioning made
# the check absent, and an absent verifier is a NO-GO, never a skip. So the job
# installs the exact pinned crate itself (~64 s measured on t2yoga). If the
# install fails, the job fails: there is no path where the check does not run
# and the job is green.
name: readme-shape-lab

on:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  PV_README_CRATE: aprender-contracts-cli
  PV_README_VERSION: 0.72.3

jobs:
  readme-shape:
    name: readme-shape
    runs-on: [self-hosted, clean-room, X64]
    timeout-minutes: 20
    # The fleet rule (tests/falsification_every_ci_job_runs_on_the_fleet): a
    # self-hosted job that runs cargo keeps its registry to itself, outside the
    # workspace, so infra#430's reaper never sweeps it under a live install.
    env:
      CARGO_HOME: ${{ github.workspace }}/../cargo-home-${{ github.job }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install pinned pv-readme and pv
        run: |
          set -eu
          root="$RUNNER_TEMP/pv-readme"
          cargo install "${PV_README_CRATE}@=${PV_README_VERSION}" --locked \
            --root "$root" --bin pv-readme --bin pv
          for b in pv-readme pv; do
            [ -x "$root/bin/$b" ] || {
              echo "::error::$b did not install — README.md is unvalidatable, which is a NO-GO not a skip"
              exit 1
            }
          done
          echo "$root/bin" >> "$GITHUB_PATH"

      - name: pv-readme and pv are the pinned version
        run: |
          set -eu
          for b in pv-readme pv; do
            v="$("$b" --version | head -n 1)"
            echo "$v"
            case "$v" in
              "$b ${PV_README_VERSION} "*) ;;
              *) echo "::error::expected $b ${PV_README_VERSION}, got: $v"; exit 1 ;;
            esac
          done

      # pv-readme compares README.md with the COMMITTED census.json, never with
      # contracts/ itself, so a stale census would let a false count through.
      # The census is re-taken from contracts/ and must be byte-identical.
      - name: contracts/census.json is the live census of contracts/
        run: |
          set -eu
          live="$RUNNER_TEMP/census.live.json"
          pv census --format json contracts >"$live"
          cmp -s "$live" contracts/census.json || {
            diff -u contracts/census.json "$live" | head -n 40 || true
            echo "::error::contracts/census.json is stale: regenerate it with 'pv census --format json contracts > contracts/census.json'"
            exit 1
          }

      - name: README.md conforms to its readme:Readme shape
        run: pv-readme --check

      - name: A planted bad README must be refused
        run: bash tests/readme-shape-falsifier.sh
