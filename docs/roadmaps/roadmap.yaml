  acceptance_criteria:
  - 'forjar''s cargo provider check ran ''cargo install --list'' — cargo''s install RECORD — and treated a listed crate as installed. rust-cache''s post step deletes the real files in a shared ~/.cargo/bin without updating that record, so on intel 2026-08-19 forjar reported rustup-installer and stack-tool-{copia,forjar,pmat,pzsh} as ''no changes'' on a host with no rustup, no cargo and no rustc: 5 of 5 falsely converged, exit 0. Fix: use the record only to learn WHICH binaries a crate owns, then run each one, resolving through $CARGO_HOME/bin so GH-257''s PATH-independence survives. Includes a cargo-subcommand fallback (cargo-X X --version) because cargo-mutants and cargo-llvm-cov reject a bare --version and would otherwise be reported missing forever, forcing a ~10min recompile per apply.'
