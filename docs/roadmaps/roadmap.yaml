  item_type: task
  title: cargo package check trusted the install record, not the binary
  status: planned
  priority: medium
  assigned_to: null
  created: 2026-08-19T08:51:46Z
  updated: 2026-08-19T08:51:46Z
  spec: null
  acceptance_criteria:
  - 'forjar''s cargo provider check ran ''cargo install --list'' — cargo''s install RECORD — and treated a listed crate as installed. rust-cache''s post step deletes the real files in a shared ~/.cargo/bin without updating that record, so on intel 2026-08-19 forjar reported rustup-installer and stack-tool-{copia,forjar,pmat,pzsh} as ''no changes'' on a host with no rustup, no cargo and no rustc: 5 of 5 falsely converged, exit 0. Fix: use the record only to learn WHICH binaries a crate owns, then run each one, resolving through $CARGO_HOME/bin so GH-257''s PATH-independence survives. Includes a cargo-subcommand fallback (cargo-X X --version) because cargo-mutants and cargo-llvm-cov reject a bare --version and would otherwise be reported missing forever, forcing a ~10min recompile per apply.'
  phases: []
  subtasks: []
  estimated_effort: null
  labels: []
  notes: null
- id: PMAT-135
  github_issue: null
  item_type: task
  title: forjar --refresh was a dead flag, and repair failed on dangling symlinks
  status: planned
  priority: medium
  assigned_to: null
  created: 2026-08-19T09:12:10Z
  updated: 2026-08-19T09:12:10Z
  spec: null
  acceptance_criteria:
  - 'Two defects found by falsifying the PMAT-134 fix against the live host. (1) ApplyConfig::refresh was declared, documented in --help as ''Re-run check scripts, only re-apply what fails'', threaded through every call site, and read by NOTHING in production code. ''forjar apply --refresh'' returned in 0.1s without contacting the host and reported ''1 unchanged'' over a dangling symlink whose own check script printed ''missing:'' and exited 1. This is the mechanism by which the 2026-08-19 toolchain outage stayed invisible: apply decides from the lock file, never the host. Fixed via refresh_locks - run each in-scope resource''s check on its host, evict failing lock entries so the planner re-plans exactly those; scoped by -t/-r/-m; exit 2 (not-applicable) and transport errors are not failures. Plain apply stays lock-based, pinned by a test. (2) Once refresh worked the apply died on ''cp: not writing through dangling symlink'' - the one state the resource most needs to repair. ''cp -f'' is refused too (verified on host). Placement changed to ''install -m 755'' (POSIX; cp --remove-destination is GNU-only). Verified end-to-end on intel: inject dangling symlink, apply --refresh, 1 converged, pzsh 0.3.6 restored as a real file.'
  phases: []
  subtasks: []
  estimated_effort: null
  labels: []
  notes: null
- id: PMAT-136
  github_issue: null
  item_type: task
  title: forjar could not replace a binary that was running, and its repair path
    was not atomic
  status: planned
  priority: medium
  assigned_to: null
  created: 2026-08-29T18:00:00Z
  updated: 2026-08-29T18:00:00Z
  spec: null
  acceptance_criteria:
  - 'Three code paths placed an executable with a plain ''cp'', which opens the destination
    in place and is therefore refused by the kernel for a RUNNING binary (ETXTBSY,
    "Text file busy") and by coreutils for a DANGLING SYMLINK — the two states forjar
    most needs to repair. Verified by executing the generated shell, not by reading
    it: github_release.rs:147 (live on the fleet for rclone, age, sops into /usr/local/bin
    and apr, batuta, renacer into a shared ~/.cargo/bin) and dist_generators.rs:384/399,
    the generated install.sh — the ''curl | sh'' path by which every sovereign tool
    is UPGRADED, so the destination is routinely the binary the user just ran. The
    cost was a machine: paiml/infra''s lambda-labs self-applies, so its forjar.yaml
    left forjar undeclared (":155", ":207") and the box drifted to 1.20.1 while the
    fleet ran 1.21.x, which made its sovereign YAML guard NO-GO. NOTE the ":207" claim
    — that a cargo resource cannot re-install the running forjar — was already FALSE:
    the cargo provider moved to install(1) in v1.15.0 (PMAT-135) and cargo install
    itself stages and renames. (2) install(1), PMAT-135''s fix, clears both refusals
    but is NOT atomic: GNU unlinks the destination then creates it, so the path is
    briefly absent and a concurrent exec fails ENOENT — which matters on a host where
    sixteen CI runners share one $CARGO_HOME/bin. Measured on lambda-labs over 4000
    replacements: install(1) 10611 absent of 396132 stats; temp+mv 0 of 741725. Fix:
    one emitted shell helper, core::shell_install::_fj_install_bin — stage a SIBLING
    of the destination (so the rename stays on one filesystem) then mv -f, i.e. rename(2),
    which neither opens the destination nor follows it and leaves no window. Used by
    all three sites, replacing both cp and install(1) so there is one mechanism rather
    than three. Poka-yoke: tests/falsification_replace_running_binary.rs executes each
    generator against a genuinely running binary and a genuinely dangling symlink, and
    proven to discriminate by reverting the helper to cp (4 red) and to install(1) (the
    atomicity probe red, 10252 of 356398 absent).'
  phases: []
  subtasks: []
  estimated_effort: null
  labels: []
  notes: null
- id: PMAT-159
  github_issue: null
  item_type: task
  title: 'sudo: true ran nothing for a non-root user — the wrapper passed the script on fd 3 and sudo closes fd 3'
  status: inprogress
  priority: high
  assigned_to: null
  created: 2026-09-05T08:49:18Z
  updated: 2026-09-05T08:50:21.253426742+00:00
  spec: null
  acceptance_criteria:
  - 'Measured 2026-09-05 on lambda-labs, forjar 1.24.0: in_declared_privilege_context (src/core/codegen/dispatch.rs) emits ''sudo bash /dev/fd/3 3<<DELIM'' for every sudo: true resource run by a non-root user. sudo''s closefrom default closes every descriptor >= 3 before exec, so the elevated bash reports ''/dev/fd/3: No such file or directory'' and exits 127 — apply, check and state_query alike, since all three share the wrapper. Repro: ''sudo bash /dev/fd/3 3<<<echo'' fails, ''sudo bash -s <<<echo'' works. The unit tests asserted the TEXT of the form and stayed green. Fix: cross the sudo boundary as a private 0600 temp file (mktemp, quoted heredoc, ''sudo bash <tmp>'', EXIT trap removes it), keeping stdin as the transport left it. Tests: unit test asserting no /dev/fd in the sudo form; integration test that EXECUTES the wrapper under real sudo (gated on uid != 0 and ''sudo -n true''), asserting exit code, stdout and that the temp file is gone; discrimination proven by reverting the emitter.'
  phases: []
  subtasks: []
  estimated_effort: null
  labels: []
  notes: null
