  assigned_to: null
  created: 2026-09-05T17:53:20Z
  updated: 2026-09-07T12:00:00Z
  spec: null
  acceptance_criteria:
  - 'Measured 2026-09-05 on forjar 1.24.0 -> 1.25.2 (paiml/forjar#469, found by paiml/infra#442): paiml/infra keeps ONE state/ dir for six machine manifests (machines/<m>/forjar.yaml, each with its own name:), and every machines/*/Makefile applies with --state-dir state. Two correct applies in a row of different configs each printed the #377 warning ("state dir ... was last applied by stack ''forjar-clean-room''; this apply re-stamps it as ''lambda-labs'' ... forjar undo refuses this combination") although each touched only its own lock section. The lock file is already keyed by config name; the stamp is a single value, so for this layout the warning is a false positive on every apply and undo refuses a layout apply supports.'
  - 'Fix: the state stamp becomes a per-name map keyed exactly as the lock is (name -> {file, applied_at, ...}); apply writes only its own name''s entry. The #377 warning fires only when the SAME name''s entry was last written from a different -f (the rename / wrong-stack case it was built for) — that case still warns, and the #377 tests stay green with their intent unchanged. Six stacks through one state dir produce zero warnings.'
  - 'NARROWED 2026-09-06 (owner decision): generations are numbered per state dir and a restore is whole-dir, so stack-scoped restore is spec-first (PMAT-162). This release: undo, undo --resume, rollback and apply --rollback-on-failure REFUSE — before anything is destroyed or applied — while the dir holds more than one stack, naming PMAT-162 and listing the stacks; a single-stack dir (including a migrated legacy one) restores exactly as before. A rename (same file, new name) is one lineage: the old stamp is retired on the next apply and undo''s replay stamps as the invoking stack.'
  - 'Migration: a state dir carrying the old single stamp is migrated on the first apply (or undo) that reads it — the old stamp becomes the entry for its own name, nothing is dropped, the sidecar/integrity hash is re-sealed by the same write, and no warning fires on that first apply unless the #377 condition genuinely holds. Migration is idempotent and covered by a test whose fixture was written in the pre-fix format; an older forjar reading the new format fails closed with a message naming the format, never silently.'
  - 'Widened after the plan grill (agy teamwork lane, 2026-09-06): calling the layout supported also requires (i) a machine-ownership guard — a machine name already recorded under another stack''s entry is the same wrong-stack condition as a same-name-different-file stamp (warn on apply, refuse on undo), because generations and per-machine locks are keyed by machine name only; (ii) per-stack outputs — persist_outputs merges this stack''s outputs into the map and removes only keys this stack owned, instead of replacing the whole map; (iii) forjar status attributes each machine to the stack that wrote it, from the stacks map, not to the last-applied name; (iv) the config identity in the stamp is the config path relative to the state dir when both share a tree (absolute otherwise), so the same checkout layout at another path is the same stack; (v) a migrated legacy stamp (file unknown) matches any file on the first post-upgrade apply and is then pinned — documented as the one-apply window.'
  - 'Documented: shared --state-dir (one state dir, N configs, each applied with -f machines/<m>/forjar.yaml --state-dir state) is stated as supported for apply, status and the wrong-stack guard in the state-dir book page and the --state-dir CLI help, with the two refusal conditions and the multi-stack restore refusal explained next to it. CHANGELOG entry references #469 and #377; the PR answers and closes #469.'
  phases: []
  subtasks: []
  estimated_effort: null
  labels:
  - bug
  - state
  - undo
  notes: 'Completed in 1.26.0 by #473. state stamp keyed by config name; shipped narrowed to shared --state-dir for apply/status/stack_conflict, undo refused in a multi-stack dir'
