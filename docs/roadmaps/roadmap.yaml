  - release:v1.29.0
  notes: 'Measured 2026-09-10 on run 34530301814, the re-dispatch that carried PMAT-230''s fix: every asset job succeeded, publish-release reported success, and the release stayed draft=true — because the step is guarded by `if [ "${{ needs.create-release.outputs.created }}" = "true" ]` and this run did not create the release, the earlier failed run did. The assertion that would have caught it is behind the same guard, so the job passes while doing nothing. A release whose creating run fails after create-release can therefore never be published by the workflow; v1.28.0 was un-drafted by hand.'
