  - no test uses "is a sibling checkout present" as a proxy for "does THIS repo ship the corpus this test queries" — the two are different questions and only the second decides whether the assertion can hold
  - a test that needs a corpus forjar does not ship is gated by the aprender-corpus feature and says so in its ignore reason, exactly as violations_enrichment already is
  phases: []
  subtasks: []
  estimated_effort: null
  labels:
