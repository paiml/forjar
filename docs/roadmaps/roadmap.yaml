  item_type: task
  title: 'S1: release.yml''s dist-artifacts job resolves checksums from the release download URL, which 404s while the release is still a draft — the 1.26.0 run failed there and the release had to be finished by hand'
  status: inprogress
  priority: high
  assigned_to: null
  created: 2026-09-08T15:30:00Z
  updated: 2026-09-08T15:30:00Z
  spec: null
  acceptance_criteria:
  - 'dist-artifacts downloads SHA256SUMS from the draft release with gh (authenticated, works on drafts) and passes --checksums-file, so it never depends on the public download URL'
  - 'a falsification test pins the workflow shape: the dist step passes --checksums-file and the step that fetches it runs before it'
  phases: []
  subtasks: []
  estimated_effort: null
  labels:
  - kind:code
  notes: 'Measured on the 1.26.0 release run (34224834188): every asset uploaded, then `forjar dist --all --version v1.26.0` exited 1 with ''cannot resolve checksums for release asset(s) ...'' because src/cli/dist_checksums.rs fetches https://github.com/<repo>/releases/download/<tag>/<asset>, which is not served for a draft. PMAT-166 made the release a draft until the asset jobs finish, which is right; the dist job is what has to change. forjar already ships the escape hatch the error names: --checksums-file. The 1.26.0 installer was generated by hand from the tag with that flag and uploaded, and the release was promoted by hand.'
- id: PMAT-212
  kind: code
  github_issue: 488
  item_type: task
  title: 'S1: drift -f walks every stack in the state dir, and a stack absent from that config is judged against the LOCAL filesystem — one box''s resources reported as another''s, and a remote file''s hash taken from the workstation (#488, #485)'
  status: completed
  priority: high
  assigned_to: null
  created: 2026-09-08T17:26:44Z
  updated: 2026-09-08T18:40:00Z
  spec: null
  acceptance_criteria:
  - 'drift -f <config> checks only the machines that config declares, and reports no finding for a stack it does not declare'
  - '--all-stacks asks the wide question explicitly, and paiml/infra''s aggregating tripwire keeps working through it'
  - 'every DRIFTED row names its machine, so an aggregated run can be attributed after the fact'
  - '-m naming a machine the config does not declare is refused by name rather than scanning zero machines and reporting clean'
  - 'a machine the config declares that has never been applied is still not an error'
  phases: []
  subtasks: []
  estimated_effort: null
  labels:
  - kind:code
  notes: 'Filed by the operator 2026-09-08 as #488, measured at 31 stacks checked from a config declaring one machine. #485 is the same defect seen from the other side: check_machine_drift resolves a stack with config.machines.get(name), so a stack the config does not declare falls to the lock-only arm and is compared against the LOCAL filesystem — another computer''s file judged by the workstation''s copy of the path, which is why a byte-identical file reported DRIFTED with two stable different hashes. Fixed by scoping the state-dir walk, so the stack is never opened and there is no arm to fall to. Closes both.'
