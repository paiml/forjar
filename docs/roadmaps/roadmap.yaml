- id: PMAT-200
  kind: code
  github_issue: 462
  item_type: task
  title: 'Homebrew formula publishing needs a HOMEBREW_TAP_TOKEN secret the operator has not provisioned — an operator decision, no secret is added by the release program (GH #462, 1.27)'
  status: planned
  priority: low
  assigned_to: null
  created: 2026-09-07T12:00:00Z
  updated: 2026-09-07T12:00:00Z
  spec: null
  acceptance_criteria: []
  phases: []
  subtasks: []
  estimated_effort: null
  labels:
  - kind:code
  notes: '§3 of the 1.26.0 release brief forbids adding registry or publish secrets; the job stays deprioritized until the operator provisions the token. SUPERSEDES PMAT-233 (2026-09-11): the mechanism is now measured, not inferred. On run 34530301814 the homebrew job reached `Cloning into /tmp/tap` for the first time -- PMAT-230''s fixes carried it past two earlier failures -- and died on `remote: Invalid username or token. Password authentication is not supported for Git operations.` The step declares `GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}` and its log shows `GH_TOKEN:` with an empty value, while the one sibling step that declares a token takes it from `secrets.GITHUB_TOKEN` and logs `GH_TOKEN: ***`. That is this ticket''s missing secret seen from the inside: the name resolves to nothing, so the clone URL authenticates as nobody. The homebrew job is not on publish-release''s needs, so it has never blocked a release; it has simply never worked.'
