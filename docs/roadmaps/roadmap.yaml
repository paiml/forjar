  - the assertion runs UNCONDITIONALLY and asserts only that the release is not a draft, so an un-draft that did not happen is a failure rather than a skip; prerelease=true is deliberately not asserted, because a re-dispatch over a release an operator has promoted to a full release must leave it promoted, and rule 4 already asserts prerelease=true draft=true for a run that creates one
  - the edit is conditional on the release BEING a draft, so that same re-dispatch cannot demote a published release back to a prerelease
  - a rule in tests/falsification_release_workflow_shape.rs pins it and is red against the workflow as it stands today
  phases: []
  subtasks: []
  estimated_effort: null
  labels:
