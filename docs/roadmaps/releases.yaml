# Release goals — the DECLARED side (PMAT-225, forjar#506).
#
# scripts/dogfood/tagged.sh (gate T) is the MEASURED side: it re-derives every
# row below from the tags git holds and the PRs GitHub reports merged, and
# FAILS by name wherever this file disagrees. scripts/release-goal.sh show
# joins the two into one status line; `release-goal.sh window TAG` prints the
# measured row to paste here; `release-goal.sh cut TAG --next NEXT` writes it
# after a tag is cut. Edit as text. Quote nothing that is not quoted here.
#
# cadence_days   a cut is due this many days after the previous one; past the
#                due instant with PRs merged and no version bump, gate T is red
# floor          the first tag whose window names a pmat ticket; nothing older
#                is declared and nothing older is checked
# harness_floor  from here every PR in a window names a roadmap ticket (gate A's
#                regime, PMAT-163); below it a window may hold unticketed PRs
# dogfood_floor  from here every tag has docs/audits/dogfood-<ver>-receipt.md
#                and docs/audits/crux-<ver>.md at HEAD
# releases[]     tag, cut (the tag's creation instant, UTC), prs (every PR whose
#                merge commit the tag contains and the previous tag does not),
#                tickets (every roadmap row those PRs name in branch or title)
# next           the open goal: the tag the merged-since-newest window ships
#                in, and the instant it is due (previous cut + cadence_days)
#
# Every ticket a row names carries the label `release:<tag>` in roadmap.yaml;
# every ticket merged since the newest tag carries `release:<next.tag>`.
cadence_days: 2
floor: v1.25.0
harness_floor: v1.26.0
dogfood_floor: v1.26.0
